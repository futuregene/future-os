name: Rust CI runner

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      mode:
        required: true
        type: string
      projects:
        required: true
        type: string

permissions:
  contents: read

jobs:
  crates:
    name: ${{ matrix.name }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.projects) }}
    env:
      CI_PACKAGES: ${{ toJSON(matrix.packages) }}
      CARGO_PROFILE_TEST_DEBUG: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup pinned Rust
        run: node scripts/ci/setup-rust.mjs
      - name: fmt
        if: inputs.mode == 'check'
        run: node scripts/ci/rust-checks.mjs fmt
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-${{ matrix.desktop && 'desktop' || 'core' }}
          # Core groups share one cache per OS. CLI composes the core crates,
          # so it is the sole core writer; Desktop owns the separate GUI cache.
          # Checks/PRs/Misc are readers and cannot evict main with private copies.
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.mode == 'test' && (matrix.desktop || matrix.name == 'tui-cli') }}
          workspaces: .
          cache-all-crates: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-apt-packages.sh build-essential binutils mold pkg-config
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux' && matrix.desktop
        run: |
          bash scripts/ci/install-apt-packages.sh libayatana-appindicator3-dev \
            libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev
      - name: Install isolated Host broker
        if: runner.os == 'Linux' && inputs.mode == 'test' && contains(matrix.packages, 'future-host')
        run: bash scripts/ci/install-apt-packages.sh nats-server
      - name: Build
        if: inputs.mode == 'test'
        run: node scripts/ci/rust-checks.mjs build
      - name: Tests
        if: inputs.mode == 'test'
        env:
          FUTURE_HOST_FIXTURE_TIMINGS: ${{ runner.os == 'Windows' && contains(matrix.packages, 'future-host') && format('{0}/host-fixture-timings.jsonl', runner.temp) || '' }}
        run: node scripts/ci/rust-checks.mjs test
      - name: Summarize Host fixture timings
        if: always() && inputs.mode == 'test' && runner.os == 'Windows' && contains(matrix.packages, 'future-host')
        run: node scripts/ci/host-test-timings.mjs "${{ runner.temp }}/host-fixture-timings.jsonl"
      - name: Upload Host fixture timings
        if: always() && inputs.mode == 'test' && runner.os == 'Windows' && contains(matrix.packages, 'future-host')
        uses: actions/upload-artifact@v7
        with:
          name: host-windows-fixture-timings
          path: ${{ runner.temp }}/host-fixture-timings.jsonl
          if-no-files-found: error
      - name: clippy
        if: inputs.mode == 'check'
        run: node scripts/ci/rust-checks.mjs clippy
