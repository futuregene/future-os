name: Build Android APK

permissions: read-all

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Exact version supplied by the coordinator.
        required: true
        type: string
      build_number:
        description: Monotonic Android versionCode supplied by the coordinator.
        required: true
        type: string
      coordinated:
        description: Let the caller publish the collected artifact.
        required: false
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      OSS_ENDPOINT:
        required: false
      OSS_BUCKET:
        required: false
      OSS_ACCESS_KEY_ID:
        required: false
      OSS_ACCESS_KEY_SECRET:
        required: false

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Resolve version
        env:
          FUTURE_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          version="$(node scripts/version.mjs)"
          build_number="${INPUT_BUILD_NUMBER:-${{ github.run_number }}}"
          echo "FUTURE_VERSION=$version" >> "$GITHUB_ENV"
          echo "FUTURE_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Android version: $version (build $build_number)"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Setup ossutil
        if: github.event_name == 'workflow_dispatch' && !inputs.coordinated
        run: bash scripts/setup-ossutil.sh

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p mobile/android/app
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/futureos-release.keystore
          cat > mobile/android/app/keystore.properties <<EOF
          storeFile=futureos-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=futureos
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate version
        working-directory: mobile
        run: npm run gen-version

      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk \
             "FutureOS_${FUTURE_VERSION}_android-universal.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: futureos-android-apk
          if-no-files-found: error
          overwrite: true
          path: FutureOS_*_android-universal.apk
          retention-days: 3

      - name: Upload APK to OSS
        if: github.event_name == 'workflow_dispatch' && !inputs.coordinated
        run: |
          set -euo pipefail
          APK="FutureOS_${FUTURE_VERSION}_android-universal.apk"
          ossutil cp -f "$APK" "oss://$OSS_BUCKET/test/$FUTURE_VERSION/$APK"
          ossutil stat "oss://$OSS_BUCKET/test/$FUTURE_VERSION/$APK"
          echo "==> Download URL:"
          echo "https://dl.future-os.cn/test/$FUTURE_VERSION/$APK"
