name: Mobile native IO

on:
  pull_request:
    paths:
      - 'mobile/modules/future-share-intent/android/**'
      - 'scripts/test-mobile-share-io.py'
      - '.github/workflows/mobile-native-io.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/modules/future-share-intent/android/**'
      - 'scripts/test-mobile-share-io.py'
      - '.github/workflows/mobile-native-io.yml'

permissions:
  contents: read

jobs:
  share-io:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/test-mobile-share-io.py
