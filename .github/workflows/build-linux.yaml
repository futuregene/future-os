name: Build Linux

permissions: read-all

# Linux packages have no platform code-signing identity. Coordinated .deb files
# are nevertheless signed with the existing Tauri updater key so clients can
# authenticate them before invoking the system package manager.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Exact release version supplied by the coordinator.
        required: true
        type: string
      artifact_version:
        description: Public artifact version supplied by the coordinator.
        required: true
        type: string
      release:
        description: Build updater-enabled artifacts for a coordinator.
        required: false
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAURI_UPDATER_PUBLIC_KEY:
        required: false
      OSS_ENDPOINT:
        required: false
      OSS_BUCKET:
        required: false
      OSS_ACCESS_KEY_ID:
        required: false
      OSS_ACCESS_KEY_SECRET:
        required: false

jobs:
  build:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            deb_arch: amd64
          # Build natively: cross-compiling the WebKit-heavy GUI would require
          # a complete aarch64 sysroot.
          - arch: aarch64
            os: ubuntu-24.04-arm
            deb_arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve version
        env:
          FUTURE_VERSION: ${{ inputs.version }}
          FUTURE_ARTIFACT_VERSION: ${{ inputs.artifact_version }}
          FUTURE_BUILD_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && !inputs.version && 'dev' || '' }}
        run: |
          set -euo pipefail
          resolved="$(node scripts/version.mjs --json)"
          version="$(node -p 'JSON.parse(process.argv[1]).version' "$resolved")"
          artifact_version="$(node -p 'JSON.parse(process.argv[1]).artifactVersion' "$resolved")"
          echo "FUTURE_VERSION=$version" >> "$GITHUB_ENV"
          echo "FUTURE_ARTIFACT_VERSION=$artifact_version" >> "$GITHUB_ENV"
          echo "Linux version: $version (artifacts $artifact_version)"

      - name: Setup Rust
        run: node scripts/ci/setup-rust.mjs

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      - name: Install Linux system dependencies
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            curl \
            file \
            mold \
            binutils \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            musl-tools \
            patchelf \
            wget

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Set Tauri bundle version
        run: node scripts/version.mjs --set-bundle

      # The musl CLI and headless server share one dependency graph. The GUI
      # requires GNU/GTK and is built separately; those target artifacts cannot
      # be reused across musl and GNU.
      - name: Build static CLI and headless desktop
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          set -euo pipefail
          target="${{ matrix.arch }}-unknown-linux-musl"
          rustup target add "$target"
          cargo build --release --target "$target" -p future-cli -p futureos \
            --no-default-features --features futureos/headless \
            --bin future --bin futureos-headless
          bash scripts/ci/check-headless-linux.sh "target/$target/release/futureos-headless"
          mkdir -p target/release
          cp "target/$target/release/futureos-headless" "target/release/futureos-headless"
          tar -czf "cli/FutureOS_${FUTURE_ARTIFACT_VERSION}_linux_${{ matrix.arch }}-cli.tar.gz" \
            -C "target/$target/release" future
          echo "FUTURE_DESKTOP_CLI=target/$target/release/future" >> "$GITHUB_ENV"

      - name: Build desktop bundle (.deb)
        if: inputs.release != true
        working-directory: desktop
        run: npm run tauri:build

      # Coordinated Linux builds embed the same updater trust root and endpoint as
      # macOS and Windows. The .deb itself is signed after it is renamed below;
      # createUpdaterArtifacts is intentionally omitted because no AppImage is
      # produced by this workflow.
      - name: Build desktop bundle (.deb, updater-enabled)
        if: inputs.release == true
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${TAURI_UPDATER_PUBLIC_KEY:?TAURI_UPDATER_PUBLIC_KEY secret is required}"
          overlay="$RUNNER_TEMP/tauri.linux-updater.json"
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              plugins: {
                updater: {
                  pubkey: process.env.TAURI_UPDATER_PUBLIC_KEY,
                  endpoints: [
                    "https://dl.future-os.cn/releases/latest.json"
                  ]
                }
              }
            }));
          ' "$overlay"
          npm --prefix desktop run tauri:build -- --config "$overlay"

      - name: Assemble portable bundle
        run: |
          set -euo pipefail
          dir="futureos-portable-linux"
          mkdir -p "$dir"
          cp "target/release/futureos" "$dir/futureos"
          cp "target/release/futureos-headless" "$dir/futureos-headless"
          cp "target/${{ matrix.arch }}-unknown-linux-musl/release/future" "$dir/future"
          chmod +x "$dir"/*
          cp "docs/dist/readme-linux.txt" "$dir/Readme.txt"
          mkdir -p "$dir/licenses/goal"
          cp LICENSE "$dir/licenses/"
          cp orchestration/goal/LICENSE orchestration/goal/NOTICE orchestration/goal/UPSTREAM.md "$dir/licenses/goal/"
          tar -czf "FutureOS_${FUTURE_ARTIFACT_VERSION}_linux_${{ matrix.arch }}-portable.tar.gz" \
            -C "$dir" .

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t debs < <(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print)
          [[ ${#debs[@]} -eq 1 ]] || {
            echo "Expected exactly one .deb bundle, found ${#debs[@]}." >&2
            exit 1
          }
          release_deb="release-assets/FutureOS_${FUTURE_ARTIFACT_VERSION}_${{ matrix.deb_arch }}.deb"
          mv "${debs[0]}" "$release_deb"
          portable="release-assets/FutureOS_${FUTURE_ARTIFACT_VERSION}_linux_${{ matrix.arch }}-portable.tar.gz"
          mv "FutureOS_${FUTURE_ARTIFACT_VERSION}_linux_${{ matrix.arch }}-portable.tar.gz" "$portable"
          mv "cli/FutureOS_${FUTURE_ARTIFACT_VERSION}_linux_${{ matrix.arch }}-cli.tar.gz" "release-assets/"

          # The signed updater artifact is this exact .deb, so verify its
          # payload before signing. Also guard the separately published
          # portable archive against silently dropping the standalone entry.
          deb_extract_dir="$(mktemp -d)"
          dpkg-deb --extract "$release_deb" "$deb_extract_dir"
          [[ -x "$deb_extract_dir/usr/bin/futureos-headless" ]] || {
            dpkg-deb --contents "$release_deb" >&2
            echo "The .deb does not contain executable /usr/bin/futureos-headless." >&2
            exit 1
          }
          tar -tzf "$portable" ./futureos-headless >/dev/null

      - name: Verify actual deb, portable and CLI payloads
        run: python3 scripts/ci/check-packaged-entrypoints.py linux --version "$FUTURE_VERSION"

      - name: Upload package verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: futureos-linux-${{ matrix.arch }}-package-smoke
          path: target/package-smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: Sign updater artifact
        if: inputs.release == true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY secret is required}"
          deb="release-assets/FutureOS_${FUTURE_ARTIFACT_VERSION}_${{ matrix.deb_arch }}.deb"
          npm --prefix desktop exec -- tauri signer sign "$deb"
          [[ -s "$deb.sig" ]] || {
            echo "Tauri produced no updater signature for $deb" >&2
            exit 1
          }

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: futureos-linux-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          path: release-assets/
          retention-days: 7

      - name: Setup ossutil for standalone dev build
        if: github.event_name == 'workflow_dispatch' && !inputs.version
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
        run: bash scripts/release/setup-ossutil.sh

      - name: Upload standalone dev artifacts to OSS
        if: github.event_name == 'workflow_dispatch' && !inputs.version
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          target="oss://$OSS_BUCKET/dev/$FUTURE_ARTIFACT_VERSION"
          ossutil cp -r -f release-assets/ "$target/"
          for artifact in release-assets/*; do
            name="$(basename "$artifact")"
            ossutil stat "$target/$name"
            echo "https://dl.future-os.cn/dev/$FUTURE_ARTIFACT_VERSION/$name"
          done
