name: TypeScript CI runner

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      projects:
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'test' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.projects) }}
    env:
      CI_DIRECTORY: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck
        if: inputs.mode == 'test'
        run: node scripts/ci/typescript-checks.mjs typecheck
      - name: Build
        if: inputs.mode == 'test'
        run: node scripts/ci/typescript-checks.mjs build
      - name: Tests
        if: inputs.mode == 'test'
        run: node scripts/ci/typescript-checks.mjs test
      - name: ESLint and applicable Stylelint
        if: inputs.mode == 'check'
        run: node scripts/ci/typescript-checks.mjs lint
