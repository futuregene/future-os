name: Fusion benchmark checks

on:
  pull_request:
    paths:
      - 'benchmark/fusion/**'
      - '.github/workflows/benchmark-fusion.yml'
  push:
    branches: [main]
    paths:
      - 'benchmark/fusion/**'
      - '.github/workflows/benchmark-fusion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned linter
        run: |
          python3 -m venv benchmark/fusion/.venv
          benchmark/fusion/.venv/bin/python -m pip install ruff==0.14.3
      - name: Check Python
        run: |
          benchmark/fusion/.venv/bin/ruff check benchmark/fusion
          benchmark/fusion/.venv/bin/ruff format --check benchmark/fusion
      - name: Check offline protocol invariants
        run: benchmark/fusion/.venv/bin/python -m unittest discover -s benchmark/fusion/tests -p 'test_*.py' -v
      - name: Verify committed frozen questions without downloading the full datasets
        run: |
          benchmark/fusion/.venv/bin/python benchmark/fusion/bench.py check-suite --suite benchmark/fusion/suites/smoke.json
          benchmark/fusion/.venv/bin/python benchmark/fusion/bench.py check-suite --suite benchmark/fusion/suites/dev-12.json
