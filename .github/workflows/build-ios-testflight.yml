name: Build iOS TestFlight

permissions: read-all

# Manual iOS distribution build. Imports the iOS Distribution certificate and
# App Store provisioning profile from secrets, builds a signed Release .ipa with
# Expo prebuild + xcodebuild, uploads it to TestFlight via altool, and mirrors
# the .ipa to OSS.
#
# TestFlight requires a plain numeric marketing version. It was pinned at `0.0.1`
# until 0.0.1's build number hit 31479016198 (the old github.run_id counter).
# TestFlight enforces a monotonically increasing build number per marketing
# version, so switching back to small run_number build numbers under 0.0.1 would
# be rejected. Bumping the marketing version to `0.0.2` resets the build-number
# sequence, letting it restart at 1. The store build number (CFBundleVersion /
# Android versionCode) comes from `github.run_number` via FUTURE_BUILD_NUMBER —
# this workflow's per-repo counter starting at 1. It must stay small: Android
# versionCode is an int32, and `github.run_id` (a GitHub-wide counter) already
# exceeds its limit. Bump the marketing version here only when cutting a real
# release or resetting the TestFlight build-number sequence again.
#
# Keep this workflow restricted to trusted triggers: it imports signing
# credentials and submits software to Apple's TestFlight service. Do not add
# pull_request or other events that can execute untrusted code with them.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Exact marketing version supplied by the coordinator.
        required: true
        type: string
      build_number:
        description: Monotonic App Store build number supplied by the coordinator.
        required: true
        type: string
      coordinated:
        description: Let the caller handle release publication.
        required: false
        type: boolean
        default: false
    secrets:
      IOS_DIST_CERT_P12_BASE64:
        required: true
      IOS_DIST_CERT_P12_PWD:
        required: true
      IOS_PROVISIONING_PROFILE_BASE64:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER:
        required: true
      OSS_ENDPOINT:
        required: false
      OSS_BUCKET:
        required: false
      OSS_ACCESS_KEY_ID:
        required: false
      OSS_ACCESS_KEY_SECRET:
        required: false

jobs:
  version:
    name: Resolve TestFlight version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve build number
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          # Marketing version bumped to 0.0.2: TestFlight already accepted
          # 0.0.1 with build number 31479016198, so 0.0.1's sequence can only
          # increase; small run_number values must start fresh under 0.0.2.
          # The store build number is this workflow's per-repo run counter
          # (starts at 1; stays within int32).
          version="${INPUT_VERSION:-0.0.2}"
          build_number="${INPUT_BUILD_NUMBER:-${{ github.run_number }}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "TestFlight version: $version (build $build_number)"

  build:
    name: Build and upload TestFlight
    needs: version
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      FUTURE_VERSION: ${{ needs.version.outputs.version }}
      FUTURE_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # Import the base64-encoded iOS Distribution certificate into an ephemeral
      # keychain, resolve its identity, and write the provisioning profile.
      - name: Install Apple signing certificate
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PWD: ${{ secrets.IOS_DIST_CERT_P12_PWD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${IOS_DIST_CERT_P12_BASE64:?IOS_DIST_CERT_P12_BASE64 secret is required}"
          : "${IOS_DIST_CERT_P12_PWD:?IOS_DIST_CERT_P12_PWD secret is required}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?IOS_PROVISIONING_PROFILE_BASE64 secret is required}"

          keychain="$RUNNER_TEMP/futureos-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/futureos-ios-signing.p12"
          profile="$RUNNER_TEMP/FutureOS_AppStore.mobileprovision"

          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          # Extract the profile's display name (from its embedded plist) so the
          # archive step can select it via PROVISIONING_PROFILE_SPECIFIER.
          profile_name="$(security cms -D -i "$profile" 2>/dev/null \
            | plutil -extract Name raw - 2>/dev/null || true)"
          if [[ -z "$profile_name" ]]; then
            echo "Could not read provisioning profile name from: $profile" >&2
            exit 1
          fi
          echo "PROVISIONING_PROFILE=$profile_name" >> "$GITHUB_ENV"
          echo "Provisioning profile: $profile_name"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$IOS_DIST_CERT_P12_PWD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"

          identity_line="$(security find-identity -v -p codesigning "$keychain" \
            | grep '"iPhone Distribution:' | head -n 1 || true)"
          if [[ -z "$identity_line" ]]; then
            echo "No iPhone Distribution identity found in the imported certificate." >&2
            security find-identity -v -p codesigning "$keychain" >&2 || true
            exit 1
          fi
          identity="${identity_line#*\"}"
          identity="${identity%%\"*}"
          # Identity is "iPhone Distribution: <Org> (TEAMID)" — pull the team ID
          # out of the trailing parentheses for xcodebuild.
          team_id="$(printf '%s' "$identity" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')"
          [[ -n "$team_id" ]] || { echo "Could not extract team ID from: $identity" >&2; exit 1; }
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_TEAM=$team_id" >> "$GITHUB_ENV"
          echo "Using signing identity: $identity_line"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"
          # altool's --apiKeyPath is a DIRECTORY containing AuthKey_<id>.p8,
          # not the file itself (unlike notarytool). Write it where altool
          # looks by default.
          keys_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys_dir"
          printf '%s' "$APPLE_API_KEY" | base64 -D > "$keys_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$keys_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "APPLE_API_KEY_DIR=$keys_dir" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Prebuild iOS
        working-directory: mobile
        env:
          FUTURE_VERSION: ${{ needs.version.outputs.version }}
        run: npx expo prebuild --platform ios

      - name: Build and export signed .ipa
        working-directory: mobile/ios
        env:
          FUTURE_VERSION: ${{ needs.version.outputs.version }}
          FUTURE_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          DEVELOPMENT_TEAM: ${{ env.DEVELOPMENT_TEAM }}
          SIGNING_IDENTITY: ${{ env.SIGNING_IDENTITY }}
          PROVISIONING_PROFILE: ${{ env.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          : "${DEVELOPMENT_TEAM:?DEVELOPMENT_TEAM is required}"
          : "${SIGNING_IDENTITY:?SIGNING_IDENTITY is required}"
          : "${PROVISIONING_PROFILE:?PROVISIONING_PROFILE is required}"

          # Manual signing with the imported Distribution certificate and the
          # App Store profile copied into ~/Library/MobileDevice. Automatic
          # signing is not usable on CI (it requires an Apple account in
          # Xcode's Accounts settings).
          xcodebuild -workspace FutureOS.xcworkspace \
            -scheme FutureOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FutureOS.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE" \
            archive

          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>cn.futureos.mobile</key><string>$PROVISIONING_PROFILE</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FutureOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/FutureOS-export" \
            -exportOptionsPlist "$export_options"

          app_name="FutureOS_${{ needs.version.outputs.version }}_${{ needs.version.outputs.build_number }}.ipa"
          ipa="$(find "$RUNNER_TEMP/FutureOS-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          [[ -n "$ipa" && -s "$ipa" ]] || { echo "Exported .ipa not found." >&2; exit 1; }
          cp "$ipa" "$RUNNER_TEMP/$app_name"
          echo "IPA_PATH=$RUNNER_TEMP/$app_name" >> "$GITHUB_ENV"
          echo "IPA_NAME=$app_name" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_DIR: ${{ env.APPLE_API_KEY_DIR }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${IPA_PATH:?IPA_PATH is required}"
          : "${APPLE_API_KEY_DIR:?APPLE_API_KEY_DIR is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"
          [[ -s "$IPA_PATH" ]] || { echo "IPA is missing or empty: $IPA_PATH" >&2; exit 1; }

          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER" \
            --apiKeyPath "$APPLE_API_KEY_DIR" \
            --verbose

      - name: Upload IPA to OSS
        if: github.event_name == 'workflow_dispatch' && !inputs.coordinated
        run: |
          set -euo pipefail
          : "${IPA_PATH:?IPA_PATH is required}"
          : "${IPA_NAME:?IPA_NAME is required}"

          version="${{ needs.version.outputs.version }}"
          case "$(uname -m)" in
            arm64) arch="arm64" ;;
            x86_64) arch="amd64" ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          pkg="ossutil-2.3.0-mac-${arch}"
          curl -fsSL "https://gosspublic.alicdn.com/ossutil/v2/2.3.0/${pkg}.zip" \
            -o "$RUNNER_TEMP/ossutil.zip"
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          chmod +x "$RUNNER_TEMP/ossutil/$pkg/ossutil"
          export PATH="$RUNNER_TEMP/ossutil/$pkg:$PATH"

          region="$(printf '%s' "$OSS_ENDPOINT" \
            | sed -E 's#^https?://##; s/^oss-//; s/-internal//; s/\.aliyuncs\.com$//')"
          echo "==> Uploading IPA to oss://$OSS_BUCKET/test/$version/"
          ossutil cp -f "$IPA_PATH" "oss://$OSS_BUCKET/test/$version/$IPA_NAME" --region "$region"
          ossutil stat "oss://$OSS_BUCKET/test/$version/$IPA_NAME" --region "$region"
          echo "==> Download URL:"
          echo "https://dl.future-os.cn/test/$version/$IPA_NAME"

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_*.p8"
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/futureos-ios-signing.p12"
          keychain="$RUNNER_TEMP/futureos-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi
