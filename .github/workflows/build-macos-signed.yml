name: Build macOS signed

permissions: read-all

# Shared macOS packaging workflow. Signed mode imports the Developer ID
# certificate and submits to Apple's notarization service; unsigned mode skips
# both but still creates updater artifacts signed by the Tauri updater key.
# Keep both modes restricted to trusted triggers because both access secrets.
#
# Standalone dev builds go to `dev/<artifact-version>/`. Coordinators consume
# the verified artifacts; only they publish complete channels and advance their
# latest.json manifests.

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize with Apple Developer ID.
        required: false
        type: boolean
        default: false
      strict_verification:
        description: Require signed artifact verification to pass.
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: Exact release version supplied by the coordinator.
        required: true
        type: string
      artifact_version:
        description: Public artifact version supplied by the coordinator.
        required: true
        type: string
      signed:
        description: Sign and notarize with Apple Developer ID.
        required: false
        type: boolean
        default: false
      strict_verification:
        description: Require signed artifact verification to pass.
        required: false
        type: boolean
        default: true
      coordinated:
        description: Let the caller publish the collected artifacts.
        required: false
        type: boolean
        default: false
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PWD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAURI_UPDATER_PUBLIC_KEY:
        required: true
      OSS_ENDPOINT:
        required: false
      OSS_BUCKET:
        required: false
      OSS_ACCESS_KEY_ID:
        required: false
      OSS_ACCESS_KEY_SECRET:
        required: false

jobs:
  build:
    name: Build macOS (${{ matrix.name }}, ${{ inputs.signed && 'signed' || 'unsigned' }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-latest` is the GitHub-hosted Apple Silicon image.
          - name: Apple Silicon
            runner: macos-latest
            asset_arch: aarch64
            artifact_name: futureos-macos-aarch64
          # Keep the Intel build pinned to a named image: unlike
          # `macos-latest`, this cannot silently switch architectures.
          - name: Intel
            runner: macos-15-intel
            asset_arch: x64
            artifact_name: futureos-macos-x64
    env:
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        run: node scripts/ci/setup-rust.mjs

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      # No protoc needed here: proto generation is gated on REGENERATE_PROTO and
      # the generated code is checked in, so signing builds never run protoc.

      # Import the base64-encoded Developer ID Application certificate into an
      # ephemeral keychain. Resolve its full identity rather than hard-coding the
      # team or company name, then pass it to Tauri and codesign.
      - name: Install Apple signing certificate
        if: inputs.signed
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE secret is required}"
          : "${MACOS_CERTIFICATE_PWD:?MACOS_CERTIFICATE_PWD secret is required}"

          keychain="$RUNNER_TEMP/futureos-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/futureos-signing.p12"

          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"

          identity_line="$(security find-identity -v -p codesigning "$keychain" \
            | grep '"Developer ID Application:' | head -n 1 || true)"
          if [[ -z "$identity_line" ]]; then
            echo "No Developer ID Application identity found in the imported certificate." >&2
            security find-identity -v -p codesigning "$keychain" >&2 || true
            exit 1
          fi
          identity="${identity_line#*\"}"
          identity="${identity%%\"*}"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Using signing identity: $identity_line"

      - name: Resolve version
        id: v
        env:
          FUTURE_VERSION: ${{ inputs.version }}
          FUTURE_ARTIFACT_VERSION: ${{ inputs.artifact_version }}
          FUTURE_BUILD_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && !inputs.coordinated && 'dev' || '' }}
        run: node scripts/version.mjs --github-output

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # tauri:build selects CLI + Desktop in one Cargo graph, then stages the
      # CLI and bundles/signs the app using the shared root target directory.
      - name: Set Tauri bundle version
        env:
          FUTURE_VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/version.mjs --set-bundle

      # Let Tauri notarize and staple the app during bundling. This ordering is
      # important: the updater tarball must be created from the final notarized
      # app, then signed with the separate Tauri updater key. The DMG is created
      # afterwards, so it is a distinct distribution container and is notarized
      # and stapled in the next step.
      - name: Prepare Apple notarization key
        if: inputs.signed
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY_CONTENT:?APPLE_API_KEY secret is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" | base64 -D > "$api_key"
          chmod 600 "$api_key"
          echo "APPLE_API_KEY_PATH=$api_key" >> "$GITHUB_ENV"

      # tauri.conf.json intentionally uses the ad-hoc identity (`-`) for normal
      # builds. A per-run overlay keeps unsigned/local builds unchanged while
      # embedding the production updater endpoint/key only in formal artifacts.
      - name: Build desktop bundle (signed, notarized and updater-enabled)
        if: inputs.signed
        env:
          FUTURE_VERSION: ${{ steps.v.outputs.version }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY secret is required}"
          : "${TAURI_UPDATER_PUBLIC_KEY:?TAURI_UPDATER_PUBLIC_KEY secret is required}"
          overlay="$RUNNER_TEMP/tauri.macos-sign.json"
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              bundle: {
                createUpdaterArtifacts: true,
                macOS: { signingIdentity: process.env.SIGNING_IDENTITY }
              },
              plugins: {
                updater: {
                  pubkey: process.env.TAURI_UPDATER_PUBLIC_KEY,
                  endpoints: [
                    "https://dl.future-os.cn/releases/latest.json"
                  ]
                }
              }
            }));
          ' "$overlay"
          npm --prefix desktop run tauri:build -- --config "$overlay"

      - name: Build desktop bundle (unsigned and updater-enabled)
        if: ${{ !inputs.signed }}
        env:
          FUTURE_VERSION: ${{ steps.v.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?TAURI_SIGNING_PRIVATE_KEY secret is required}"
          : "${TAURI_UPDATER_PUBLIC_KEY:?TAURI_UPDATER_PUBLIC_KEY secret is required}"
          overlay="$RUNNER_TEMP/tauri.macos-unsigned.json"
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.argv[1], JSON.stringify({
              bundle: {
                createUpdaterArtifacts: true,
                macOS: { signingIdentity: "-" }
              },
              plugins: {
                updater: {
                  pubkey: process.env.TAURI_UPDATER_PUBLIC_KEY,
                  endpoints: ["https://dl.future-os.cn/releases/latest.json"]
                }
              }
            }));
          ' "$overlay"
          npm --prefix desktop run tauri:build -- --config "$overlay"

      # Tauri notarizes the app before it creates the DMG. Apple treats the
      # resulting signed disk image as a separate distribution artifact: submit
      # it after creation and staple its own ticket so installation also works
      # when Gatekeeper cannot reach Apple's notarization service.
      - name: Prepare signed DMG
        if: inputs.signed
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}." >&2
            find target/release/bundle/dmg -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          dmg="${dmgs[0]}"

          # Verify the container before uploading it. Do not re-sign the DMG:
          # replacing a signature on the compressed image can produce a package
          # that behaves differently when verified in a fresh process.
          codesign --verify --strict --verbose=2 "$dmg"
          hdiutil verify "$dmg"

          # Keep the distributable path even when a test build cannot reach Apple.
          echo "SIGNED_DMG=$dmg" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        id: notarize_dmg
        if: inputs.signed
        continue-on-error: ${{ !inputs.strict_verification }}
        timeout-minutes: 75
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          dmg="$SIGNED_DMG"
          diagnostics="$RUNNER_TEMP/futureos-dmg-notarization"
          # Bound diagnostic/stapler calls too, leaving time for the test-build
          # fallback before the Actions timeout (which cannot be caught).
          bounded_xcrun() {
            python3 - "$@" <<'PYTIMEOUT'
          import subprocess, sys
          try:
              sys.exit(subprocess.run(['xcrun', *sys.argv[1:]], timeout=60).returncode)
          except subprocess.TimeoutExpired:
              print('Apple command timed out after 60 seconds', file=sys.stderr)
              sys.exit(124)
          PYTIMEOUT
          }
          node scripts/ci/notarize-macos-dmg.mjs "$dmg" "$diagnostics"
          submission_id="$(cat "$diagnostics/submission-id.txt")"
          notary_args=(
            --key "$APPLE_API_KEY_PATH"
            --key-id "$APPLE_API_KEY_ID"
            --issuer "$APPLE_API_ISSUER"
          )

          # Apple recommends checking the completed submission log even after an
          # Accepted result. Surface every reported issue in the Actions summary,
          # but do not block an Apple-accepted release on advisory diagnostics.
          notary_log="$diagnostics/accepted-log.json"
          log_downloaded=false
          for attempt in 1 2 3; do
            if bounded_xcrun notarytool log \
              "${notary_args[@]}" \
              "$submission_id" \
              "$notary_log"; then
              log_downloaded=true
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 10))
              echo "Notarization log attempt $attempt failed; retrying in ${delay}s." >&2
              sleep "$delay"
            fi
          done
          [[ "$log_downloaded" == true && -s "$notary_log" ]] || {
            echo "Unable to retrieve the accepted notarization log." >&2
            exit 1
          }
          cat "$notary_log"
          notary_issue_count="$(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (data.issues == null) {
              process.stdout.write("0");
            } else if (Array.isArray(data.issues)) {
              process.stdout.write(String(data.issues.length));
            } else {
              throw new Error("Apple notarization log has an invalid issues field");
            }
          ' "$notary_log")"
          if [[ "$notary_issue_count" != "0" ]]; then
            echo "::warning title=Apple notarization diagnostics::Apple accepted the DMG but reported $notary_issue_count issue(s); review the notarization log above."
          fi

          # An accepted ticket can take a short time to propagate to stapler.
          # Retry only the idempotent staple operation; never resubmit the DMG.
          stapled=false
          for attempt in 1 2 3 4 5; do
            if bounded_xcrun stapler staple -v "$dmg"; then
              stapled=true
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then
              delay=$((attempt * 10))
              echo "Staple attempt $attempt failed; retrying in ${delay}s." >&2
              sleep "$delay"
            fi
          done
          [[ "$stapled" == true ]] || {
            echo "Unable to staple the accepted notarization ticket to $dmg." >&2
            exit 1
          }

      - name: Report non-blocking test notarization failure
        if: ${{ inputs.signed && !inputs.strict_verification && steps.notarize_dmg.outcome == 'failure' }}
        run: |
          echo "::warning title=DMG notarization incomplete::Test build will publish the signed DMG without confirmed DMG notarization/stapling. Review the notarization diagnostics; formal releases require success."
          echo "### DMG notarization incomplete" >> "$GITHUB_STEP_SUMMARY"
          echo "Test artifacts will be published without confirmed DMG notarization/stapling. See the notarization diagnostics artifact for the submission ID and responses." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG notarization diagnostics
        if: ${{ always() && inputs.signed }}
        uses: actions/upload-artifact@v7
        with:
          name: notarization-diagnostics-${{ matrix.asset_arch }}
          path: ${{ runner.temp }}/futureos-dmg-notarization/
          if-no-files-found: ignore

      # A valid signature alone does not prove that the bundled CLI is
      # executable (compile-only placeholders can leave mode 0644 behind).
      - name: Verify packaged Desktop and CLI entry points
        env:
          FUTURE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile
          apps = list(pathlib.Path('target/release/bundle/macos').glob('*.app'))
          assert len(apps) == 1, f'Expected one app, found {len(apps)}'
          with tempfile.TemporaryDirectory(prefix='futureos-package-probe-') as profile:
              env = os.environ.copy()
              state = pathlib.Path(profile) / '.future'
              env.update(HOME=profile, USERPROFILE=profile, FUTURE_HOME=str(state))
              env.pop('FUTURE_AGENT_GRPC_ADDR', None)
              env.pop('FUTURE_AGENT_SOCKET', None)
              for binary, flag in [('future', '--version'), ('futureos', '--help')]:
                  path = apps[0] / 'Contents/MacOS' / binary
                  assert os.access(path, os.X_OK), f'Packaged binary is not executable: {path}'
                  result = subprocess.run([str(path.resolve()), flag], env=env, capture_output=True, text=True, timeout=15)
                  assert result.returncode == 0, result.stderr
                  if binary == 'future':
                      assert result.stdout.strip() == 'future v' + os.environ['FUTURE_VERSION'], result.stdout
              assert not state.exists(), 'Early package probes initialized Agent state'
          PY

      # Validate both user journeys: mount the website DMG and extract the
      # automatic-updater archive. A formal release requires every check to
      # pass; a test build reports verification failures but can still publish.
      - name: Verify signed artifacts
        id: verify_signed
        if: inputs.signed
        continue-on-error: ${{ !inputs.strict_verification }}
        run: |
          set -euo pipefail
          : "${SIGNED_DMG:?SIGNED_DMG is required}"
          shopt -s nullglob
          apps=(target/release/bundle/macos/*.app)
          updaters=(target/release/bundle/macos/*.app.tar.gz)
          updater_sigs=(target/release/bundle/macos/*.app.tar.gz.sig)
          [[ ${#apps[@]} -eq 1 ]] || {
            echo "Expected exactly one .app bundle, found ${#apps[@]}." >&2
            exit 1
          }
          [[ ${#updaters[@]} -eq 1 ]] || {
            echo "Expected exactly one macOS updater archive, found ${#updaters[@]}." >&2
            exit 1
          }
          [[ ${#updater_sigs[@]} -eq 1 ]] || {
            echo "Expected exactly one macOS updater signature, found ${#updater_sigs[@]}." >&2
            exit 1
          }
          [[ -s "${updater_sigs[0]}" ]] || {
            echo "The macOS updater signature is empty." >&2
            exit 1
          }

          app="${apps[0]}"
          updater="${updaters[0]}"
          updater_sig="${updater_sigs[0]}"
          dmg="$SIGNED_DMG"
          [[ -s "$dmg" ]] || { echo "The signed DMG is missing or empty: $dmg" >&2; exit 1; }
          echo "MACOS_UPDATER=$updater" >> "$GITHUB_ENV"
          echo "MACOS_UPDATER_SIG=$updater_sig" >> "$GITHUB_ENV"
          echo "DISTRIBUTABLE_DMG=$dmg" >> "$GITHUB_ENV"

          validate_ticket() {
            local artifact="$1" attempt
            for attempt in 1 2 3 4 5; do
              if xcrun stapler validate "$artifact"; then
                return 0
              fi
              if [[ "$attempt" -lt 5 ]]; then
                delay=$((attempt * 10))
                echo "Ticket validation attempt $attempt failed for $artifact; retrying in ${delay}s." >&2
                sleep "$delay"
              fi
            done
            echo "Unable to validate the notarization ticket for $artifact after 5 attempts." >&2
            return 1
          }

          codesign --verify --deep --strict --verbose=2 "$app"
          signature_info="$(codesign --display --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature_info"
          grep -q 'flags=.*runtime' <<<"$signature_info" || {
            echo "The app signature does not enable hardened runtime." >&2
            exit 1
          }
          grep -q '^Authority=Developer ID Application:' <<<"$signature_info" || {
            echo "The app is not signed with a Developer ID Application certificate." >&2
            exit 1
          }
          grep -q '^Timestamp=' <<<"$signature_info" || {
            echo "The app signature has no secure timestamp." >&2
            exit 1
          }

          codesign --verify --strict --verbose=2 "$dmg"
          dmg_signature_info="$(codesign --display --verbose=4 "$dmg" 2>&1)"
          printf '%s\n' "$dmg_signature_info"
          grep -q '^Authority=Developer ID Application:' <<<"$dmg_signature_info" || {
            echo "The DMG is not signed with a Developer ID Application certificate." >&2
            exit 1
          }
          grep -q '^Timestamp=' <<<"$dmg_signature_info" || {
            echo "The DMG signature has no secure timestamp." >&2
            exit 1
          }

          validate_ticket "$app"
          validate_ticket "$dmg"
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess --type open \
            --context context:primary-signature --verbose=2 "$dmg"
          hdiutil verify "$dmg"

          updater_dir="$(mktemp -d "$RUNNER_TEMP/futureos-updater.XXXXXX")"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/futureos-dmg.XXXXXX")"
          dmg_attached=false
          cleanup_verification() {
            if [[ "$dmg_attached" == true ]]; then
              hdiutil detach "$mount_dir" || true
            fi
            rm -rf "$updater_dir"
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup_verification EXIT

          tar -xzf "$updater" -C "$updater_dir"
          updater_apps=()
          while IFS= read -r -d '' candidate; do
            updater_apps[${#updater_apps[@]}]="$candidate"
          done < <(find "$updater_dir" -type d -name '*.app' -prune -print0)
          [[ ${#updater_apps[@]} -eq 1 ]] || {
            echo "Expected the updater archive to contain exactly one app, found ${#updater_apps[@]}." >&2
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "${updater_apps[0]}"
          validate_ticket "${updater_apps[0]}"
          spctl --assess --type execute --verbose=2 "${updater_apps[0]}"

          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          dmg_attached=true
          [[ -L "$mount_dir/Applications" \
             && "$(readlink "$mount_dir/Applications")" == "/Applications" ]] || {
            echo "The DMG has no standard Applications drag-to-install link." >&2
            exit 1
          }
          mounted_apps=()
          while IFS= read -r -d '' candidate; do
            mounted_apps[${#mounted_apps[@]}]="$candidate"
          done < <(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print0)
          [[ ${#mounted_apps[@]} -eq 1 ]] || {
            echo "Expected the DMG to contain exactly one app, found ${#mounted_apps[@]}." >&2
            exit 1
          }
          codesign --verify --deep --strict --verbose=2 "${mounted_apps[0]}"
          validate_ticket "${mounted_apps[0]}"
          spctl --assess --type execute --verbose=2 "${mounted_apps[0]}"

          hdiutil detach "$mount_dir"
          dmg_attached=false
          rm -rf "$updater_dir"
          rmdir "$mount_dir"
          trap - EXIT

      - name: Report non-blocking test verification failure
        if: ${{ inputs.signed && !inputs.strict_verification && steps.verify_signed.outcome == 'failure' }}
        run: echo "::warning title=Signed artifact verification failed::Test build will continue, but the signed artifacts did not pass verification. Review the Verify signed artifacts step."

      - name: Inject first-launch note into unsigned DMG
        if: ${{ !inputs.signed }}
        run: |
          set -euo pipefail
          src="$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          [[ -n "$src" ]] || { echo "Tauri produced no DMG." >&2; exit 1; }
          work="$RUNNER_TEMP/rw.dmg"
          out="$RUNNER_TEMP/out.dmg"
          mnt="$RUNNER_TEMP/mnt"
          hdiutil convert "$src" -format UDRW -o "$work"
          hdiutil resize -size 700m "$work"
          mkdir -p "$mnt"
          hdiutil attach "$work" -mountpoint "$mnt" -nobrowse -noverify
          app="$(find "$mnt" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$app" ]] || { echo "DMG contains no app bundle." >&2; exit 1; }
          cp docs/dist/readme-macos.txt "$mnt/Readme.txt"
          mkdir -p "$mnt/licenses/goal"
          cp LICENSE "$mnt/licenses/"
          cp orchestration/goal/LICENSE orchestration/goal/NOTICE orchestration/goal/UPSTREAM.md "$mnt/licenses/goal/"
          codesign --force --sign - "$app"
          hdiutil detach "$mnt"
          hdiutil convert "$work" -format UDZO -o "$out"
          mv -f "$out" "$src"

      - name: Verify unsigned artifacts
        if: ${{ !inputs.signed }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          updaters=(target/release/bundle/macos/*.app.tar.gz)
          updater_sigs=(target/release/bundle/macos/*.app.tar.gz.sig)
          [[ ${#dmgs[@]} -eq 1 && -s "${dmgs[0]}" ]] || { echo "Expected one non-empty DMG." >&2; exit 1; }
          [[ ${#updaters[@]} -eq 1 && -s "${updaters[0]}" ]] || { echo "Expected one non-empty updater archive." >&2; exit 1; }
          [[ ${#updater_sigs[@]} -eq 1 && -s "${updater_sigs[0]}" ]] || { echo "Expected one non-empty updater signature." >&2; exit 1; }
          hdiutil verify "${dmgs[0]}"
          echo "DISTRIBUTABLE_DMG=${dmgs[0]}" >> "$GITHUB_ENV"
          echo "MACOS_UPDATER=${updaters[0]}" >> "$GITHUB_ENV"
          echo "MACOS_UPDATER_SIG=${updater_sigs[0]}" >> "$GITHUB_ENV"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          if [[ "${{ inputs.signed }}" == "true" ]]; then
            suffix=""
          else
            suffix="-unsigned"
          fi
          published_version="${{ steps.v.outputs.artifact_version }}"
          mkdir -p release-assets
          dmg_output="release-assets/FutureOS_${published_version}_${{ matrix.asset_arch }}${suffix}.dmg"
          updater_output="release-assets/FutureOS_${published_version}_${{ matrix.asset_arch }}${suffix}.app.tar.gz"
          cp "$DISTRIBUTABLE_DMG" "$dmg_output"
          cp "$MACOS_UPDATER" "$updater_output"
          cp "$MACOS_UPDATER_SIG" "$updater_output.sig"

      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.signed && matrix.artifact_name || format('{0}-unsigned', matrix.artifact_name) }}
          if-no-files-found: error
          overwrite: true
          path: release-assets/*
          retention-days: 7

      - name: Setup ossutil
        if: github.event_name == 'workflow_dispatch' && !inputs.coordinated
        run: |
          set -euo pipefail
          version="2.3.0"
          case "$(uname -m)" in
            arm64) arch="arm64" ;;
            x86_64) arch="amd64" ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          package="ossutil-${version}-mac-${arch}"
          curl -fsSL \
            "https://gosspublic.alicdn.com/ossutil/v2/${version}/${package}.zip" \
            -o "$RUNNER_TEMP/ossutil.zip"
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          chmod +x "$RUNNER_TEMP/ossutil/$package/ossutil"
          echo "$RUNNER_TEMP/ossutil/$package" >> "$GITHUB_PATH"

          region="$(printf '%s' "$OSS_ENDPOINT" \
            | sed -E 's#^https?://##; s/^oss-//; s/-internal//; s/\.aliyuncs\.com$//')"
          echo "OSS_REGION=$region" >> "$GITHUB_ENV"

      - name: Upload artifacts to OSS
        if: github.event_name == 'workflow_dispatch' && !inputs.coordinated
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.artifact_version }}"
          echo "==> Uploading macOS artifacts to oss://$OSS_BUCKET/dev/$version/"
          ossutil cp -r -f release-assets/ "oss://$OSS_BUCKET/dev/$version/"

          echo "==> Download URLs:"
          find release-assets -maxdepth 1 -type f -print | while read -r output; do
            echo "https://dl.future-os.cn/dev/$version/$(basename "$output")"
          done

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/futureos-signing.p12"
          keychain="$RUNNER_TEMP/futureos-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi
