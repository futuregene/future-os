name: CI

permissions: read-all

# Fast feedback on every PR and on manual dispatch:
# lint + typecheck + tests + a 3-platform Rust compile check. Full
# cross-platform *packaging* stays in build.yml (tags / dispatch) — this
# workflow exists so breakage (especially platform-conditional Rust that only
# shows up on Windows/macOS) is caught BEFORE a release build is cut.
#
# Push-to-main trigger is intentionally absent: "Require branches to be up
# to date before merging" on branch protection already forces the PR check
# to re-run on the merged result, so a post-merge run would be redundant.
#
# PRs save caches in their merge-ref scope; manual CI saves in its branch scope.
on:
  pull_request:
  # Full PR-check suite by default; narrow scopes avoid rerunning unrelated
  # suites while iterating on offline updates or Desktop Rust fixtures.
  workflow_dispatch:
    inputs:
      scope:
        description: Select full CI, Windows updates, Desktop Rust, headless CLI, or native lifecycle.
        required: false
        type: choice
        default: all
        options:
          - all
          - windows-update
          - desktop-rust
          - headless-cli
          - agent-lifecycle

# Re-pushing a branch cancels its stale run; release tags are unaffected
# (this workflow never triggers on tags anyway).
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: true

jobs:
  macos-notarization:
    name: macOS notarization recovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test submission recovery and publication policy
        run: node --test scripts/tests/notarize-macos-dmg.test.mjs

  # On PRs, run only affected suites. Manual default runs cover everything;
  # explicit scopes only select offline updates or Desktop Rust validation.
  changes:
    name: Detect affected checks
    runs-on: ubuntu-latest
    outputs:
      rust_workspace: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.rust_workspace == 'true' || steps.filter.outputs.ci == 'true' }}
      # Per-crate triggers for the rust-tests groups, so a PR that touches only
      # one crate runs only that crate's test group. Each inherits the shared
      # build-graph inputs (root manifest, lock, toolchain, future-rpc) — those
      # affect every workspace crate.
      rust_agent: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.rust_agent == 'true' || steps.filter.outputs.ci == 'true' }}
      rust_tui_cli: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.rust_tui_cli == 'true' || steps.filter.outputs.ci == 'true' }}
      rust_channels_rpc_goal: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.rust_channels_rpc_goal == 'true' || steps.filter.outputs.ci == 'true' }}
      # Proto/codegen freshness only needs re-checking when a proto source,
      # its build script, the generated output, or a build-dep version changes.
      proto: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.proto == 'true' || steps.filter.outputs.ci == 'true' }}
      desktop_tauri: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.desktop_tauri == 'true' || steps.filter.outputs.ci == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'desktop-rust' || inputs.scope == 'headless-cli' || inputs.scope == 'agent-lifecycle')) }}
      agent_lifecycle: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.agent_lifecycle == 'true' || steps.filter.outputs.ci == 'true' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'agent-lifecycle') }}
      windows_update: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.windows_update == 'true' || steps.filter.outputs.ci == 'true' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-update') }}
      desktop_frontend: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.desktop_frontend == 'true' || steps.filter.outputs.ci == 'true' }}
      mobile: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.mobile == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - id: force
        shell: bash
        env:
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || ( -n "$REQUESTED_SCOPE" && "$REQUESTED_SCOPE" != "all" ) ]]; then
            echo "all=false" >> "$GITHUB_OUTPUT"
          else
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # v4.0.3+ supports 'some-with-excludes': a file is included only if it
          # matches at least one non-negated pattern AND no `!`-negated pattern.
          # The v3 default 'some' treats a `!` pattern as a match of "everything
          # outside it", which made desktop_frontend/mobile match unrelated files
          # like AGENTS.md and run those suites on nearly every PR.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            # Changing this workflow must revalidate every suite.
            ci:
              - '.github/workflows/ci.yml'
              - 'scripts/ci/setup-rust.mjs'
            # Aggregate: any workspace crate (or a shared build-graph file) —
            # drives the workspace-level fmt/clippy and cross-platform build.
            rust_workspace:
              - 'packages/remote-crypto/**'
              - 'packages/app-settings/**'
              - 'packages/app-workspaces/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'packages/rpc/**'
              - 'agent/**'
              - 'channels/**'
              - 'tui/**'
              - 'cli/**'
              # The goal control plane is a workspace member — its changes must
              # run the same fmt/clippy/test gates (previously missing here).
              - 'orchestration/**'
            # Per-crate triggers. Shared inputs (manifest/lock/toolchain/rpc)
            # are repeated so a change to any of them runs every group.
            rust_agent:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'packages/rpc/**'
              - 'agent/**'
            rust_tui_cli:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'packages/rpc/**'
              # The CLI reads and writes the desktop settings document, whose
              # schema lives in packages/app-settings.
              - 'packages/app-settings/**'
              - 'packages/app-workspaces/**'
              # The unified CLI embeds these crates, including Agent.
              - 'agent/**'
              - 'channels/**'
              - 'orchestration/**'
              - 'tui/**'
              - 'cli/**'
            rust_channels_rpc_goal:
              - 'packages/remote-crypto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'packages/rpc/**'
              - 'channels/**'
              - 'orchestration/**'
            # Proto codegen freshness: only re-check when a proto source, its
            # build script, the generated output, or a build-dep version could
            # have drifted. Unrelated Rust changes skip the REGENERATE_PROTO
            # cargo build.
            proto:
              - 'packages/rpc/**'
              - 'channels/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            desktop_tauri:
              - 'scripts/build/build-desktop.mjs'
              - 'scripts/ci/check-embedded-agent.py'
              - 'packages/remote-crypto/**'
              # The desktop backend path-depends on the shared settings schema.
              - 'packages/app-settings/**'
              - 'packages/app-workspaces/**'
              - 'agent/**'
              - 'orchestration/tasks/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'desktop/src-tauri/**'
              # Installer-only inputs are covered by windows_update. Keep
              # update-launcher.ps1 included: Rust embeds it with include_str!.
              - '!desktop/src-tauri/windows/installer-hooks.nsh'
              - '!desktop/src-tauri/windows/installer-preflight.ps1'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              # The desktop backend path-depends on future-rpc; changes there must
              # revalidate the desktop backend too.
              - 'packages/rpc/**'
            # Keep the native lifecycle matrix narrow; frontend-only edits
            # do not rebuild Rust test binaries on three operating systems.
            agent_lifecycle:
              - 'agent/**'
              - 'packages/rpc/**'
              - 'packages/app-settings/**'
              - 'packages/app-workspaces/**'
              - 'orchestration/tasks/**'
              - 'desktop/src-tauri/**'
              # These two scripts do not change the Agent runtime lifecycle.
              - '!desktop/src-tauri/windows/installer-hooks.nsh'
              - '!desktop/src-tauri/windows/installer-preflight.ps1'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'scripts/ci/check-embedded-agent.py'
            windows_update:
              - '.github/workflows/build-windows-signed.yml'
              - 'scripts/build/build-desktop-windows-*'
              - 'desktop/src-tauri/windows/**'
              - 'desktop/src-tauri/src/commands/update*.rs'
              - 'scripts/tests/test-windows-installer-preflight.ps1'
              - 'scripts/tests/windows-installer-*'
              - 'scripts/tests/test-windows-update-launcher.ps1'
              - 'scripts/tests/test-windows-sandbox-lifecycle.ps1'
              - 'scripts/tests/test-windows-lifecycle-assertions.ps1'
              - 'scripts/tests/test-install.ps1'
              - 'scripts/release/install.ps1'
            desktop_frontend:
              - 'desktop/**'
              - '!desktop/src-tauri/**'
              - 'packages/markdown/**'
              - 'packages/thread-projection/**'
              # The root npm workspace manifest + lock define the shared install.
              - 'package.json'
              - 'package-lock.json'
            mobile:
              - 'packages/remote-crypto/tests/**'
              - 'mobile/**'
              - '!mobile/android/**'
              - '!mobile/ios/**'
              - 'packages/markdown/**'
              - 'packages/thread-projection/**'
              - 'package.json'
              - 'package-lock.json'

  # ─── Rust lint gate (Linux): fmt + clippy ─────────────────────────────────
  # Lint every workspace crate (agent / channels / tui / cli / goal / future-rpc,
  # via `--all` and `--workspace --all-targets`) plus the desktop Tauri backend.
  # Tests run in the independent `rust-tests` job below so both gates can
  # execute in parallel.
  rust-quality:
    name: Rust fmt + clippy (Linux)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Always-present (no job-level `if`): a skipped required check is treated
      # as unsatisfied, which would block docs-only PRs. Evaluate the gate here
      # and gate every heavy step on it; an unaffected PR reports success via a
      # no-op echo (the same pattern rust-tests uses).
      - name: Is the Rust quality gate affected?
        id: affected
        env:
          OUTPUTS: ${{ toJSON(needs.changes.outputs) }}
        run: |
          ws=$(echo "$OUTPUTS" | jq -r '.rust_workspace // "false"')
          dt=$(echo "$OUTPUTS" | jq -r '.desktop_tauri // "false"')
          if [ "$ws" = "true" ] || [ "$dt" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No affected Rust quality checks
        if: steps.affected.outputs.run != 'true'
        run: echo "No Rust workspace or desktop Tauri changes; lint skipped."

      # Read the project toolchain and isolate it from runner defaults.
      - name: Setup Rust
        if: steps.affected.outputs.run == 'true'
        run: node scripts/ci/setup-rust.mjs

      # PRs and manual branch runs save in their own ref scope.
      - name: Cache Rust
        if: steps.affected.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-quality
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      # Run formatting before any package installation: rustfmt only needs the
      # pinned toolchain, so a formatting failure returns immediately even when
      # an Ubuntu mirror is unhealthy.
      - name: rustfmt (workspace)
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.rust_workspace == 'true'
        run: cargo fmt --check --all

      - name: rustfmt (desktop backend)
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.desktop_tauri == 'true'
        run: cargo fmt --check --manifest-path desktop/src-tauri/Cargo.toml

      # mold + binutils because .cargo/config.toml pins -fuse-ld=mold and clippy
      # still links build scripts, proc-macros and test binaries. WebKit/GTK for
      # the Tauri -sys build scripts (desktop backend is part of this gate now).
      # protobuf-compiler is needed only for the `proto codegen is fresh` step
      # below — normal builds never run protoc (generation is gated on
      # REGENERATE_PROTO).
      # Base toolchain packages always; the WebKit/GTK/SSL stack ONLY when the
      # desktop backend is affected (clippy links its -sys build scripts, which
      # need pkg-config to find the libs). A goal-only PR skips ~40-60s of apt
      # (the historical flake point: apt fetching from a slow Azure mirror),
      # and protobuf-compiler is only needed for the proto-freshness step.
      - name: Install Linux deps (base)
        if: steps.affected.outputs.run == 'true'
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config

      # protobuf-compiler is needed only for the `proto codegen is fresh` step
      # below — normal builds never run protoc (generation is gated on
      # REGENERATE_PROTO). Install it in that step's own condition so proto-
      # unrelated PRs skip it entirely.
      - name: Install Linux deps (desktop GUI stack)
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.desktop_tauri == 'true'
        run: |
          bash scripts/ci/install-apt-packages.sh \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      # ── Workspace crates (agent / channels) ──
      # --all because the root manifest is a virtual workspace (no [package]);
      # --manifest-path would fail with "Failed to find targets".
      - name: clippy (workspace)
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.rust_workspace == 'true'
        run: cargo clippy --workspace --exclude futureos --all-targets --manifest-path Cargo.toml -- -D warnings

      # The generated wire code (future-rpc proto.rs, channels feishu_ws.rs) is
      # checked in; guard against proto edits that skip `make generate-proto`.
      # Output is deterministic for pinned prost/tonic-build, so a regenerate
      # on the same source must be a no-op.
      - name: Install protoc
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.proto == 'true'
        run: bash scripts/ci/install-apt-packages.sh protobuf-compiler

      - name: proto codegen is fresh
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.proto == 'true'
        run: |
          (cd packages/rpc && REGENERATE_PROTO=1 cargo build)
          (cd channels && REGENERATE_PROTO=1 cargo build)
          git diff --exit-code packages/rpc/src/generated/proto.rs channels/src/generated/

      # ── desktop Tauri backend ──
      - name: clippy (desktop backend)
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.desktop_tauri == 'true'
        run: |
          cargo clippy -p future-cli -p futureos --all-targets -- -D warnings
          cargo clippy --no-default-features --features headless --all-targets --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings

  # ─── Rust test gates (Linux) ──────────────────────────────────────────────
  # The workspace crates run as a matrix of three parallel groups, each paying
  # only its own compile+run cost instead of everything serializing behind one
  # big `cargo test --workspace`. The desktop backend suite is its own pair of
  # jobs (`rust-tests-desktop` below): the GUI has a separate
  # webkit/gtk dependency tree, and the two feature configurations used to run one
  # after the other in a single job, which made it the longest leg of the suite.
  #
  # Groups are always-present (per-step `if`, never job-level): branch
  # protection treats a *skipped* required check as unsatisfied, so e.g. a
  # mobile-only PR must still report success for every group (no-op echo
  # below). `rust-tests-gate` aggregates the groups into the single stable
  # required context "Rust tests (Linux)", so splitting/renaming groups never
  # requires touching the branch-protection ruleset.
  #
  # Workspace groups gate on their own per-crate trigger (rust_agent /
  # rust_tui_cli / rust_channels_rpc_goal) instead of the aggregate
  # rust_workspace, so a PR that touches only one crate runs only that crate's
  # test group. The aggregate still drives the workspace-level fmt/clippy and
  # cross-platform build. Workspace crates do not depend on desktop/src-tauri,
  # so a desktop-only change cannot break them (the reverse is NOT true —
  # future-rpc feeds the Tauri backend, and the path filter marks packages/rpc/**
  # as desktop_tauri too, so RPC changes also run the desktop jobs).
  #
  # CARGO_PROFILE_TEST_DEBUG=1 keeps file:line in panic backtraces while
  # dropping full debuginfo codegen — the dominant cost of building test
  # binaries. The cli/tui
  # golden-diff harnesses are NOT part of CI: they were the TS→Rust migration
  # acceptance gate and now only run manually (make test-cli-diff /
  # test-tui-diff) before a release.
  rust-tests:
    name: Rust tests (Linux) (${{ matrix.name }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            filter: rust_agent
            packages: -p future-agent
          - name: tui, cli
            filter: rust_tui_cli
            packages: -p future-tui -p future-cli -p future-app-settings -p future-app-workspaces
          - name: channels, rpc, goal
            filter: rust_channels_rpc_goal
            packages: -p future-channel -p future-rpc -p future-goal -p future-tasks -p future-remote-crypto
    steps:
      # Per-group affected check: reads the matching `changes` output by name
      # so each group gates independently without a job-level `if` (which
      # would skip the whole matrix and leave required checks "Expected").
      - name: Is this test group affected?
        id: affected
        env:
          FILTER: ${{ matrix.filter }}
          OUTPUTS: ${{ toJSON(needs.changes.outputs) }}
        run: |
          run=$(echo "$OUTPUTS" | jq -r --arg k "$FILTER" '.[$k] // "false"')
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: No affected Rust tests in this group
        if: steps.affected.outputs.run != 'true'
        run: echo "No affected Rust tests in this group; skipped."

      - name: Checkout
        if: steps.affected.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Setup Rust
        if: steps.affected.outputs.run == 'true'
        run: node scripts/ci/setup-rust.mjs

      # Each matrix group writes its own cache. Sharing one writable key would
      # let the first finisher save an incomplete snapshot for the other groups.
      - name: Cache Rust
        if: steps.affected.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-workspace-${{ matrix.filter }}
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      # The root workspace has no WebKit/GTK or openssl-sys dependency, so its
      # test groups install neither (the desktop jobs install that stack
      # themselves).
      - name: Install Linux deps
        if: steps.affected.outputs.run == 'true'
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config

      - name: cargo test (${{ matrix.name }})
        if: steps.affected.outputs.run == 'true'
        env:
          CARGO_PROFILE_TEST_DEBUG: 1
        run: cargo test ${{ matrix.packages }}

  # The desktop backend suite: one job per feature configuration, so the gui
  # suite (~7 min of tests) and the headless suite (~6 min) overlap instead of
  # queueing behind each other. Each flavor saves its own PR cache so the
  # first finisher cannot prevent the other configuration from being saved.
  rust-tests-desktop:
    name: Rust tests (Linux) (desktop ${{ matrix.flavor }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [gui, headless]
    steps:
      # Same always-present ± affected pattern as the groups above: the gate
      # below turns these two entries into the required
      # `Rust tests (Linux) (desktop backend)` context, so neither may be
      # skipped (a skipped required check blocks the PR).
      - name: Is this test group affected?
        id: affected
        env:
          OUTPUTS: ${{ toJSON(needs.changes.outputs) }}
        run: |
          run=$(echo "$OUTPUTS" | jq -r '.desktop_tauri // "false"')
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: No affected Rust tests in this group
        if: steps.affected.outputs.run != 'true'
        run: echo "No affected Rust tests in this group; skipped."

      - name: Checkout
        if: steps.affected.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Setup Rust
        if: steps.affected.outputs.run == 'true'
        run: node scripts/ci/setup-rust.mjs

      # GUI and headless write distinct entries under this shared-key family.
      - name: Cache Rust
        if: steps.affected.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-desktop-${{ matrix.flavor }}
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      # The desktop backend's -sys build scripts need the WebKit/GTK stack.
      - name: Install Linux deps
        if: steps.affected.outputs.run == 'true'
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      # The manual `headless-cli` / `agent-lifecycle` scopes narrow the desktop
      # suite to the headless CLI integration test, exactly as before the split;
      # the gui flavor then has nothing to run.
      - name: cargo test (desktop ${{ matrix.flavor }})
        if: steps.affected.outputs.run == 'true'
        env:
          CARGO_PROFILE_TEST_DEBUG: 1
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$REQUESTED_SCOPE" = 'headless-cli' ] || [ "$REQUESTED_SCOPE" = 'agent-lifecycle' ]; then
            if [ "${{ matrix.flavor }}" = 'headless' ]; then
              cargo test --manifest-path desktop/src-tauri/Cargo.toml --no-default-features --features headless --test headless_cli
            else
              echo "Scope $REQUESTED_SCOPE runs the headless CLI suite only; no gui desktop tests."
            fi
          elif [ "${{ matrix.flavor }}" = 'headless' ]; then
            cargo test --no-default-features --features headless --manifest-path desktop/src-tauri/Cargo.toml
          else
            cargo test --manifest-path desktop/src-tauri/Cargo.toml
          fi

  # Keeps the branch-protection context "Rust tests (Linux) (desktop backend)"
  # reporting after the desktop suite split: that string was the single entry's
  # name, and the ruleset requires it by name (as it does the three workspace
  # group names). It is red iff either flavor failed, so the split does not
  # weaken the gate. `if: always()` for the same reason as the group gate
  # below.
  rust-tests-desktop-gate:
    name: Rust tests (Linux) (desktop backend)
    needs: [rust-tests-desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both desktop test flavors passed?
        run: |
          if [ "${{ needs.rust-tests-desktop.result }}" != 'success' ]; then
            echo "Desktop test flavors result: ${{ needs.rust-tests-desktop.result }}"
            exit 1
          fi
          echo "Desktop test flavors passed."

  # Aggregator keeping the required check name stable across group splits:
  # fails iff any Rust test group failed. `if: always()` so a failed group
  # still yields an explicit red X on this required check (a skipped required
  # check would block the PR with a confusing "Expected" instead).
  rust-tests-gate:
    name: Rust tests (Linux)
    # Keep the existing required-check name. New installer failures must also
    # block this gate without requiring a branch-protection configuration edit.
    needs: [rust-tests, rust-tests-desktop, windows-update]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Rust test groups passed?
        run: |
          if [ "${{ needs.rust-tests.result }}" != 'success' ] || [ "${{ needs.rust-tests-desktop.result }}" != 'success' ] || [ "${{ needs.windows-update.result }}" != 'success' ]; then
            echo "Rust test groups result: ${{ needs.rust-tests.result }}"
            echo "Desktop test flavors result: ${{ needs.rust-tests-desktop.result }}"
            echo "Windows update fixtures result: ${{ needs.windows-update.result }}"
            exit 1
          fi
          echo "Rust test groups and Windows update fixtures passed."

  rust-build:
    name: Rust build (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      # Keep the three matrix statuses present for branch protection. A
      # job-level `if` would skip matrix expansion entirely, leaving the
      # required per-platform checks as "Expected" on unrelated PRs.
      - name: No Rust or desktop Tauri changes
        if: needs.changes.outputs.rust_workspace != 'true' && needs.changes.outputs.desktop_tauri != 'true'
        run: echo "No Rust workspace or desktop Tauri changes; build check skipped."

      - name: Checkout
        if: needs.changes.outputs.rust_workspace == 'true' || needs.changes.outputs.desktop_tauri == 'true'
        uses: actions/checkout@v7

      - name: Setup Rust
        if: needs.changes.outputs.rust_workspace == 'true' || needs.changes.outputs.desktop_tauri == 'true'
        run: node scripts/ci/setup-rust.mjs

      - name: Cache Rust
        if: needs.changes.outputs.rust_workspace == 'true' || needs.changes.outputs.desktop_tauri == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # Saved in the current PR or manual branch scope.
          # rust-cache appends OS/architecture to separate the native targets.
          shared-key: rust-build
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      # Base toolchain always (when Linux runs); the WebKit/GTK/SSL stack only
      # when the desktop backend is actually affected - a workspace-only PR
      # skips ~40-60s of apt (the historical flake point).
      - name: Install Linux system dependencies (base)
        if: (needs.changes.outputs.rust_workspace == 'true' || needs.changes.outputs.desktop_tauri == 'true') && runner.os == 'Linux'
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config

      - name: Install Linux system dependencies (desktop GUI stack)
        if: needs.changes.outputs.desktop_tauri == 'true' && runner.os == 'Linux'
        run: |
          bash scripts/ci/install-apt-packages.sh \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      - name: cargo check (workspace)
        if: needs.changes.outputs.rust_workspace == 'true'
        run: cargo check --workspace --exclude futureos --manifest-path Cargo.toml

      # Keep native commands in separate steps: on Windows, PowerShell can
      # otherwise overwrite a failed GUI check's exit code with a successful
      # no-default-features check and report a green required build check.
      - name: cargo check (desktop Tauri backend)
        if: needs.changes.outputs.desktop_tauri == 'true'
        run: cargo check -p future-cli -p futureos

      - name: cargo check (desktop Tauri backend, no default features)
        if: needs.changes.outputs.desktop_tauri == 'true'
        run: cargo check --no-default-features --features headless --manifest-path desktop/src-tauri/Cargo.toml

      # These are real services in isolated fixture processes: Windows pipes,
      # Unix sockets, instance locks, CLI-origin work and bounded shutdown.
      # Linux's full unit suites stay in rust-tests; do not duplicate them here.
      - name: Embedded Agent native lifecycle
        if: needs.changes.outputs.agent_lifecycle == 'true'
        run: python scripts/ci/check-embedded-agent.py

      - name: Upload native lifecycle evidence
        if: always() && needs.changes.outputs.agent_lifecycle == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: embedded-agent-${{ runner.os }}
          path: target/embedded-agent-ci/
          if-no-files-found: error

  windows-update:
    name: Windows update fixtures
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: No Windows update changes
        if: needs.changes.outputs.windows_update != 'true'
        run: echo "No Windows update changes; fixture check skipped."

      - name: Checkout
        if: needs.changes.outputs.windows_update == 'true'
        uses: actions/checkout@v7

      - name: Install NSIS
        if: needs.changes.outputs.windows_update == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/NSIS/makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          }

      # Offline throwaway executables exercise the actual hooks and observer;
      # no signed release, user Agent, user data or production ACL is involved.
      - name: Installer preflight and update recovery
        if: needs.changes.outputs.windows_update == 'true'
        shell: powershell
        run: |
          & ./scripts/tests/test-windows-installer-preflight.ps1

      - name: Packaged lifecycle assertion regressions
        if: needs.changes.outputs.windows_update == 'true'
        shell: powershell
        run: |
          & ./scripts/tests/test-windows-lifecycle-assertions.ps1

      - name: Install script failure guidance
        if: needs.changes.outputs.windows_update == 'true'
        shell: powershell
        run: |
          & ./scripts/tests/test-install.ps1

  # ─── Desktop: typecheck + eslint + stylelint + vitest ─────────────────────────
  # Frontend only. The Tauri *backend* Rust is covered by rust-build (compile,
  # 3-platform) and rust-quality (lint + test, hard gate). Platform-agnostic.
  desktop:
    name: Desktop typecheck + lint + test
    needs: changes
    if: needs.changes.outputs.desktop_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: desktop
        run: npm run lint

      - name: Stylelint
        working-directory: desktop
        run: npm run stylelint

      - name: vitest
        working-directory: desktop
        run: npm run test

      - name: Shared shell result projection regressions
        working-directory: desktop
        run: npx vitest run --config ../packages/markdown/vitest.config.ts thread-projection/src/shellResult.test.ts

  # ─── Mobile: typecheck + eslint + jest ───────────────────────────────────
  mobile:
    name: Mobile typecheck + lint + test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: ESLint
        working-directory: mobile
        run: npm run lint

      - name: jest
        working-directory: mobile
        run: npm test
