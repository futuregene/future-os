name: CI

permissions: read-all

# Fast feedback on every PR and on manual dispatch:
# lint + typecheck + tests + a 3-platform Rust compile check. Full
# cross-platform *packaging* stays in build.yml (tags / dispatch) — this
# workflow exists so breakage (especially platform-conditional Rust that only
# shows up on Windows/macOS) is caught BEFORE a release build is cut.
#
# Push-to-main trigger is intentionally absent: "Require branches to be up
# to date before merging" on branch protection already forces the PR check
# to re-run on the merged result, so a post-merge run would be redundant.
on:
  pull_request:
  # Lets you run the whole PR-check suite manually from the Actions tab
  # (e.g. to verify a cross-platform fix on a feature branch without a PR).
  workflow_dispatch:

# Re-pushing a branch cancels its stale run; release tags are unaffected
# (this workflow never triggers on tags anyway).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On PRs, run only the suites affected by the changed paths. Manual
  # dispatches are deliberately full runs: the escape hatch for dependency/
  # runner changes that do not show up in a source diff.
  changes:
    name: Detect affected checks
    runs-on: ubuntu-latest
    outputs:
      rust_workspace: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.rust_workspace == 'true' || steps.filter.outputs.ci == 'true' }}
      # Per-crate triggers for the rust-tests groups, so a PR that touches only
      # one crate runs only that crate's test group. Each inherits the shared
      # build-graph inputs (root manifest, lock, toolchain, future-rpc) — those
      # affect every workspace crate.
      rust_agent: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.rust_agent == 'true' || steps.filter.outputs.ci == 'true' }}
      rust_tui_cli: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.rust_tui_cli == 'true' || steps.filter.outputs.ci == 'true' }}
      rust_channels_rpc_loop: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.rust_channels_rpc_loop == 'true' || steps.filter.outputs.ci == 'true' }}
      # Proto/codegen freshness only needs re-checking when a proto source,
      # its build script, the generated output, or a build-dep version changes.
      proto: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.proto == 'true' || steps.filter.outputs.ci == 'true' }}
      desktop_tauri: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.desktop_tauri == 'true' || steps.filter.outputs.ci == 'true' }}
      desktop_frontend: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.desktop_frontend == 'true' || steps.filter.outputs.ci == 'true' }}
      mobile: ${{ steps.force.outputs.all == 'true' || steps.filter.outputs.mobile == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - id: force
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "all=false" >> "$GITHUB_OUTPUT"
          else
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          # v4.0.3+ supports 'some-with-excludes': a file is included only if it
          # matches at least one non-negated pattern AND no `!`-negated pattern.
          # The v3 default 'some' treats a `!` pattern as a match of "everything
          # outside it", which made desktop_frontend/mobile match unrelated files
          # like CLAUDE.md and run those suites on nearly every PR.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            # Changing this workflow must revalidate every suite.
            ci:
              - '.github/workflows/ci.yml'
            # Aggregate: any workspace crate (or a shared build-graph file) —
            # drives the workspace-level fmt/clippy and cross-platform build.
            rust_workspace:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'packages/rpc/**'
              - 'agent/**'
              - 'channels/**'
              - 'tui/**'
              - 'cli/**'
              # The loop control plane is a workspace member — its changes must
              # run the same fmt/clippy/test gates (previously missing here).
              - 'orchestration/**'
            # Per-crate triggers. Shared inputs (manifest/lock/toolchain/rpc)
            # are repeated so a change to any of them runs every group.
            rust_agent:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'packages/rpc/**'
              - 'agent/**'
            rust_tui_cli:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'packages/rpc/**'
              - 'tui/**'
              - 'cli/**'
            rust_channels_rpc_loop:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - 'packages/rpc/**'
              - 'channels/**'
              - 'orchestration/**'
            # Proto codegen freshness: only re-check when a proto source, its
            # build script, the generated output, or a build-dep version could
            # have drifted. Unrelated Rust changes skip the REGENERATE_PROTO
            # cargo build.
            proto:
              - 'packages/rpc/**'
              - 'channels/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            desktop_tauri:
              - 'desktop/src-tauri/**'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              # The desktop backend path-depends on future-rpc; changes there must
              # revalidate the desktop backend too.
              - 'packages/rpc/**'
            desktop_frontend:
              - 'desktop/**'
              - '!desktop/src-tauri/**'
              - 'packages/markdown/**'
              - 'packages/thread-projection/**'
              # The root npm workspace manifest + lock define the shared install.
              - 'package.json'
              - 'package-lock.json'
            mobile:
              - 'mobile/**'
              - '!mobile/android/**'
              - '!mobile/ios/**'
              - 'packages/markdown/**'
              - 'packages/thread-projection/**'
              - 'package.json'
              - 'package-lock.json'

  # ─── Rust lint gate (Linux): fmt + clippy ─────────────────────────────────
  # Lint every workspace crate (agent / channels / tui / cli / loop / future-rpc,
  # via `--all` and `--workspace --all-targets`) plus the desktop Tauri backend.
  # Tests run in the independent `rust-tests` job below so both gates can
  # execute in parallel.
  rust-quality:
    name: Rust fmt + clippy (Linux)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      # Always-present (no job-level `if`): a skipped required check is treated
      # as unsatisfied, which would block docs-only PRs. Evaluate the gate here
      # and gate every heavy step on it; an unaffected PR reports success via a
      # no-op echo (the same pattern rust-tests uses).
      - name: Is the Rust quality gate affected?
        id: affected
        env:
          OUTPUTS: ${{ toJSON(needs.changes.outputs) }}
        run: |
          ws=$(echo "$OUTPUTS" | jq -r '.rust_workspace // "false"')
          dt=$(echo "$OUTPUTS" | jq -r '.desktop_tauri // "false"')
          if [ "$ws" = "true" ] || [ "$dt" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No affected Rust quality checks
        if: steps.affected.outputs.run != 'true'
        run: echo "No Rust workspace or desktop Tauri changes; lint skipped."

      - name: Checkout
        if: steps.affected.outputs.run == 'true'
        uses: actions/checkout@v7

      # Pinned to match rust-toolchain.toml so CI and local dev use the same
      # compiler. Bump both together (see build.yml for the same pin).
      - name: Setup Rust
        if: steps.affected.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        if: steps.affected.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          cache-on-failure: true
          cache-all-crates: true

      # Run formatting before any package installation: rustfmt only needs the
      # pinned toolchain, so a formatting failure returns immediately even when
      # an Ubuntu mirror is unhealthy.
      - name: rustfmt (workspace)
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.rust_workspace == 'true'
        run: cargo fmt --check --all

      - name: rustfmt (desktop backend)
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.desktop_tauri == 'true'
        run: cargo fmt --check --manifest-path desktop/src-tauri/Cargo.toml

      # mold + binutils because .cargo/config.toml pins -fuse-ld=mold and clippy
      # still links build scripts, proc-macros and test binaries. WebKit/GTK for
      # the Tauri -sys build scripts (desktop backend is part of this gate now).
      # protobuf-compiler is needed only for the `proto codegen is fresh` step
      # below — normal builds never run protoc (generation is gated on
      # REGENERATE_PROTO).
      - name: Install Linux deps
        if: steps.affected.outputs.run == 'true'
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            protobuf-compiler

      # tauri-build's build script aborts with `resource path ... doesn't exist`
      # unless every `bundle.externalBin` sidecar is present. For lint empty
      # placeholders suffice.
      - name: Create placeholder sidecars
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.desktop_tauri == 'true'
        run: |
          triple=$(rustc -Vv | sed -n 's/^host: //p')
          mkdir -p desktop/src-tauri/binaries
          : > "desktop/src-tauri/binaries/future-$triple"

      # ── Workspace crates (agent / channels) ──
      # --all because the root manifest is a virtual workspace (no [package]);
      # --manifest-path would fail with "Failed to find targets".
      - name: clippy (workspace)
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.rust_workspace == 'true'
        run: cargo clippy --workspace --all-targets --manifest-path Cargo.toml -- -D warnings

      # The generated wire code (future-rpc proto.rs, channels feishu_ws.rs) is
      # checked in; guard against proto edits that skip `make generate-proto`.
      # Output is deterministic for pinned prost/tonic-build, so a regenerate
      # on the same source must be a no-op.
      - name: proto codegen is fresh
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.proto == 'true'
        run: |
          (cd packages/rpc && REGENERATE_PROTO=1 cargo build)
          (cd channels && REGENERATE_PROTO=1 cargo build)
          git diff --exit-code packages/rpc/src/generated/proto.rs channels/src/generated/

      # ── desktop Tauri backend ──
      - name: clippy (desktop backend)
        if: steps.affected.outputs.run == 'true' && needs.changes.outputs.desktop_tauri == 'true'
        run: cargo clippy --all-targets --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings

  # ─── Rust test gates (Linux) ──────────────────────────────────────────────
  # One matrix job split into four parallel groups, each paying only its own
  # compile+run cost instead of everything serializing behind one big
  # `cargo test --workspace` and behind the desktop backend's independent
  # webkit/gtk dep tree. Groups map to crate clusters that share a build
  # graph; a PR pays setup+compile+run only for the groups it touches.
  #
  # Groups are always-present (per-step `if`, never job-level): branch
  # protection treats a *skipped* required check as unsatisfied, so e.g. a
  # mobile-only PR must still report success for every group (no-op echo
  # below). `rust-tests-gate` aggregates the groups into the single stable
  # required context "Rust tests (Linux)", so splitting/renaming groups never
  # requires touching the branch-protection ruleset.
  #
  # Workspace groups gate on their own per-crate trigger (rust_agent /
  # rust_tui_cli / rust_channels_rpc_loop) instead of the aggregate
  # rust_workspace, so a PR that touches only one crate runs only that crate's
  # test group. The aggregate still drives the workspace-level fmt/clippy and
  # cross-platform build. Workspace crates do not depend on desktop/src-tauri,
  # so a desktop-only change cannot break them (the reverse is NOT true —
  # future-rpc feeds the Tauri backend, and the path filter marks packages/rpc/**
  # as desktop_tauri too, so RPC changes also run the desktop group).
  #
  # CARGO_PROFILE_TEST_DEBUG=1 keeps file:line in panic backtraces while
  # dropping full debuginfo codegen — the dominant cost of building test
  # binaries. The cli/tui
  # golden-diff harnesses are NOT part of CI: they were the TS→Rust migration
  # acceptance gate and now only run manually (make test-cli-diff /
  # test-tui-diff) before a release.
  rust-tests:
    name: Rust tests (Linux) (${{ matrix.name }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            filter: rust_agent
            packages: -p future-agent
            desktop: 'false'
          - name: tui, cli
            filter: rust_tui_cli
            packages: -p future-tui -p future-cli
            desktop: 'false'
          - name: channels, rpc, loop
            filter: rust_channels_rpc_loop
            packages: -p future-channel -p future-rpc -p future-loop
            desktop: 'false'
          - name: desktop backend
            filter: desktop_tauri
            packages: ''
            desktop: 'true'
    steps:
      # Per-group affected check: reads the matching `changes` output by name
      # so each group gates independently without a job-level `if` (which
      # would skip the whole matrix and leave required checks "Expected").
      - name: Is this test group affected?
        id: affected
        env:
          FILTER: ${{ matrix.filter }}
          OUTPUTS: ${{ toJSON(needs.changes.outputs) }}
        run: |
          run=$(echo "$OUTPUTS" | jq -r --arg k "$FILTER" '.[$k] // "false"')
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: No affected Rust tests in this group
        if: steps.affected.outputs.run != 'true'
        run: echo "No affected Rust tests in this group; skipped."

      - name: Checkout
        if: steps.affected.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Setup Rust
        if: steps.affected.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@1.97.0

      # All groups share the automatic cache key (job id is identical across
      # matrix entries) so every group restores the same warm snapshot; per-
      # group `key` slots would quadruple cache storage (~4 × ~500MB) and
      # push the repo cache quota into LRU eviction of other jobs' entries.
      # Concurrent saves race on one key (first wins) — the losers just
      # recompile their own crates next run, which is bounded and parallel.
      - name: Cache Rust
        if: steps.affected.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          cache-on-failure: true
          cache-all-crates: true

      # The WebKit/GTK stack is only needed by the desktop backend's -sys
      # build scripts; workspace groups skip it (~40s of apt each). The root
      # workspace has no openssl-sys dependency, so libssl-dev is unnecessary
      # for its test groups.
      - name: Install Linux deps
        if: steps.affected.outputs.run == 'true'
        run: |
          packages=(
            build-essential \
            binutils \
            mold \
            pkg-config
          )
          if [ "${{ matrix.desktop }}" = 'true' ]; then
            packages+=(
              libayatana-appindicator3-dev \
              libgtk-3-dev \
              librsvg2-dev \
              libwebkit2gtk-4.1-dev
            )
          fi
          bash scripts/ci/install-apt-packages.sh "${packages[@]}"

      # tauri-build's build script aborts with `resource path ... doesn't
      # exist` unless every `bundle.externalBin` sidecar is present; empty
      # placeholders suffice for tests.
      - name: Create placeholder sidecars
        if: steps.affected.outputs.run == 'true' && matrix.desktop == 'true'
        run: |
          triple=$(rustc -Vv | sed -n 's/^host: //p')
          mkdir -p desktop/src-tauri/binaries
          : > "desktop/src-tauri/binaries/future-$triple"

      - name: cargo test (${{ matrix.name }})
        if: steps.affected.outputs.run == 'true'
        env:
          CARGO_PROFILE_TEST_DEBUG: 1
        run: |
          if [ "${{ matrix.desktop }}" = 'true' ]; then
            cargo test --manifest-path desktop/src-tauri/Cargo.toml
          else
            cargo test ${{ matrix.packages }}
          fi

  # Aggregator keeping the required check name stable across group splits:
  # fails iff any Rust test group failed. `if: always()` so a failed group
  # still yields an explicit red X on this required check (a skipped required
  # check would block the PR with a confusing "Expected" instead).
  rust-tests-gate:
    name: Rust tests (Linux)
    needs: rust-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All Rust test groups passed?
        run: |
          if [ "${{ needs.rust-tests.result }}" != 'success' ]; then
            echo "Rust test groups result: ${{ needs.rust-tests.result }}"
            exit 1
          fi
          echo "All Rust test groups passed."

  rust-build:
    name: Rust build (${{ matrix.name }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      # Keep the three matrix statuses present for branch protection. A
      # job-level `if` would skip matrix expansion entirely, leaving the
      # required per-platform checks as "Expected" on unrelated PRs.
      - name: No Rust or desktop Tauri changes
        if: needs.changes.outputs.rust_workspace != 'true' && needs.changes.outputs.desktop_tauri != 'true'
        run: echo "No Rust workspace or desktop Tauri changes; build check skipped."

      - name: Checkout
        if: needs.changes.outputs.rust_workspace == 'true' || needs.changes.outputs.desktop_tauri == 'true'
        uses: actions/checkout@v7

      - name: Setup Rust
        if: needs.changes.outputs.rust_workspace == 'true' || needs.changes.outputs.desktop_tauri == 'true'
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        if: needs.changes.outputs.rust_workspace == 'true' || needs.changes.outputs.desktop_tauri == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop/src-tauri
          cache-on-failure: true
          cache-all-crates: true

      - name: Install Linux system dependencies
        if: (needs.changes.outputs.rust_workspace == 'true' || needs.changes.outputs.desktop_tauri == 'true') && runner.os == 'Linux'
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      # tauri-build's build script aborts with `resource path ... doesn't exist`
      # unless every `bundle.externalBin` sidecar is present (host triple
      # appended, `.exe` on Windows). The packaging jobs build+copy the real
      # ones; for a type-check empty placeholders suffice. Split per-OS so
      # Windows uses pwsh natively instead of relying on git-bash's sed/case.
      - name: Create placeholder sidecars (Unix)
        if: runner.os != 'Windows' && needs.changes.outputs.desktop_tauri == 'true'
        run: |
          triple=$(rustc -Vv | sed -n 's/^host: //p')
          mkdir -p desktop/src-tauri/binaries
          : > "desktop/src-tauri/binaries/future-$triple"

      - name: Create placeholder sidecars (Windows)
        if: runner.os == 'Windows' && needs.changes.outputs.desktop_tauri == 'true'
        shell: pwsh
        run: |
          $triple = (rustc -Vv | Select-String '^host:').Line.Split(' ')[1]
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force -Path "desktop/src-tauri/binaries/future-$triple.exe" | Out-Null

      - name: cargo check (workspace)
        if: needs.changes.outputs.rust_workspace == 'true'
        run: cargo check --workspace --manifest-path Cargo.toml

      - name: cargo check (desktop Tauri backend)
        if: needs.changes.outputs.desktop_tauri == 'true'
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  # ─── Desktop: typecheck + eslint + stylelint + vitest ─────────────────────────
  # Frontend only. The Tauri *backend* Rust is covered by rust-build (compile,
  # 3-platform) and rust-quality (lint + test, hard gate). Platform-agnostic.
  desktop:
    name: Desktop typecheck + lint + test
    needs: changes
    if: needs.changes.outputs.desktop_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: desktop
        run: npm run lint

      - name: Stylelint
        working-directory: desktop
        run: npm run stylelint

      - name: vitest
        working-directory: desktop
        run: npm run test

  # ─── Mobile: typecheck + eslint + jest ───────────────────────────────────
  mobile:
    name: Mobile typecheck + lint + test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: ESLint
        working-directory: mobile
        run: npm run lint

      - name: jest
        working-directory: mobile
        run: npm test
