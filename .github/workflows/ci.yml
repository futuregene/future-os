name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

# PRs cancel stale runs. Main runs serialize so their cache-save steps finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  affected:
    name: Detect affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      typescript: ${{ steps.plan.outputs.typescript }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup pinned Rust for workspace metadata
        run: node scripts/ci/setup-rust.mjs
      - name: CI planner and gate regressions
        run: node --test scripts/tests/ci-plan.test.mjs
      - name: Collect changed files (including deletions and rename sources)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          let files = [];
          if (process.env.GITHUB_EVENT_NAME === 'pull_request') {
            const base = execFileSync('git', ['merge-base', process.env.PR_BASE, process.env.PR_HEAD],
              { encoding: 'utf8' }).trim();
            files = execFileSync('git', ['diff', '--name-only', '--no-renames', '-z', base, process.env.PR_HEAD],
              { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }).split('\0').filter(Boolean);
          } else if (['push', 'merge_group'].includes(process.env.GITHUB_EVENT_NAME)) {
            const base = process.env.MERGE_BASE || process.env.PUSH_BASE;
            if (!base || /^0+$/.test(base)) throw new Error('Missing diff base');
            files = execFileSync('git', ['diff', '--name-only', '--no-renames', '-z', base, 'HEAD'],
              { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }).split('\0').filter(Boolean);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'ci-files.json'), JSON.stringify(files));
          JS
      - name: Build execution plan
        id: plan
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' || inputs.full == true }}
        run: node scripts/ci/affected.mjs "$RUNNER_TEMP/ci-files.json"

  rust-linux-test:
    name: Rust Linux test
    needs: affected
    if: needs.affected.outputs.rust != '[]'
    uses: ./.github/workflows/rust-ci.yml
    with:
      os: ubuntu-latest
      mode: test
      projects: ${{ needs.affected.outputs.rust }}

  rust-windows-test:
    name: Rust Windows test
    needs: affected
    if: needs.affected.outputs.rust != '[]'
    uses: ./.github/workflows/rust-ci.yml
    with:
      os: windows-latest
      mode: test
      projects: ${{ needs.affected.outputs.rust }}

  rust-macos-test:
    name: Rust macOS test
    needs: affected
    if: needs.affected.outputs.rust != '[]'
    uses: ./.github/workflows/rust-ci.yml
    with:
      os: macos-latest
      mode: test
      projects: ${{ needs.affected.outputs.rust }}

  rust-check:
    name: Rust check
    needs: affected
    if: needs.affected.outputs.rust != '[]'
    uses: ./.github/workflows/rust-ci.yml
    with:
      os: ubuntu-latest
      mode: check
      projects: ${{ needs.affected.outputs.rust }}

  typescript-test:
    name: TypeScript test
    needs: affected
    if: needs.affected.outputs.typescript != '[]'
    uses: ./.github/workflows/typescript-ci.yml
    with:
      mode: test
      projects: ${{ needs.affected.outputs.typescript }}

  typescript-check:
    name: TypeScript check
    needs: affected
    if: needs.affected.outputs.typescript != '[]'
    uses: ./.github/workflows/typescript-ci.yml
    with:
      mode: check
      projects: ${{ needs.affected.outputs.typescript }}

  android-test:
    name: Android test
    needs: affected
    if: needs.affected.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build Debug app
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Native JVM tests (including local modules)
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Share staging IO tests
        run: python3 scripts/tests/test-mobile-share-io.py
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            mobile/android/**/build/reports/tests/
            mobile/modules/**/android/build/reports/tests/
          if-no-files-found: ignore

  ios-test:
    name: iOS test
    needs: affected
    if: needs.affected.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prebuild iOS and install pods
        working-directory: mobile
        run: npx expo prebuild --platform ios
      - name: Build Simulator app
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace FutureOS.xcworkspace -scheme FutureOS \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Native ShareInbox tests
        run: python3 scripts/tests/test-mobile-ios-share.py

  ci-result:
    name: CI result
    needs: [affected, rust-linux-test, rust-windows-test, rust-macos-test, rust-check, typescript-test, typescript-check, android-test, ios-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require success for every planned check
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-result.mjs
