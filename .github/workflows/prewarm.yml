# Optional, manually requested cache seed for new PRs. Run on main to save a
# default-branch cache; other branches can compile but do not publish seeds.
# PR CI saves its own merge-ref caches without requiring this workflow.
# Keep cache keys/profiles aligned with ci.yml. Test and lifecycle artifacts
# are compiled with --no-run; the actual suites execute only in PR CI.
name: Cache prewarm

permissions: read-all

on:
  workflow_dispatch:

concurrency:
  group: prewarm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── rust-build (Linux): dev checks + lifecycle test compilation ─────────
  # Writer for the `rust-build` key on Linux; consumers are ci.yml's
  # `Rust build (Linux)` job (same steps).
  build-linux:
    name: Cache prewarm / Rust build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Same root workspace/target directory as ci.yml's rust-build job.
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      - name: Install Linux system dependencies (base)
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config

      - name: Install Linux system dependencies (desktop GUI stack)
        run: |
          bash scripts/ci/install-apt-packages.sh \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      - name: cargo check (workspace)
        run: cargo check --workspace --exclude futureos --manifest-path Cargo.toml

      - name: cargo check (desktop Tauri backend)
        run: cargo check -p future-cli -p futureos

      - name: cargo check (desktop Tauri backend, no default features)
        run: cargo check --no-default-features --features headless --manifest-path desktop/src-tauri/Cargo.toml

      # Compile the same native fixtures as PR CI without starting services.
      - name: Compile embedded Agent native lifecycle
        run: python scripts/ci/check-embedded-agent.py --no-run

  build-windows:
    name: Cache prewarm / Rust build (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      - name: cargo check (workspace)
        run: cargo check --workspace --exclude futureos --manifest-path Cargo.toml

      - name: cargo check (desktop Tauri backend)
        run: cargo check -p future-cli -p futureos

      - name: cargo check (desktop Tauri backend, no default features)
        run: cargo check --no-default-features --features headless --manifest-path desktop/src-tauri/Cargo.toml

      - name: Compile embedded Agent native lifecycle
        run: python scripts/ci/check-embedded-agent.py --no-run

  build-macos:
    name: Cache prewarm / Rust build (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      - name: cargo check (workspace)
        run: cargo check --workspace --exclude futureos --manifest-path Cargo.toml

      - name: cargo check (desktop Tauri backend)
        run: cargo check -p future-cli -p futureos

      - name: cargo check (desktop Tauri backend, no default features)
        run: cargo check --no-default-features --features headless --manifest-path desktop/src-tauri/Cargo.toml

      - name: Compile embedded Agent native lifecycle
        run: python scripts/ci/check-embedded-agent.py --no-run

  # ─── rust-quality (Linux): fmt + clippy ──────────────────────────────────
  # Writer for the `rust-quality` key; consumer is ci.yml's `Rust fmt + clippy
  # (Linux)` job. `cargo fmt --check` is not repeated here: it needs no cache.
  quality:
    name: Cache prewarm / Rust fmt + clippy (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      - name: Install Linux deps (base)
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config

      - name: Install Linux deps (desktop GUI stack)
        run: |
          bash scripts/ci/install-apt-packages.sh \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      # protobuf-compiler / the proto-freshness check is not prewarmed: it
      # builds with REGENERATE_PROTO and its artifacts are not what the PR job
      # reuses.
      - name: clippy (workspace)
        run: cargo clippy --workspace --exclude futureos --all-targets --manifest-path Cargo.toml -- -D warnings

      - name: clippy (desktop backend)
        run: |
          cargo clippy -p future-cli -p futureos --all-targets -- -D warnings
          cargo clippy --no-default-features --features headless --all-targets --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings

  # ─── rust-tests (Linux): the workspace test groups ───────────────────────
  # Match the PR matrix so every writable entry contains its own group's
  # artifacts, without first-finisher races between different package sets.
  tests-workspace:
    name: Cache prewarm / Compile tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            filter: rust_agent
            packages: -p future-agent
          - name: tui, cli
            filter: rust_tui_cli
            packages: -p future-tui -p future-cli -p future-app-settings -p future-app-workspaces
          - name: channels, rpc, goal
            filter: rust_channels_rpc_goal
            packages: -p future-channel -p future-rpc -p future-goal -p future-tasks -p future-remote-crypto
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-workspace
          key: ${{ matrix.filter }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # One entry per matrix group, matching the PR cache partition.
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      - name: Install Linux deps
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config

      - name: Compile test group (${{ matrix.name }})
        env:
          CARGO_PROFILE_TEST_DEBUG: 1
        run: cargo test --no-run ${{ matrix.packages }}

  # ─── rust-tests (Linux): the desktop backend suite ───────────────────────
  # Writer for the `rust-tests-desktop` key; consumers are ci.yml's two
  # `Rust tests (Linux) (desktop gui | desktop headless)` entries. Both flavors
  # use matching per-flavor cache entries.
  tests-desktop:
    name: Cache prewarm / Compile desktop tests (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flavor: [gui, headless]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests-desktop
          key: ${{ matrix.flavor }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Match the per-flavor PR entries in the shared root target directory.
          workspaces: .
          cache-on-failure: true
          cache-all-crates: true

      - name: Install Linux deps
        run: |
          bash scripts/ci/install-apt-packages.sh \
            build-essential \
            binutils \
            mold \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Compile desktop test configuration (${{ matrix.flavor }})
        env:
          CARGO_PROFILE_TEST_DEBUG: 1
        run: |
          if [ "${{ matrix.flavor }}" = 'headless' ]; then
            cargo test --no-run --no-default-features --features headless --manifest-path desktop/src-tauri/Cargo.toml
          else
            cargo test --no-run --manifest-path desktop/src-tauri/Cargo.toml
          fi
