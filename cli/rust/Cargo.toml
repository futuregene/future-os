[package]
name = "cli-rust"
version = "0.0.0"
edition = "2021"
description = "Rust port of the TypeScript `future` CLI — byte-identical argument parsing, help text, output, and exit codes"
license = "MIT"

[[bin]]
name = "future"
path = "src/main.rs"

[lib]
name = "cli_rust"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
tonic.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "5"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tonic-build.workspace = true
