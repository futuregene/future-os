[package]
name = "future-cli"
version = "0.0.0"
edition = "2021"
description = "Rust port of the TypeScript `future` CLI — byte-identical argument parsing, help text, output, and exit codes"
license = "MIT"

[[bin]]
name = "future"
path = "src/main.rs"

[lib]
name = "future_cli"
path = "src/lib.rs"

[dependencies]
# Shared application backend, used directly by `future headless`.
future-host = { path = "../host" }
tokio.workspace = true
tonic.workspace = true
# Single proto codegen owner (PR #112): generated proto code lives in the
# future-rpc crate; the CLI consumes it instead of owning a generated copy.
future-rpc = { path = "../packages/rpc" }
# The desktop app's setting schema (keys, defaults, validation, app.db path),
# shared with the Tauri backend so `future desktop settings` cannot drift.
future-app-settings = { path = "../packages/app-settings" }
# The desktop app's workspace table and rules, shared with the Tauri backend so
# `future workspace add` and the app's own dialog cannot drift apart.
future-app-workspaces = { path = "../packages/app-workspaces" }
# The CLI opens the desktop app's database itself (`future workspace`); the
# connection, the pragmas and the row reads all go through the shared crate.
rusqlite = { version = "0.40", features = ["bundled"] }
# Embedded components: `future agent|tui|channel|goal <args>` runs the same
# code as the standalone binaries (kept as separate [[bin]] targets too, see
# Makefile run-* targets). The entry points build their own tokio runtimes,
# so the CLI dispatches them from main() BEFORE entering its own runtime.
future-agent = { path = "../agent" }
future-tui = { path = "../tui" }
future-channel = { path = "../channels" }
future-goal = { path = "../orchestration/goal" }
future-tasks = { path = "../orchestration/tasks" }
serde.workspace = true
# preserve_order: JSON object key order must match the TS CLI's JS semantics
# (JSON.parse preserves insertion order; serde_json's default BTreeMap sorts).
serde_json = { workspace = true, features = ["preserve_order"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
chrono = { workspace = true, features = ["clock"] }
dirs = "5"
humantime = "2"
base64.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
async-trait.workspace = true
indexmap = "2"
rpassword = "7"
tempfile.workspace = true
sha2 = "0.10"
anyhow = "1"
fs2 = "0.4"
fd-lock = "4"
# `future remote devices add`: the invitation is printed as a QR code in the
# terminal that asked for it, with the link kept when the terminal is narrow. The
# same two crates and versions the desktop entry point renders with, so the two
# print the same invitation.
qrcode = { version = "0.14", default-features = false }
terminal_size = "0.4"
# `future relay`: an account-free NATS relay served from this binary. Its HTTP
# surface is small (four routes, no middleware stack), so axum's default features
# are enough; `nkeys` signs the NATS user JWTs it issues.
axum = "0.7"
nkeys = "0.4"
rand = "0.8"

[dev-dependencies]
future-host = { path = "../host", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
libc = "0.2"
future-remote-crypto = { path = "../packages/remote-crypto" }
tokio-stream = { workspace = true, features = ["net"] }
# The relay's broker-level test drives a real `nats-server`; see
# `cli/tests/relay_nats_auth.rs`.
async-nats = "0.49"
futures-util.workspace = true

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9"
