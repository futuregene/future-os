[package]
name = "future-cli"
version = "0.0.0"
edition = "2021"
description = "Rust port of the TypeScript `future` CLI — byte-identical argument parsing, help text, output, and exit codes"
license = "MIT"

[[bin]]
name = "future"
path = "src/main.rs"

[lib]
name = "future_cli"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
tonic.workspace = true
# Single proto codegen owner (PR #112): generated proto code lives in the
# future-rpc crate; the CLI consumes it instead of owning a generated copy.
future-rpc = { path = "../packages/rpc" }
# The desktop app's setting schema (keys, defaults, validation, app.db path),
# shared with the Tauri backend so `future desktop settings` cannot drift.
future-app-settings = { path = "../packages/app-settings" }
# The desktop app's workspace table and rules, shared with the Tauri backend so
# `future workspace add` and the app's own dialog cannot drift apart.
future-app-workspaces = { path = "../packages/app-workspaces" }
# The CLI opens the desktop app's database itself (`future workspace`); the
# connection, the pragmas and the row reads all go through the shared crate.
rusqlite = { version = "0.40", features = ["bundled"] }
# Embedded components: `future agent|tui|channel|loop <args>` runs the same
# code as the standalone binaries (kept as separate [[bin]] targets too, see
# Makefile run-* targets). The entry points build their own tokio runtimes,
# so the CLI dispatches them from main() BEFORE entering its own runtime.
future-agent = { path = "../agent" }
future-tui = { path = "../tui" }
future-channel = { path = "../channels" }
future-loop = { path = "../orchestration/loop" }
future-tasks = { path = "../orchestration/tasks" }
serde.workspace = true
# preserve_order: JSON object key order must match the TS CLI's JS semantics
# (JSON.parse preserves insertion order; serde_json's default BTreeMap sorts).
serde_json = { workspace = true, features = ["preserve_order"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
chrono = { workspace = true, features = ["clock"] }
dirs = "5"
base64.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
async-trait.workspace = true
indexmap = "2"
rpassword = "7"
tempfile.workspace = true

[dev-dependencies]
tokio-stream = { workspace = true, features = ["net"] }
