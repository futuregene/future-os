[package]
name = "future-tui"
version = "0.0.0"
edition = "2021"
description = "Rust port of the TypeScript future-tui — 1:1 behavior (UI rendering, key handling, interaction, args, help text) with a self-implemented terminal backend"
license = "MIT"

[[bin]]
name = "future-tui"
path = "src/main.rs"

[lib]
name = "future_tui"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
regex = "1"
unicode-segmentation = "1.13"
pulldown-cmark = "0.13"
base64.workspace = true
uuid.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tonic.workspace = true
# Single proto codegen owner (PR #112): generated proto code lives in the
# future-rpc crate; the TUI consumes it instead of owning a generated copy.
future-rpc = { path = "../future-rpc" }
chrono = { workspace = true, features = ["clock"] }
dirs = "5"

# Windows terminal backend (terminal_windows.rs): console API for raw mode,
# VT input/output, window size and input waits. Target-gated — POSIX uses libc.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
