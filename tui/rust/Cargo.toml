[package]
name = "tui-rust"
version = "0.0.0"
edition = "2021"
description = "Rust port of the TypeScript future-tui — 1:1 behavior (rendering, key handling, interaction, help text) with a self-implemented terminal backend"
license = "MIT"

[[bin]]
name = "future-tui"
path = "src/main.rs"

[lib]
name = "future_tui"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
regex = "1"
unicode-segmentation = "1.13"
parking_lot.workspace = true

[dev-dependencies]
tempfile.workspace = true
