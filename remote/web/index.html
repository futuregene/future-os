<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Defense in depth (the device seed lives in localStorage): scripts only from
     this page + the pinned CDN origin; no base/form hijack. connect-src stays
     open because the platform/NATS hosts come from the pairing code. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; connect-src https: http: wss: ws:; base-uri 'none'; form-action 'none'" />
<title>Remote Control · Web 验证端</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, system-ui, sans-serif;
    background:#0f1115; color:#e6e6e6;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }

  /* ── 顶部连接设置 ───────────────────────────────────────── */
  header {
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    padding:8px 12px; padding-top:max(8px, env(safe-area-inset-top));
    background:#171a21; border-bottom:1px solid #262a33; flex:none;
  }
  header input { background:#0f1115; color:#e6e6e6; border:1px solid #333; border-radius:6px; padding:6px 8px; font-size:13px; }
  header input.code { flex:1; min-width:160px; }
  button { background:#2b6cff; color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button.ghost { background:#262a33; }
  button.sm { padding:4px 10px; font-size:12px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #status { margin-left:auto; font-size:12px; padding:3px 8px; border-radius:999px; background:#333; white-space:nowrap; }
  #status.ok { background:#1f6f3f; } #status.err { background:#7f2b2b; }
  #presenceStatus { font-size:12px; padding:3px 8px; border-radius:999px; white-space:nowrap; }
  #presenceStatus.online { background:#1f6f3f; color:#fff; }
  #presenceStatus.offline { background:#4a4a4a; color:#9aa4b2; }
  .srow .streaming-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#2b6cff; margin-right:4px; vertical-align:middle; }

  /* ── 主体：会话列表 + 对话区 ─────────────────────────────── */
  #app { flex:1; display:flex; min-height:0; }
  .pane-head {
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-bottom:1px solid #262a33; background:#12151c; flex:none; font-size:13px;
  }
  .pane-head .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pane-head .spacer { flex:1; }
  .chk { display:flex; align-items:center; gap:4px; font-size:12px; color:#9aa4b2; white-space:nowrap; }
  .pane-head select {
    background:#0f1115; color:#e6e6e6; border:1px solid #333; border-radius:6px;
    padding:3px 6px; font-size:12px; max-width:140px;
  }
  .pane-head select:disabled { opacity:.5; }

  /* 会话列表 */
  #sidebar { display:flex; flex-direction:column; min-height:0; width:100%; border-right:1px solid #262a33; }
  #sessionList { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
  .srow {
    display:flex; flex-direction:column; gap:2px; padding:11px 12px;
    border-bottom:1px solid #1c2029; cursor:pointer;
  }
  .srow:hover { background:#161a22; }
  .srow.active { background:#1b2436; box-shadow: inset 3px 0 0 #2b6cff; }
  .srow .st { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .ss { font-size:11px; color:#6b7482; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hint { padding:16px 12px; color:#6b7482; font-size:12px; }

  /* 对话区 */
  #chat { display:none; flex:1; flex-direction:column; min-height:0; }
  #log { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:8px; padding:12px; }
  /* white-space:normal so block-level markdown controls line breaks (the user
     bubble keeps pre-wrap below to preserve the sender's raw newlines). */
  .bubble { max-width:88%; border:1px solid #262a33; border-radius:12px; padding:9px 12px; background:#141821; white-space:normal; word-break:break-word; align-self:flex-start; }
  .bubble.user { background:#1b2436; border-color:#2c3b57; align-self:flex-end; white-space:pre-wrap; }
  .md-root > :first-child { margin-top:0; }
  .md-root > :last-child { margin-bottom:0; }

  /* ── Markdown 渲染（结构对齐 GUI 桌面端，配色用本页暗色板） ─────── */
  .md-p { margin:6px 0; }
  .md-h1, .md-h2, .md-h3 { margin:10px 0 6px; color:#f2f4f8; font-weight:700; line-height:1.3; }
  .md-h1 { font-size:17px; } .md-h2 { font-size:16px; } .md-h3 { font-size:15px; }
  .md-ul, .md-ol { margin:6px 0; padding-left:20px; }
  .md-li { margin:2px 0; }
  .md-task { margin-left:-20px; list-style:none; }
  .md-task input { margin-right:6px; vertical-align:middle; }
  .md-quote { margin:6px 0; padding-left:10px; border-left:2px solid #2b6cff; color:#9aa4b2; }
  .md-quote .md-p, .md-quote .md-ul, .md-quote .md-ol { margin:3px 0; }
  .md-code { padding:1px 5px; border-radius:4px; background:#1b2030; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; }
  .md-pre { margin:8px 0; padding:10px; overflow:auto; border:1px solid #262a33; border-radius:8px; background:#0f1115; }
  .md-pre code { padding:0; background:none; white-space:pre; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; }
  .md-hr { margin:10px 0; border:0; border-top:1px solid #262a33; }
  .md-del { color:#9aa4b2; text-decoration:line-through; }
  .md-strong { font-weight:700; } .md-em { font-style:italic; }
  .md-a { color:#5b9bff; text-decoration:underline; word-break:break-all; }
  .md-table-wrap { margin:8px 0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .md-table { width:100%; overflow:hidden; border:1px solid #262a33; border-collapse:collapse; border-radius:8px; font-size:13px; }
  .md-table th, .md-table td { padding:6px 10px; border:1px solid #262a33; text-align:left; vertical-align:top; word-break:break-word; }
  .md-table th { color:#f2f4f8; font-weight:600; background:#1b2030; }
  .md-table tbody tr:nth-child(even) { background:#141a24; }
  .role { font-size:11px; color:#9aa4b2; margin-bottom:3px; }
  .think { color:#8b93a1; font-style:italic; font-size:13px; }
  .chip { display:inline-block; font-size:12px; padding:2px 8px; margin:2px 4px 2px 0; border-radius:999px; background:#2a2f3a; }
  .chip.done { background:#1f6f3f; }
  .err { color:#ff7b72; }
  .badge { font-size:11px; color:#9aa4b2; align-self:center; }
  .approval { align-self:stretch; border:1px solid #7a5b1f; background:#241d0e; border-radius:10px; padding:10px 12px; }

  #composer { display:flex; gap:8px; padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); border-top:1px solid #262a33; background:#12151c; flex:none; }
  #composer textarea { flex:1; background:#0f1115; color:#e6e6e6; border:1px solid #333; border-radius:10px; padding:9px; resize:none; min-height:44px; max-height:140px; font:inherit; }
  .composer-btns { display:flex; flex-direction:column; gap:6px; }
  .composer-btns button { min-width:64px; }
  .back-btn { display:none; }

  .empty { flex:1; display:flex; align-items:center; justify-content:center; color:#6b7482; font-size:13px; padding:20px; text-align:center; }

  /* ── 移动端：单栏切换（列表 ↔ 对话） ─────────────────────── */
  #app.show-chat #sidebar { display:none; }
  #app.show-chat #chat { display:flex; }
  .back-btn { display:inline-block; }

  /* ── 宽屏：左右双栏并排 ─────────────────────────────────── */
  @media (min-width:720px) {
    #sidebar { width:300px; flex:none; }
    #chat { display:flex; }
    #app.show-chat #sidebar { display:flex; }
    .back-btn { display:none; }
  }
</style>
</head>
<body>
<header>
  <input id="paircode" class="code" placeholder="粘贴配对码" />
  <button id="connect">连接</button>
  <button id="unlink" class="ghost" disabled>解绑</button>
  <span id="presenceStatus" class="offline">桌面离线</span>
  <span id="status">未连接</span>
</header>

<div id="app">
  <aside id="sidebar">
    <div class="pane-head">
      <span class="title">会话</span>
      <span class="spacer"></span>
      <button id="refresh" class="ghost sm" disabled>刷新</button>
      <button id="newsess" class="sm" disabled>新建</button>
    </div>
    <div id="sessionList"><div class="hint">连接后自动加载会话列表</div></div>
  </aside>

  <section id="chat">
    <div class="pane-head">
      <button id="back" class="ghost sm back-btn">‹ 会话</button>
      <span id="chatTitle" class="title">选择一个会话</span>
      <button id="renameBtn" class="ghost sm" title="重命名" style="display:none">✎</button>
      <span class="spacer"></span>
      <select id="modelSelect" style="display:none" title="模型"></select>
      <select id="thinkingSelect" style="display:none" title="思考等级"></select>
      <label class="chk"><input type="checkbox" id="verbose" /> 详细</label>
    </div>
    <div id="log"><div class="empty">从左侧选择会话，或点「新建」开始</div></div>
    <div id="composer">
      <textarea id="msg" placeholder="输入 prompt，Cmd/Ctrl+Enter 发送" disabled></textarea>
      <div class="composer-btns">
        <button id="send" disabled>发送</button>
      </div>
    </div>
  </section>
</div>

<script type="module">
import { connect, jwtAuthenticator } from "https://cdn.jsdelivr.net/npm/nats.ws@1/+esm";
import { createUser, fromPublic, fromSeed } from "https://cdn.jsdelivr.net/npm/nkeys.js@1/+esm";

const $ = (id) => document.getElementById(id);
const enc = (o) => new TextEncoder().encode(JSON.stringify(o));
const dec = (m) => JSON.parse(new TextDecoder().decode(m.data));

let nc = null, pair = "", session = "", bubble = null, thinkEl = null;
let curRun = null; const seenEvents = new Set();
const toolChips = new Map();
let sessions = []; let sessionsSig = ""; // 最近一次 list_sessions 结果，用于标题查找 + 高亮
let presence = null; // 桌面在线状态 + 每 session streaming
let isStreaming = false; // 当前选中会话是否在流式中（从事件或 presence 推断）
let sending = false;     // 正在等待 prompt 的 ack：防双击/超时重发产生重复消息
let presenceTimer = null; // 本地定时器：周期重算 presence 是否过期（watch 无事件时的兜底）
let availableModels = []; // list_models 结果缓存，连接时拉一次
let credentialRefreshTimer = null;
let confirmedBridgeInstanceId = "";
let handshakePromise = null;

function setStatus(t, cls) { const s = $("status"); s.textContent = t; s.className = cls || ""; }
function log(el) { $("log").appendChild(el); el.scrollIntoView({ block: "end" }); }
function line(text, cls) { const d = document.createElement("div"); d.className = cls || "badge"; d.textContent = text; log(d); return d; }
function clearLog() { $("log").innerHTML = ""; bubble = null; thinkEl = null; toolChips.clear(); }

function cmdSubject(sid) { return `p.${pair}.cmd.${sid || "new"}`; }

async function request(obj, sid) {
  if (!obj.id) obj.id = crypto.randomUUID();
  const m = await nc.request(cmdSubject(sid ?? session), enc(obj), { timeout: 10000 });
  const r = dec(m);
  // The bridge answers every command with an RpcResponse-shaped envelope;
  // surface success=false as a thrown error so callers' catch blocks show it
  // (e.g. a prompt rejected because the session is still running).
  if (r && r.success === false) throw new Error(r.error || "命令执行失败");
  return r;
}

function decodePairingCode(s) {
  try {
    let b64 = s.trim().replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    const pc = JSON.parse(atob(b64));
    if (pc?.v !== 2) return null;
    if (pc.exp && Math.floor(Date.now() / 1000) > pc.exp) return null;
    return pc;
  } catch { return null; }
}

function parsePairingInvitation(value) {
  try {
    const url = new URL(value.trim());
    if (url.protocol !== "futureos:" || url.host !== "remote" || url.pathname !== "/pair") return null;
    const code = url.searchParams.get("code");
    const desktopId = url.searchParams.get("desktopId");
    const desktopPublicKey = url.searchParams.get("desktopKey");
    if (!code || !desktopId?.startsWith("desktop_") || !desktopPublicKey?.startsWith("U")) return null;
    return { code, desktopId, desktopPublicKey };
  } catch { return null; }
}

function getDeviceId() {
  let id = localStorage.getItem("remote.deviceId");
  if (!id) {
    const r = () => Math.random().toString(16).slice(2);
    id = "dev_" + (crypto?.randomUUID?.().replace(/-/g, "") || (r() + r()));
    localStorage.setItem("remote.deviceId", id);
  }
  return id;
}

function storedCredentials() {
  try { return JSON.parse(localStorage.getItem("remote.credentials") || "null"); }
  catch { return null; }
}

function storeCredentials(creds) {
  localStorage.setItem("remote.credentials", JSON.stringify(creds));
}

function jwtExpiry(jwt) {
  try {
    let b64 = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    return JSON.parse(atob(b64)).exp || 0;
  } catch { return 0; }
}

async function responseJson(response) {
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.message || `HTTP ${response.status}`);
  return body;
}

async function claimPairing(value) {
  const invitation = parsePairingInvitation(value);
  const pc = invitation && decodePairingCode(invitation.code);
  if (!pc?.nonce || !pc?.claim_url) throw new Error("配对码无效或已过期");
  const kp = createUser();
  const seed = new TextDecoder().decode(kp.getSeed());
  const deviceId = getDeviceId();
  const body = await responseJson(await fetch(pc.claim_url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      nonce: pc.nonce,
      device_id: deviceId,
      device_public_key: kp.getPublicKey(),
      device_name: navigator.userAgentData?.platform || navigator.platform || "Web client",
    }),
  }));
  const creds = {
    pairId: body.pair_id,
    deviceId,
    seed,
    userJwt: body.user_jwt,
    refreshToken: body.refresh_token,
    natsWsUrl: body.nats_ws_url,
    tokenUrl: pc.claim_url.replace(/\/pair\/claim$/, "/auth/token"),
    expectedDesktopId: invitation.desktopId,
    expectedDesktopPublicKey: invitation.desktopPublicKey,
  };
  return creds;
}

async function refreshCredentials(creds) {
  const kp = fromSeed(new TextEncoder().encode(creds.seed));
  const body = await responseJson(await fetch(creds.tokenUrl, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      pair_id: creds.pairId,
      device_id: creds.deviceId,
      public_key: kp.getPublicKey(),
      role: "client",
      refresh_token: creds.refreshToken,
    }),
  }));
  const refreshed = { ...creds, userJwt: body.user_jwt, natsWsUrl: body.nats_ws_url };
  return refreshed;
}

function scheduleCredentialRefresh(creds) {
  if (credentialRefreshTimer) clearTimeout(credentialRefreshTimer);
  const delay = Math.max(5000, (jwtExpiry(creds.userJwt) * 1000) - Date.now() - 60000);
  credentialRefreshTimer = setTimeout(async () => {
    try {
      setStatus("更新凭证中…");
      const refreshed = await refreshCredentials(creds);
      if (nc) await nc.close();
      await connectWithCredentials(refreshed);
    } catch (e) {
      setStatus("凭证已失效: " + (e?.message || String(e)), "err");
    }
  }, delay);
}

function handshakeTranscript(challenge) {
  return [
    "futureos-remote-handshake-v1",
    challenge.pairId,
    challenge.desktopId,
    challenge.desktopPublicKey,
    challenge.bridgeInstanceId,
    challenge.deviceId,
    challenge.clientPublicKey,
    challenge.clientNonce,
    challenge.desktopNonce,
  ].join("\n");
}

function encodeBase64Url(bytes) {
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function decodeBase64Url(value) {
  try {
    let base64 = value.replace(/-/g, "+").replace(/_/g, "/");
    while (base64.length % 4) base64 += "=";
    return Uint8Array.from(atob(base64), char => char.charCodeAt(0));
  } catch { return null; }
}

async function performHandshake(creds) {
  if (!creds.expectedDesktopId || !creds.expectedDesktopPublicKey) {
    throw new Error("旧凭证未绑定桌面身份，请解除配对后重新扫码");
  }
  const kp = fromSeed(new TextEncoder().encode(creds.seed));
  const clientPublicKey = kp.getPublicKey();
  const clientNonce = `challenge_${crypto.randomUUID().replace(/-/g, "")}`;
  const challenge = (await request({
    type: "pair_handshake",
    protocolVersion: 1,
    pairId: creds.pairId,
    deviceId: creds.deviceId,
    clientPublicKey,
    clientNonce,
    expectedDesktopId: creds.expectedDesktopId,
    expectedDesktopPublicKey: creds.expectedDesktopPublicKey,
  }, "handshake")).data;
  const valid = challenge?.protocolVersion === 1
    && challenge.pairId === creds.pairId
    && challenge.desktopId === creds.expectedDesktopId
    && challenge.desktopPublicKey === creds.expectedDesktopPublicKey
    && challenge.bridgeInstanceId
    && challenge.deviceId === creds.deviceId
    && challenge.clientPublicKey === clientPublicKey
    && challenge.clientNonce === clientNonce
    && challenge.desktopNonce;
  if (!valid) throw new Error("桌面身份不匹配");
  const transcript = handshakeTranscript(challenge);
  const signature = decodeBase64Url(challenge.desktopSignature);
  if (!signature || !fromPublic(creds.expectedDesktopPublicKey).verify(new TextEncoder().encode(transcript), signature)) {
    throw new Error("桌面签名校验失败");
  }
  const clientSignature = encodeBase64Url(kp.sign(new TextEncoder().encode(transcript)));
  const confirmation = (await request({
    type: "pair_handshake_confirm",
    deviceId: creds.deviceId,
    desktopNonce: challenge.desktopNonce,
    clientSignature,
  }, "handshake")).data;
  if (!confirmation?.confirmed
    || confirmation.pairId !== creds.pairId
    || confirmation.desktopId !== creds.expectedDesktopId
    || confirmation.bridgeInstanceId !== challenge.bridgeInstanceId
    || confirmation.deviceId !== creds.deviceId
    || confirmation.desktopNonce !== challenge.desktopNonce
    || confirmation.presence?.bridgeInstanceId !== challenge.bridgeInstanceId) {
    throw new Error("桌面未确认配对");
  }
  confirmedBridgeInstanceId = confirmation.bridgeInstanceId;
  return confirmation;
}

function ensureHandshake(creds) {
  if (handshakePromise) return handshakePromise;
  const pending = performHandshake(creds);
  handshakePromise = pending;
  pending.then(
    () => { if (handshakePromise === pending) handshakePromise = null; },
    () => { if (handshakePromise === pending) handshakePromise = null; },
  );
  return pending;
}

async function connectWithCredentials(creds) {
  pair = creds.pairId;
  const seed = new TextEncoder().encode(creds.seed);
  const opts = {
    servers: creds.natsWsUrl,
    inboxPrefix: `p.${pair}.rep.${creds.deviceId}`,
    authenticator: jwtAuthenticator(creds.userJwt, seed),
  };
  nc = await connect(opts);
  const confirmation = await ensureHandshake(creds);
  storeCredentials(creds);
  onPresenceUpdate(confirmation.presence);
  setStatus("已连接", "ok");
  $("newsess").disabled = false; $("refresh").disabled = false; $("connect").disabled = true;
  $("unlink").disabled = false;
  const sub = nc.subscribe(`p.${pair}.evt.>`);
  (async () => { for await (const m of sub) onEvent(dec(m), m.subject); })();
  watchConnStatus();
  watchPresence();
  watchState();
  if (presenceTimer) clearInterval(presenceTimer);
  presenceTimer = setInterval(refreshPresenceIndicator, 10000);
  scheduleCredentialRefresh(creds);
  await loadModels();
  await listSessions();
}

async function revokeClient() {
  const creds = storedCredentials();
  if (!creds || !confirm("解绑后需要桌面重新生成配对码，确定继续？")) return;
  try {
    setStatus("正在解绑…");
    const kp = fromSeed(new TextEncoder().encode(creds.seed));
    const revokeUrl = creds.tokenUrl.replace(/\/auth\/token$/, "/pair/revoke");
    const response = await fetch(revokeUrl, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        pair_id: creds.pairId,
        device_id: creds.deviceId,
        public_key: kp.getPublicKey(),
        refresh_token: creds.refreshToken,
      }),
    });
    if (!response.ok && response.status !== 401) await responseJson(response);
    if (credentialRefreshTimer) clearTimeout(credentialRefreshTimer);
    if (presenceTimer) clearInterval(presenceTimer);
    if (nc) await nc.close();
    nc = null; pair = ""; session = ""; presence = null;
    localStorage.removeItem("remote.credentials");
    $("connect").disabled = false; $("unlink").disabled = true;
    $("newsess").disabled = true; $("refresh").disabled = true; $("msg").disabled = true;
    $("presenceStatus").textContent = "桌面离线";
    $("presenceStatus").className = "offline";
    setStatus("已解绑");
  } catch (e) {
    setStatus("解绑失败: " + (e?.message || String(e)), "err");
  }
}

async function doConnect() {
  const code = $("paircode").value.trim();
  try {
    setStatus(code ? "领取凭证中…" : "连接中…");
    let creds = code ? await claimPairing(code) : storedCredentials();
    if (code) $("paircode").value = "";
    if (!creds) throw new Error("请粘贴新的配对码");
    if (jwtExpiry(creds.userJwt) * 1000 < Date.now() + 60000) {
      creds = await refreshCredentials(creds);
    }
    await connectWithCredentials(creds);
  } catch (e) { setStatus("连接失败: " + (e?.message || String(e)), "err"); }
}

async function watchPresence() {
  const sub = nc.subscribe(`p.${pair}.presence`);
  try {
    for await (const message of sub) {
      const data = dec(message);
      if (!data?.bridgeInstanceId || data.bridgeInstanceId !== confirmedBridgeInstanceId) {
        try {
          setStatus("桌面已重启，正在重新验证身份…");
          const creds = storedCredentials();
          if (!creds) throw new Error("本地配对凭证不存在");
          const confirmation = await ensureHandshake(creds);
          onPresenceUpdate(confirmation.presence);
          setStatus("已连接", "ok");
        } catch (error) {
          setStatus("桌面身份验证失败: " + (error?.message || String(error)), "err");
        }
      } else {
        onPresenceUpdate(data);
      }
    }
  } catch { /* connection close */ }
}

async function watchState() {
  const sub = nc.subscribe(`p.${pair}.state.>`);
  const prefix = `p.${pair}.state.`;
  try {
    for await (const message of sub) {
      const suffix = message.subject.slice(prefix.length);
      const data = dec(message);
      if (suffix === "sessions") {
        onSessionsUpdate(data?.sessions ?? []);
      } else if (suffix === "workspaces") {
        onWorkspacesUpdate(data?.workspaces ?? []);
      }
    }
  } catch { /* connection close */ }
}

function sessionsSignature(list) {
  return list.map(x => (x.sessionId || "") + "\t" + (x.title || "")).join("\n");
}

function onPresenceUpdate(data) {
  presence = data;
  refreshPresenceIndicator();
  // Liveness only — sessions/workspaces arrive via state.* topics.
  // Handle legacy payloads that still embed sessions (handshake confirmation).
  if (Array.isArray(data.sessions)) {
    onSessionsUpdate(data.sessions);
  }
  if (Array.isArray(data.workspaces)) {
    onWorkspacesUpdate(data.workspaces);
  }
}

function onSessionsUpdate(sessionList) {
  // 更新当前会话 streaming 态
  if (session && Array.isArray(sessionList)) {
    const s = sessionList.find(x => x.sessionId === session);
    if (s) updateStreamingState(s.streaming);
  }
  // 目录快照同步（删除/新建/重命名）：用会话快照覆盖
  // 本地 sessions 数组，仅在内容变化时替换，避免重绘。
  if (Array.isArray(sessionList)) {
    const snap = sessionList.map(s => ({
      sessionId: s.sessionId,
      threadId: s.threadId || s.sessionId,
      title: s.title || "",
      mode: s.mode,
      workspaceId: s.workspaceId,
    }));
    const sig = sessionsSignature(snap);
    if (sig !== sessionsSig) {
      sessions = snap;
      sessionsSig = sig;
      // 若当前选中会话被桌面删除 → 退回新对话草稿态
      if (session && !snap.some(x => x.sessionId === session)) {
        newSession();
      }
    }
    // streaming 态：字段已改名 sessionId，保留发送键/停止键同步
    if (session) {
      const s = sessionList.find(x => x.sessionId === session);
      if (s) updateStreamingState(s.streaming);
    }
  }
  renderSessionList(); // 刷新列表上的 streaming 指示
}

function onWorkspacesUpdate(workspaceList) {
  // Workspaces are fetched via list_workspaces on demand; push is a hint.
  // For now just trigger a refresh if the list changed.
  if (Array.isArray(workspaceList)) {
    void listSessions(); // re-render (workspaces affect mode display)
  }
}

// 重算并渲染桌面在线/离线指示器。watch 是事件驱动的——桌面停止后 KV 不再
// 写入，watch 收不到任何事件，所以仅靠 onPresenceUpdate 无法让指示器随时间
// 翻转为离线。本地定时器周期调用本函数，按 lastHeartbeatTs 检测过期。
function refreshPresenceIndicator() {
  const el = $("presenceStatus");
  if (!el) return;
  const data = presence;
  const online = data?.online ?? false;
  const ts = data?.lastHeartbeatTs;
  // 超过 60s 未心跳视为离线（心跳间隔 20s，容忍丢 2 次）
  const stale = !ts || (Date.now() / 1000 - ts) > 60;
  if (!online || stale) {
    el.textContent = "桌面离线";
    el.className = "offline";
  } else {
    el.textContent = "桌面在线";
    el.className = "online";
  }
}

// 对齐 GUI：streaming 时发送键变"停止"(点击=abort)，composer 仍可编辑；
// 非 streaming 时为"发送"。没有独立的引导或排队入口，与 GUI 桌面端保持一致。
function updateStreamingState(streaming) {
  isStreaming = streaming;
  const btn = $("send");
  if (!btn) return;
  if (streaming) {
    btn.textContent = "停止";
    btn.className = "ghost";
    btn.disabled = false;
    btn.onclick = abort;
  } else {
    btn.textContent = "发送";
    btn.className = "";
    btn.disabled = false;
    btn.onclick = send;
  }
}

// core pub/sub 在断连期间的事件会丢；nats.ws 会自动重连并恢复订阅，但那段空窗的
// 事件追不回来。重连后若已选会话，重跑一次 selectSession（拉历史 + 回放当前轮），
// seenEvents 去重保证不重复。
async function watchConnStatus() {
  try {
    for await (const s of nc.status()) {
      if (s.type === "disconnect") setStatus("连接断开，重连中…", "err");
      else if (s.type === "reconnect") {
        try {
          setStatus("已重连，正在验证桌面身份…");
          const creds = storedCredentials();
          if (!creds) throw new Error("本地配对凭证不存在");
          const confirmation = await ensureHandshake(creds);
          onPresenceUpdate(confirmation.presence);
          setStatus("已重连", "ok");
          if (session) selectSession(session);
        } catch (error) {
          setStatus("重连身份验证失败: " + (error?.message || String(error)), "err");
        }
      }
    }
  } catch { /* 连接关闭时迭代结束，正常退出 */ }
}

// 懒创建（对齐 GUI 新建对话）：点"新建"不写库，只把本地切到"待输入"态。
// thread + agent session 在用户发首条消息时由 bridge 的 prompt 路径创建，
// 所以列表里不会出现空 "New Chat" 条目，也不存在 id 错位。
function newSession() {
  session = "";                 // 占位：尚无 DB 条目 / agent session
  curRun = null; seenEvents.clear();
  clearLog();
  $("chatTitle").textContent = "新对话";
  updateStreamingState(false);  // 恢复为可发送状态
  $("app").classList.add("show-chat");
  // 模型/思考选择器作为草稿显示；无 session 时 onchange 不会发命令，
  // 选中的值在 send 时随首条 prompt 一起发给 bridge seed 新 session。
  // 默认值对齐 GUI：localStorage 最近选择 → deepseek-v4-pro → isDefault → 首个。
  const lastModel = localStorage.getItem("remote.lastModelId") || "";
  const lastModelValid = availableModels.some(m => m.id === lastModel) ? lastModel : "";
  const defModel = lastModelValid
    || availableModels.find(m => m.id === "deepseek-v4-pro")?.id
    || availableModels.find(m => m.isDefault)?.id
    || availableModels[0]?.id
    || "";
  populateModelSelect(defModel);
  populateThinkingSelect(localStorage.getItem("remote.lastThinkingLevel") || "off");
  $("modelSelect").style.display = "";
  $("thinkingSelect").style.display = "";
  $("renameBtn").style.display = "none";   // 无 session 不能重命名
  $("msg").disabled = false;               // 发送键由 updateStreamingState(false) 设为"发送"
  document.querySelectorAll(".srow").forEach(r => r.classList.remove("active"));
  $("msg").focus?.();
}

async function listSessions() {
  try {
    const r = await request({ type: "list_sessions" }, "list");
    sessions = r?.data?.sessions || []; sessionsSig = sessionsSignature(sessions);
    renderSessionList();
  } catch (e) {
    const errDiv = document.createElement("div");
    errDiv.className = "hint err";
    errDiv.textContent = `会话列表加载失败: ${(e?.message || e)}`;
    $("sessionList").replaceChildren(errDiv);
  }
}

function renderSessionList() {
  const box = $("sessionList");
  box.innerHTML = "";
  if (!sessions.length) { box.innerHTML = `<div class="hint">暂无会话，点右上「新建」</div>`; return; }
  for (const s of sessions) {
    const row = document.createElement("div");
    row.className = "srow" + (s.sessionId === session ? " active" : "");
    row.dataset.sid = s.sessionId;
    const t = document.createElement("div"); t.className = "st";
    // presence 里有该 session 的 streaming 态 → 显示蓝点
    const pInfo = presence?.sessions?.find(x => x.sessionId === s.sessionId);
    if (pInfo?.streaming) {
      const dot = document.createElement("span"); dot.className = "streaming-dot";
      t.appendChild(dot);
    }
    t.appendChild(document.createTextNode(s.title || "(未命名)"));
    const sub = document.createElement("div"); sub.className = "ss"; sub.textContent = s.sessionId;
    row.append(t, sub);
    row.onclick = () => selectSession(s.sessionId);
    box.appendChild(row);
  }
}

function sessionTitle(sid) {
  return sessions.find((s) => s.sessionId === sid)?.title || "会话";
}

// run 结束后 agent 会按首条用户消息 auto-name 线程。web 没有 GUI 那套 store
// 事件监听，标题会停在新建时的 "New Chat"。这里在 agent_end 时主动刷新列表 +
// 标题。无竞态：auto-name 在 publish agent_end 之后同步落库，而 web 收到
// agent_end 要走一跳 NATS，届时 rename 早已提交。
async function refreshSessionTitle() {
  if (!session) return;
  try {
    await listSessions();
    const entry = sessions.find((s) => s.sessionId === session);
    if (entry?.title) $("chatTitle").textContent = entry.title;
  } catch { /* 刷新失败不影响主流程 */ }
}

// 切换到某会话：清屏 + 重置状态 + 拉历史 + 回放进行中轮 + 移动端切到对话视图。
async function selectSession(sid) {
  session = sid;
  curRun = null; seenEvents.clear();
  clearLog();
  $("chatTitle").textContent = sessionTitle(sid);
  $("msg").disabled = false;
  // 从 presence 恢复 streaming 态（决定发送键是"发送"还是"停止"）
  const pInfo = presence?.sessions?.find(x => x.sessionId === sid);
  updateStreamingState(pInfo?.streaming ?? false);
  $("app").classList.add("show-chat"); // 移动端进入对话；宽屏无副作用
  // 高亮列表
  document.querySelectorAll(".srow").forEach((r) => r.classList.toggle("active", r.dataset.sid === sid));
  await loadHistory(sid);
  // Only backfill the in-progress run — completed runs are already fully rendered
  // by loadHistory (the agent persists the final assistant message). Replaying
  // them would duplicate every text_chunk.
  if (pInfo?.streaming) {
    await backfillActiveRun(sid);
  }
  await loadSessionState(sid); // 填充模型/思考等级选择器 + 显示重命名按钮
}

// P1c：若该会话正有一轮在进行，回放其缓冲事件（从 idx 0），补齐中途加入丢掉的前缀。
// 事件带的 runId/idx 与实时事件一致，seenEvents 去重，实时流接着往下走。
async function backfillActiveRun(sid) {
  try {
    const r = await request({ type: "get_events_since", sessionId: sid, sinceIdx: -1 }, sid);
    const events = r?.data?.events || [];
    if (!events.length) return;
    if (r?.data?.truncated) line("⚠ 本轮开头部分超出缓冲已丢弃（仅显示可回放部分）", "err");
    const subj = `p.${pair}.evt.${sid}`;
    for (const ev of events) onEvent(ev, subj);
  } catch { /* 无进行中轮次 / 老版 Bridge 不支持：忽略 */ }
}

// 从 Bridge 拉该会话的持久化消息（get_messages，LLM Message 形状）并按气泡渲染。
// content 可能是字符串，也可能是 content blocks 数组（[{type:"text",text:…},…]）；
// tool 角色消息和纯工具调用的 assistant 消息（无文本）在聊天视图里跳过。
// 返回已加载消息中最大的 runId（供 backfillActiveRun 判断是否已包含当前轮）。
function messageText(content) {
  if (typeof content === "string") return content;
  if (Array.isArray(content)) {
    return content.filter(b => b && b.type === "text").map(b => b.text || "").join("");
  }
  return "";
}

async function loadHistory(sid) {
  try {
    // The bridge pages history so no single NATS reply exceeds the ~1MB
    // payload cap; follow the nextOffset cursor until exhausted. nextOffset
    // never moves backward, so a bad cursor can't loop forever.
    let offset = 0;
    let shown = 0;
    let hadAny = false;
    let maxRunId = null;
    for (;;) {
      const r = await request({ type: "get_messages", sessionId: sid, offset }, sid);
      const data = r?.data || {};
      if (data.total) hadAny = true;
      for (const m of data.messages || []) {
        const text = messageText(m.content);
        if (!text.trim()) continue;
        if (m.run_id) maxRunId = m.run_id;
        if (m.role === "user") { renderUser(text); shown++; }
        else if (m.role === "assistant") { renderAssistantStatic(text); shown++; }
      }
      if (!data.hasMore) break;
      const next = data.nextOffset;
      if (typeof next !== "number" || next <= offset) break;
      offset = next;
    }
    if (!hadAny) { line("（无历史消息）"); }
    else if (!shown) line("（无可显示的历史消息）");
    return maxRunId;
  } catch (e) { line("加载历史失败: " + (e?.message || e), "err"); return null; }
}

// ── 模型 / 思考等级 / 重命名 ──────────────────────────────────────────────

// 连接时拉一次可用模型列表，缓存到 availableModels。
async function loadModels() {
  try {
    const r = await request({ type: "list_models" }, "list");
    availableModels = r?.data?.models || [];
  } catch { /* 模型列表拉取失败不阻塞主流程 */ }
}

// 拉取当前会话状态（model / thinkingLevel），填充选择器并显示重命名按钮。
async function loadSessionState(sid) {
  try {
    const r = await request({ type: "get_state", sessionId: sid }, sid);
    const state = r?.data || {};
    populateModelSelect(state.model);
    populateThinkingSelect(state.thinkingLevel);
    $("modelSelect").style.display = "";
    $("thinkingSelect").style.display = "";
    $("renameBtn").style.display = "";
  } catch { /* 状态拉取失败：隐藏选择器 */ }
}

function populateModelSelect(currentModel) {
  const sel = $("modelSelect");
  sel.innerHTML = "";
  for (const m of availableModels) {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = (m.provider ? m.provider + "/" : "") + (m.label || m.id);
    if (m.id === currentModel || (m.provider && (m.provider + "/" + m.id) === currentModel)) opt.selected = true;
    sel.appendChild(opt);
  }
  // 当前模型不在列表时（可能已下线），插入占位项保持显示
  if (currentModel && ![...sel.options].some(o => o.selected)) {
    const opt = document.createElement("option");
    opt.value = currentModel; opt.textContent = currentModel; opt.selected = true;
    sel.prepend(opt);
  }
}

function populateThinkingSelect(currentLevel) {
  const sel = $("thinkingSelect");
  const levels = ["off", "low", "medium", "high"];
  sel.innerHTML = "";
  for (const lv of levels) {
    const opt = document.createElement("option");
    opt.value = lv; opt.textContent = lv;
    if (lv === (currentLevel || "off")) opt.selected = true;
    sel.appendChild(opt);
  }
}

async function onModelChange() {
  const modelId = $("modelSelect").value;
  if (modelId) localStorage.setItem("remote.lastModelId", modelId);
  if (!modelId || !session) return;
  try { await request({ type: "set_model", sessionId: session, modelId }, session); }
  catch (e) { line("切换模型失败: " + (e?.message || e), "err"); }
}

async function onThinkingChange() {
  const level = $("thinkingSelect").value;
  if (level) localStorage.setItem("remote.lastThinkingLevel", level);
  if (!session) return;
  try { await request({ type: "set_thinking_level", sessionId: session, level }, session); }
  catch (e) { line("切换思考等级失败: " + (e?.message || e), "err"); }
}

async function onRename() {
  const current = $("chatTitle").textContent;
  const name = prompt("重命名会话", current);
  if (!name?.trim() || !session) return;
  try {
    await request({ type: "set_session_name", sessionId: session, name: name.trim() }, session);
    // 更新本地标题 + 列表
    const s = sessions.find(x => x.sessionId === session);
    if (s) s.title = name.trim();
    $("chatTitle").textContent = name.trim();
    renderSessionList();
  } catch (e) { line("重命名失败: " + (e?.message || e), "err"); }
}

function ensureSession() { return session; }

async function send() {
  // 对齐 GUI：streaming 时禁止新的 plain prompt（GUI 弹 alreadyRunning toast）。
  // 运行中与 GUI 一致：拒绝新的 prompt，可先停止再发送。
  if (isStreaming) { line("正在回复中，请先停止或等待结束", "badge"); return; }
  // 上一条 prompt 的 ack 还没回来时忽略重发：双击或超时重试会用新的命令 id
  // 绕过 bridge 的单飞去重，产生重复的用户消息 + run。
  if (sending) return;
  const text = $("msg").value.trim(); if (!text) return;
  const wasNew = !session;        // 懒创建首条：当前还没有 DB 条目
  $("msg").value = "";
  renderUser(text); // 立即显示本端发的 prompt
  bubble = null; thinkEl = null; toolChips.clear();
  // 草稿的模型/思考等级随首条 prompt 一起发，bridge 在新建 session 时 seed 它们。
  const modelId = $("modelSelect")?.value || "";
  const level = $("thinkingSelect")?.value || "";
  sending = true;
  $("send").disabled = true;
  let ack;
  try {
    ack = await request({ type: "prompt", sessionId: session, message: text, modelId, level });
  } catch (e) {
    line("发送失败: " + (e?.message || e), "err");
    return;
  } finally {
    sending = false;
    updateStreamingState(isStreaming); // 恢复发送键（send/stop 由 streaming 态决定）
  }
  // 懒创建首条：bridge 刚建好 thread + 真实 agent session，ack 回传真实 id。
  // 把本地 session 切到真实 id，刷新列表/标题，否则后续事件/历史会对不上。
  const sid = ack?.data?.sessionId;
  if (sid && sid !== session) {
    session = sid;
    await listSessions();
    const entry = sessions.find(s => s.sessionId === sid);
    if (entry?.title) $("chatTitle").textContent = entry.title;
    document.querySelectorAll(".srow").forEach(r => r.classList.toggle("active", r.dataset.sid === sid));
    $("renameBtn").style.display = "";   // 有真 session 了，可重命名
  }
  // ack 回来前 session 还是占位，onEvent 按 subject 过滤丢掉了早期事件，补齐当前 run。
  if (wasNew && sid) await backfillActiveRun(sid);
}

async function abort() {
  if (!ensureSession()) return;
  try { await request({ type: "abort", sessionId: session }); line("已请求中断"); }
  catch (e) { line("中断失败: " + e.message, "err"); }
}

// ── Markdown → HTML ─────────────────────────────────────────────────────
// 自写渲染器，结构对齐 GUI 桌面端（remark-gfm 能力子集：标题/段落/列表/任务列表/
// 引用/代码/分割线/GFM 表格/行内 bold·italic·strike·code·link）。安全模型：所有
// 模型/用户文本在入 DOM 前经 escapeHtml 转义，注入的标签均为代码常量，链接 href 走
// 协议白名单——本页 localStorage 存设备 NKey seed，绝不能 innerHTML 未转义内容。
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
const escapeAttr = escapeHtml;
function isSafeUrl(url) { const u = url.trim(); return /^https?:\/\//i.test(u) || /^mailto:/i.test(u); }

const MD_CELL_PIPE = "§PIPE§";
const MD_TABLE_SEP = /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/;
function mdSplitCells(line) {
  let s = line.trim().replace(/\\\|/g, MD_CELL_PIPE);
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|")) s = s.slice(0, -1);
  return s.split("|").map((c) => c.split(MD_CELL_PIPE).join("|").trim());
}
function mdParseAligns(sep, n) {
  const cells = mdSplitCells(sep); const out = [];
  for (let i = 0; i < n; i += 1) {
    const c = (cells[i] || "").trim();
    out.push(/^:-+:$/.test(c) ? "center" : /^:-+$/.test(c) ? "left" : /^-+:$/.test(c) ? "right" : "left");
  }
  return out;
}
function mdNormalize(cells, n) {
  if (cells.length >= n) return cells.slice(0, n);
  return cells.concat(Array.from({ length: n - cells.length }, () => ""));
}
function mdIsTableSep(s) { return s.includes("|") && MD_TABLE_SEP.test(s); }

const MD_INLINE = /(`[^`]+`|\*\*[^*]+\*\*|~~[^~]+~~|\[[^\]]*\]\([^)\s]*\)|\*[^*]+\*)/g;
function inlineToHtml(text) {
  const parts = String(text).split(MD_INLINE); let html = "";
  for (const part of parts) {
    if (!part) continue;
    if (/^`[^`]+`$/.test(part)) { html += `<code class="md-code">${escapeHtml(part.slice(1, -1))}</code>`; continue; }
    if (/^\*\*[^*]+\*\*$/.test(part)) { html += `<strong class="md-strong">${inlineToHtml(part.slice(2, -2))}</strong>`; continue; }
    if (/^~~[^~]+~~$/.test(part)) { html += `<del class="md-del">${inlineToHtml(part.slice(2, -2))}</del>`; continue; }
    if (/^\*[^*]+\*$/.test(part)) { html += `<em class="md-em">${inlineToHtml(part.slice(1, -1))}</em>`; continue; }
    const link = part.match(/^\[([^\]]*)\]\(([^)\s]*)\)$/);
    if (link) {
      if (isSafeUrl(link[2] || "")) {
        html += `<a class="md-a" href="${escapeAttr(link[2] || "")}" target="_blank" rel="noopener noreferrer">${inlineToHtml(link[1] || "")}</a>`;
      } else { html += escapeHtml(part); }
      continue;
    }
    html += escapeHtml(part);
  }
  return html;
}

function mdIsBlockStart(line, after) {
  if (/^\s*```/.test(line)) return true;
  if (/^\s{0,3}([-*_])\1\1+\s*$/.test(line)) return true;
  if (/^\s{0,3}#{1,6}\s+/.test(line)) return true;
  if (/^\s*>/.test(line)) return true;
  if (/^\s*([-*+]|\d+\.)\s+/.test(line)) return true;
  if (line.includes("|") && after !== undefined && mdIsTableSep(after)) return true;
  return false;
}

function mdTableHtml(lines, i) {
  const headers = mdSplitCells(lines[i]); const n = headers.length;
  const aligns = mdParseAligns(lines[i + 1] || "", n); i += 2;
  const rows = [];
  while (i < lines.length && lines[i].trim() && lines[i].includes("|")) { rows.push(mdNormalize(mdSplitCells(lines[i]), n)); i += 1; }
  const ths = mdNormalize(headers, n).map((h, c) => `<th style="text-align:${aligns[c] || "left"}">${inlineToHtml(h)}</th>`).join("");
  const trs = rows.map((r) => `<tr>${r.map((cell, c) => `<td style="text-align:${aligns[c] || "left"}">${inlineToHtml(cell)}</td>`).join("")}</tr>`).join("");
  return { html: `<div class="md-table-wrap"><table class="md-table"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`, i };
}

function mdListHtml(lines, i) {
  const ordered = /^\s*\d+\./.test(lines[i]); const items = [];
  while (i < lines.length) {
    const m = lines[i].match(/^\s*([-*+]|\d+\.)\s+(.*)$/);
    if (!m || (/^\d+\./.test(m[1] || "") !== ordered)) break;
    const content = m[2] || ""; const task = !ordered && content.match(/^\[([ xX])\]\s+([\s\S]*)$/);
    if (task) {
      const checked = (task[1] || "").toLowerCase() === "x" ? " checked" : "";
      items.push(`<li class="md-li md-task"><input type="checkbox" disabled${checked}>${inlineToHtml(task[2] || "")}</li>`);
    } else { items.push(`<li class="md-li">${inlineToHtml(content)}</li>`); }
    i += 1;
  }
  const html = ordered ? `<ol class="md-ol">${items.join("")}</ol>` : `<ul class="md-ul">${items.join("")}</ul>`;
  return { html, i };
}

function mdToHtml(text) {
  const lines = String(text).replace(/\r\n/g, "\n").split("\n");
  const out = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i += 1; continue; }
    if (/^\s*```/.test(line)) {
      const code = []; i += 1;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { code.push(lines[i]); i += 1; }
      if (i < lines.length) i += 1;
      out.push(`<pre class="md-pre"><code>${escapeHtml(code.join("\n"))}</code></pre>`); continue;
    }
    const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+)$/);
    if (heading) { const lv = Math.min(heading[1].length, 3); out.push(`<h${lv} class="md-h${lv}">${inlineToHtml(heading[2] || "")}</h${lv}>`); i += 1; continue; }
    if (/^\s{0,3}([-*_])\1\1+\s*$/.test(line)) { out.push(`<hr class="md-hr">`); i += 1; continue; }
    if (/^\s*>/.test(line)) {
      const inner = [];
      while (i < lines.length) { const q = lines[i].match(/^\s*>\s?(.*)$/); if (!q) break; inner.push(q[1] || ""); i += 1; }
      out.push(`<blockquote class="md-quote">${mdToHtml(inner.join("\n"))}</blockquote>`); continue;
    }
    if (line.includes("|") && mdIsTableSep(lines[i + 1] || "")) { const t = mdTableHtml(lines, i); out.push(t.html); i = t.i; continue; }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) { const l = mdListHtml(lines, i); out.push(l.html); i = l.i; continue; }
    const para = [line]; i += 1;
    while (i < lines.length && lines[i].trim() && !mdIsBlockStart(lines[i], lines[i + 1])) { para.push(lines[i]); i += 1; }
    out.push(`<p class="md-p">${inlineToHtml(para.join("\n"))}</p>`);
  }
  return out.join("");
}

function assistantBubble() {
  if (!bubble) {
    bubble = document.createElement("div"); bubble.className = "bubble";
    bubble.innerHTML = `<div class="role">assistant</div>`;
    const root = document.createElement("div"); root.className = "md-root";
    bubble.appendChild(root); bubble._root = root; bubble._raw = "";
    log(bubble);
  }
  return bubble;
}

function renderUser(text) {
  const u = document.createElement("div"); u.className = "bubble user";
  u.innerHTML = `<div class="role">你</div>`; u.appendChild(document.createTextNode(text)); log(u);
}

// 历史里的助手消息：一次性整段渲染（非流式）。
function renderAssistantStatic(text) {
  const b = document.createElement("div"); b.className = "bubble";
  b.innerHTML = `<div class="role">assistant</div>`;
  const root = document.createElement("div"); root.className = "md-root"; root.innerHTML = mdToHtml(text);
  b.appendChild(root);
  log(b);
}

function onEvent(ev, subject) {
  const sess = subject ? subject.split(".").slice(3).join(".") : "";
  // 只处理当前选中会话的事件（过滤跨会话，避免堆积）
  if (sess && sess !== session) return;
  if (ev.type === "ping") return;
  // 新一轮：换新气泡（历史保留，不清屏），旧轮内容留在上方形成对话流。
  if (ev.runId && ev.runId !== curRun) {
    curRun = ev.runId; bubble = null; thinkEl = null; toolChips.clear();
  }
  // P1: 按 (runId,idx) 去重（乱序/重连重放都安全）
  if (ev.runId) {
    const key = ev.runId + ":" + ev.idx;
    if (seenEvents.has(key)) return;
    seenEvents.add(key);
  }
  const data = (() => { try { return JSON.parse(ev.data); } catch { return {}; } })();
  const verbose = $("verbose")?.checked;
  switch (ev.type) {
    case "ping": break;
    case "agent_start": updateStreamingState(true); if (verbose) line("▶ agent_start"); break;
    // 助手文本：始终显示（这是主内容）。
    case "text_chunk": { const b = assistantBubble(); b._raw += (data.text || ""); b._root.innerHTML = mdToHtml(b._raw); break; }
    case "thinking_start": break;
    case "thinking_delta": {
      if (!verbose) break;
      if (!thinkEl) { thinkEl = document.createElement("div"); thinkEl.className = "think"; log(thinkEl); }
      thinkEl.textContent += (data.text || ""); break;
    }
    case "thinking_end": break;
    case "tool_start": {
      if (!verbose) break;
      const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = "🔧 " + (data.tool_name || "tool");
      toolChips.set(data.tool_id, chip); const wrap = document.createElement("div"); wrap.appendChild(chip); log(wrap); break;
    }
    case "tool_end": { if (!verbose) break; const chip = toolChips.get(data.tool_id); if (chip) chip.className = "chip done"; break; }
    // 审批 / 错误：始终显示（需要操作/知情）。
    case "approval_request": renderApproval(data); break;
    case "error": line("✖ error: " + (data.error || ev.data), "err bubble"); break;
    case "agent_end": updateStreamingState(false); refreshSessionTitle(); if (verbose) line(data.error ? ("■ agent_end (error)") : "■ agent_end"); break;
    default: if (verbose) line("· " + ev.type);
  }
}

function renderApproval(data) {
  // SECURITY: approval fields come from agent events and embed workspace-
  // controlled content (command lines, file paths). Build the DOM with
  // textContent only — never innerHTML — because this page stores the device
  // NKey seed + refresh token in localStorage and an injected script would
  // steal the full device identity.
  const box = document.createElement("div"); box.className = "approval";
  const role = document.createElement("div"); role.className = "role";
  role.textContent = `需要审批：${data.tool_name || ""} (${data.risk_level || ""})`;
  const detail = document.createElement("div");
  detail.textContent = `${data.title || ""} — ${data.summary || ""}`;
  box.append(role, detail);
  const approve = document.createElement("button"); approve.textContent = "批准";
  const reject = document.createElement("button"); reject.textContent = "拒绝"; reject.className = "ghost";
  const decide = async (mode) => {
    try {
      await request({ type: "approval_decision", sessionId: session, entryId: data.approval_request_id, mode });
    } catch (e) {
      line("审批提交失败: " + (e?.message || e), "err");
      return;
    }
    box.querySelectorAll("button").forEach(b => b.disabled = true);
    box.appendChild(document.createTextNode("  → " + mode));
  };
  approve.onclick = () => decide("approved"); reject.onclick = () => decide("rejected");
  const row = document.createElement("div"); row.style.marginTop = "8px"; row.append(approve, reject); box.appendChild(row);
  // 对齐 GUI 审批快捷键：Cmd/Ctrl+Enter=批准，Esc=拒绝。
  box.tabIndex = 0;
  box.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); approve.click(); }
    else if (e.key === "Escape") { e.preventDefault(); reject.click(); }
  });
  log(box);
  box.focus();
}

// 自适应高度的输入框
function autoGrow() { const t = $("msg"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }

$("connect").onclick = doConnect;
$("unlink").onclick = revokeClient;
$("newsess").onclick = newSession;
$("refresh").onclick = listSessions;
$("send").onclick = send;
$("back").onclick = () => $("app").classList.remove("show-chat");
$("modelSelect").onchange = onModelChange;
$("thinkingSelect").onchange = onThinkingChange;
$("renameBtn").onclick = onRename;
$("msg").addEventListener("input", autoGrow);
// 对齐 GUI：streaming 时 Cmd/Ctrl+Enter 不发送（GUI 此时 early-return）；停止靠点"停止"键。
$("msg").addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !isStreaming) send(); });
$("unlink").disabled = !storedCredentials();
</script>
