[package]
name = "futureos"
version = "0.0.0"
description = "FutureOS desktop agent workspace"
authors = ["FutureOS"]
edition = "2021"

# Keep this crate out of the workspace so make targets that cd in
# (check-desktop / build-desktop) work without workspace.members trickery.
[workspace]

[lib]
name = "futureos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The `test` feature is only needed to drive `#[tauri::command]` wrappers
# through the real IPC deserialization path in unit tests (cov100 final-tauri):
# the async wrapper's `CommandArg::from_command(..)?` error arm is attributed
# to the `#[tauri::command]` attribute line and is only reachable by rejecting
# a malformed invoke body via `tauri::test::get_ipc_response`.
[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }

[dependencies]
# Shared agent wire contract (proto codegen + typed/JSON decode; typed-RPC
# milestone). Path dep: this crate lives in the root cargo workspace, and
# tonic/prost versions must stay aligned with its workspace pins.
future-rpc = { path = "../../packages/rpc" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread"] }
async-nats = "0.49"
nkeys = "0.4"
futures = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# System opener for paths/URLs (ShellExecuteW on Windows — never `cmd /C start`,
# whose re-parsing of `&`/`^`/`%VAR%` in arguments is an injection vector).
open = "5"
base64 = "0.22"
# Decode + downscale image attachments into thumbnails on the Rust side (avoids
# shipping the full-size image base64 over the IPC bridge to a webview canvas).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
# Use one process-wide Rustls provider. async-nats/Tauri already uses `ring`;
# reqwest keeps TLS without selecting its default aws-lc provider. We install
# this provider during application startup before constructing any HTTP client.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }
chrono = "0.4"
rand = "0.8"
# Workspace file `@`-mention picker: gitignore-aware directory walk + fuzzy rank.
ignore = "0.4"
fuzzy-matcher = "0.3"

# Win32 API for high-quality window icon (taskbar clarity). Loads the ICO file
# with proper multi-size support instead of Tauri's single-size GDI HICON.
# Target-specific on purpose: an unconditional dep pulls the `windows` crate
# into every platform's dependency graph, and windows v0.61's transitive
# windows-future conflicts with windows-core on macOS, breaking that build.
# Gating it on cfg(target_os = "windows") keeps it out of non-Windows graphs
# entirely while still satisfying the `use windows::...` in lib.rs on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

# macOS sends these workspace notifications before sleep/power-off, giving the
# paired phone a short chance to become offline before the machine disappears.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSOperation", "NSString", "block2"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.18", default-features = false, features = ["tokio"] }

# Stripped symbols + no debug info: smaller desktop binary and less link/scan
# I/O, negligible runtime cost for a Tauri shell. See ../../.cargo/config.toml.
# Thin LTO: cross-crate inlining for a few % runtime win and a smaller binary.
# codegen-units stays at the default (16) — 1 would squeeze a bit more but
# multiplies release build time, which CI pays on every tag.
[profile.release]
debug = false
strip = true
lto = "thin"
