[package]
name = "futureos"
version = "0.0.0"
description = "FutureOS desktop agent workspace"
authors = ["FutureOS"]
edition = "2021"
default-run = "futureos"

[lib]
name = "futureos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The main-thread driver (TAU-C8). `harness = false` gives this target a real `fn main()`
# — i.e. the process's main thread — which is what makes the AppKit/`muda` family
# (`menu.rs`, `run_with`'s own body, the `.setup` hook) reachable at all; libtest runs
# every test body on a spawned thread (docs/testing/module-tauri-shell.md §6.2).
# It is a *test* target on purpose: `cargo test` runs it (so `cargo llvm-cov` instruments
# it and its profile merges) and it is never bundled into the app, whereas a `src/bin/`
# file would be auto-discovered as a product binary.
# `required-features = ["gui"]`: `run_with` only exists in the gui build, so the headless
# leg (and CI's headless job) skips this target instead of failing to compile it.
[[test]]
name = "gui_main_thread_drive"
path = "tests/gui_main_thread_drive.rs"
harness = false
required-features = ["gui"]

[features]
default = ["gui"]
gui = [
    "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-shell",
    "dep:tauri-plugin-updater", "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-single-instance", "dep:arboard", "dep:objc2",
    "dep:block2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:zbus",
]
# Serve the frontend embedded from `build.frontendDist` (`desktop/dist`) instead
# of `build.devUrl`. Tauri derives `cfg(dev)` from this feature, so without it
# the binary is a dev-mode shell: it opens http://127.0.0.1:5173 and, with no
# Vite server running, shows only ERR_CONNECTION_REFUSED. `tauri build` enables
# it for every shipped binary; sources outside the Tauri CLI (`make
# install-local`, a bare `cargo build --profile local`) have to ask for it.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
future-host = { path = "../../host", features = ["test-support"] }
future-remote-server = { path = "../../packages/remote-server", features = ["test-support"] }
future-remote-client = { path = "../../packages/remote-client", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
# End-to-end transport checks drive the real loopback listener with a real
# WebSocket client (`terminal::server::end_to_end`). Features unify only for the
# test build; the library keeps the server-side `handshake`-only dependency.
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "connect",
] }

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2.7.4", features = [], optional = true }

# Tauri's `test` feature enables existing mock IPC tests. Keep it on the
# optional dependency, not an unconditional dev-dependency: server tests must
# compile without pulling in GTK/WebKit through the dev dependency graph.

[dependencies]
future-host = { path = "../../host" }
# Shared agent wire contract (proto codegen + typed/JSON decode; typed-RPC
# milestone). Path dep: this crate lives in the root cargo workspace, and
# tonic/prost versions must stay aligned with its workspace pins.
future-rpc = { path = "../../packages/rpc" }
future-agent = { path = "../../agent" }
anyhow = "1"
future-remote-crypto = { path = "../../packages/remote-crypto" }
future-remote-protocol = { path = "../../packages/remote-protocol" }
future-remote-server = { path = "../../packages/remote-server" }
future-remote-client = { path = "../../packages/remote-client" }
future-app-settings = { path = "../../packages/app-settings" }
# The desktop app's workspace records, shared with `future workspace` in the
# CLI so the two writers cannot drift apart.
future-app-workspaces = { path = "../../packages/app-workspaces" }
# Task kernel/store shared with the CLI and headless desktop (the tick loop
# is the single executor; this host wires it to the sidecar agent).
future-tasks = { path = "../../orchestration/tasks" }
tauri = { version = "2.12.5", features = ["protocol-asset", "test"], optional = true }
tauri-plugin-shell = { version = "2.5.0", optional = true }
tauri-plugin-updater = { version = "2.14.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "signal", "process", "net", "io-util", "macros"] }
qrcode = { version = "0.14", default-features = false }
terminal_size = "0.4"
fs2 = "0.4"
async-nats = "0.50"
nkeys = "0.4"
futures = "0.3"
tauri-plugin-dialog = { version = "2.8.3", optional = true }
tauri-plugin-single-instance = { version = "2.5.4", optional = true }
# System opener for paths/URLs (ShellExecuteW on Windows — never `cmd /C start`,
# whose re-parsing of `&`/`^`/`%VAR%` in arguments is an injection vector).
open = "5"
base64 = "0.23"
# Optional standard-gzip support for mobile remote JSON replies. It is retained
# for constrained links but disabled by default because lazy pages are small
# and React Native's current JS decompression cost exceeded the transfer saving.
# Enable at desktop process start with FUTURE_REMOTE_JSON_GZIP=1.
flate2 = "1"
tar = "0.4"
# Decode + downscale image attachments into thumbnails on the Rust side (avoids
# shipping the full-size image base64 over the IPC bridge to a webview canvas).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
# Use one process-wide Rustls provider. async-nats/Tauri already uses `ring`;
# reqwest keeps TLS without selecting its default aws-lc provider. We install
# this provider during application startup before constructing any HTTP client.
reqwest = { workspace = true, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Read the platform trust store ourselves, once per connect, instead of letting
# async-nats read it per connection and fail the connection when that read
# errors (see `remote::trust`). Same version async-nats already links.
rustls-native-certs = "0.8"
sha2 = "0.10"
minisign-verify = "0.3"
tempfile = "3"
chrono = "0.4"
rand = "0.8"
# Workspace file `@`-mention picker: gitignore-aware directory walk + fuzzy rank.
ignore = "0.4"
fuzzy-matcher = "0.3"
# Cross-platform native resource-manager clipboard paths (Finder/Explorer/Linux file managers).
arboard = { version = "3.6", default-features = false, optional = true }
# Embedded terminal (see docs/internals/desktop/embedded-terminal.md): a PTY session
# registry served to the app's own webview over a loopback-only HTTP/WebSocket
# listener — the opencode transport model. `portable-pty` is the cross-platform
# PTY abstraction (wezterm); the WebSocket upgrade rides tokio-tungstenite, the
# same version the workspace already pins for the channel bridges. The HTTP/1.1
# control routes are parsed in-crate (no axum/hyper): the loopback listener
# serves one request per connection and the repo already hand-rolls the web
# client's HTTP in `remote/mod.rs`.
portable-pty = "0.9"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
libc = "0.2"

# Win32 API for the native window chrome: the high-quality taskbar icon (ICO
# file loaded with proper multi-size support instead of Tauri's single-size GDI
# HICON) and the DWM caption/text colors that keep the title bar from clashing
# with the app's own surface.
# Target-specific on purpose: an unconditional dep pulls the `windows` crate
# into every platform's dependency graph, and windows v0.61's transitive
# windows-future conflicts with windows-core on macOS, breaking that build.
# Gating it on cfg(target_os = "windows") keeps it out of non-Windows graphs
# entirely while still satisfying the `use windows::...` in lib.rs on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# macOS sends these workspace notifications before sleep/power-off, giving the
# paired phone a short chance to become offline before the machine disappears.
# `NSApplication`/`NSImage` additionally back the Dock-icon fix for unbundled
# runs (`set_macos_dock_icon` in lib.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, features = ["NSApplication", "NSImage", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", optional = true, features = ["NSData", "NSNotification", "NSOperation", "NSString", "block2"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.0", default-features = false, features = ["tokio", "proxy"], optional = true }
# WebKitGTK hands the webview an empty `DataTransfer` for a clipboard image, so
# the composer reads the pasteboard image through arboard instead (see
# `commands/files.rs::read_native_clipboard_image`). `image-data` is enabled
# only here: macOS/Windows webviews already deliver the image as a pasted `File`,
# and arboard's image support would pull an extra image-format dependency (tiff)
# into those graphs for a path they never take.
arboard = { version = "3.6", default-features = false, features = [
    "image-data",
], optional = true }
