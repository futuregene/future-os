# Shared Rust workspace: core libraries and CLI/Desktop entry points.
#
# Remote libraries live in packages/remote-* and are hosted by Desktop/Mobile.
# tests/remote-interop combines public roles without an application dependency;
# its broker/process tests and host binary require the network-tests feature.
#
# Desktop shares the lockfile, build profiles and target directory.
# default-members keeps GUI dependencies out of ordinary root builds; use
# -p futureos explicitly (or the Tauri build script) to select Desktop.
#
# Versions for dependencies shared by ≥2 members live here, once — bump in
# one place instead of chasing drift across the Cargo.tomls. Members opt in
# with `{ workspace = true }` and may add features (cargo unifies them).
[workspace]
members = ["host", "agent", "channels", "packages/rpc", "packages/remote-crypto", "packages/remote-protocol", "packages/remote-client", "packages/remote-server", "packages/app-settings", "packages/app-workspaces", "packages/config", "packages/http", "orchestration/goal", "orchestration/tasks", "tui", "cli", "desktop/src-tauri", "tests/remote-interop"]
default-members = ["agent", "channels", "packages/rpc"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
iana-time-zone = "0.1"
base64 = "0.23"
async-trait = "0.1"
tokio-tungstenite = { version = "0.30", features = ["__rustls-tls"] }
tonic = "0.12"
prost = "0.13"
prost-build = "0.13"
tonic-build = "0.12"
tempfile = "3"

# Release profile lives at the workspace root — cargo silently IGNORES
# [profile.*] sections in member manifests (previously in agent/Cargo.toml).
[profile.release]
debug = false
strip = true
lto = "thin"

# Local iteration only — NOT a release profile. `release` above sets
# `lto = "thin"`, so every edit re-runs whole-graph ThinLTO even though only one
# crate changed: measured on a 20-thread Windows machine, touching one line of
# `future-cli` and rebuilding `--release` takes ~137 s, of which the linker is
# ~1.5 s. This profile keeps release-style optimisation but turns LTO off and
# lets Cargo reuse its incremental cache, which brings the same edit down to a
# few seconds. Nothing selects it implicitly: `cargo build --release`, `make
# build` and CI all keep using `release`, so shipping behaviour cannot drift.
# Use it while developing, e.g. `cargo build --profile local -p future-cli`.
[profile.local]
inherits = "release"
lto = false
incremental = true
debug = 0
strip = false
