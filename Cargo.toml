# Shared Rust workspace: core libraries and CLI/Desktop entry points.
#
# The remote-control bridge is embedded in the desktop Tauri backend
# (desktop/src-tauri/src/remote/) — see docs/internals/desktop/remote-control-*.md. The
# former standalone `remote/` crate is gone; only `desktop/web/` (the
# verification web client served by the embedded bridge) remains.
#
# Desktop shares the lockfile, build profiles and target directory.
# default-members keeps GUI dependencies out of ordinary root builds; use
# -p futureos explicitly (or the Tauri build script) to select Desktop.
#
# Versions for dependencies shared by ≥2 members live here, once — bump in
# one place instead of chasing drift across the Cargo.tomls. Members opt in
# with `{ workspace = true }` and may add features (cargo unifies them).
[workspace]
members = ["agent", "channels", "packages/rpc", "packages/remote-crypto", "packages/remote-protocol", "packages/remote-client", "packages/app-settings", "packages/app-workspaces", "orchestration/goal", "orchestration/tasks", "tui", "cli", "desktop/src-tauri"]
default-members = ["agent", "channels", "packages/rpc"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false }
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", features = ["__rustls-tls"] }
tonic = "0.12"
prost = "0.13"
prost-build = "0.13"
tonic-build = "0.12"
tempfile = "3"

# Release profile lives at the workspace root — cargo silently IGNORES
# [profile.*] sections in member manifests (previously in agent/Cargo.toml).
[profile.release]
debug = false
strip = true
lto = "thin"
