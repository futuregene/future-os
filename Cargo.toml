# Shared Rust workspace: core libraries and CLI/Desktop entry points.
#
# Remote libraries live in packages/remote-* and are hosted by Desktop/Mobile.
# tests/remote-interop combines public roles without an application dependency;
# its broker/process tests and host binary require the network-tests feature.
#
# Desktop shares the lockfile, build profiles and target directory.
# default-members keeps GUI dependencies out of ordinary root builds; use
# -p futureos explicitly (or the Tauri build script) to select Desktop.
#
# Versions for dependencies shared by 鈮? members live here, once 鈥?bump in
# one place instead of chasing drift across the Cargo.tomls. Members opt in
# with `{ workspace = true }` and may add features (cargo unifies them).
[workspace]
members = ["host", "agent", "channels", "packages/rpc", "packages/logging", "packages/remote-crypto", "packages/remote-protocol", "packages/remote-client", "packages/remote-server", "packages/app-settings", "packages/app-workspaces", "packages/config", "packages/http", "packages/relay-endpoint", "orchestration/goal", "orchestration/tasks", "orchestration/fusion", "tui", "cli", "desktop/src-tauri", "tests/remote-interop"]
default-members = ["agent", "channels", "packages/rpc"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
iana-time-zone = "0.1"
base64 = "0.23"
async-trait = "0.1"
tokio-tungstenite = { version = "0.30", features = ["__rustls-tls"] }
tonic = "0.12"
prost = "0.13"
prost-build = "0.13"
tonic-build = "0.12"
tempfile = "3"

# Release profile lives at the workspace root 鈥?cargo silently IGNORES
# [profile.*] sections in member manifests (previously in agent/Cargo.toml).
[profile.release]
debug = false
strip = true
lto = "thin"

# Local iteration only 鈥?NOT a release profile. `release` above sets
# `lto = "thin"`, so every edit re-runs whole-graph ThinLTO even though only one
# crate changed: measured on a 20-thread Windows machine, touching one line of
# `future-cli` and rebuilding `--release` takes ~137 s, of which the linker is
# ~1.5 s. This profile keeps release-style optimisation but turns LTO off and
# lets Cargo reuse its incremental cache, which brings the same edit down to a
# few seconds. Nothing selects it implicitly: `cargo build --release`, `make
# build` and CI all keep using `release`, so shipping behaviour cannot drift.
# Use it while developing, e.g. `cargo build --profile local -p future-cli`.
[profile.local]
inherits = "release"
lto = false
incremental = true
debug = 0
strip = false

# `debug = 1` is line tables only, which is what `cargo` already means by
# "1", so these are the levels that actually cost something in `dev` and `test`
# and are not needed to get a usable backtrace.
#
# Default `dev`/`test` is `debug = 2` (full type and variable debuginfo). That
# extra detail never changes what a test does, but it does double the artefacts
# and slows every non-incremental build of the workspace:
#
#   cargo build -p future-agent, cold, 32-core Mac (2026-11-15)
#     default  50 s  2,608 MB in target/debug
#     debug=1  37 s  1,911 MB
#     debug=0  44 s  1,459 MB   <- slower than 1: rustc re-does work it would
#                                  otherwise reuse
#   cargo nextest run -p future-agent --no-run, cold
#     default  79 s  4,179 MB   (future-agent's test targets are large)
#     debug=1  64 s  3,261 MB
#   incremental rebuild after a one-line edit: 601 ms vs 612 ms (no change —
#   debuginfo is emitted once per crate body, not per edit)
#
# Line tables are what a panic backtrace needs for `file.rs:LINE`, so a failing
# test still reports its location. Line coverage is unaffected: `cargo llvm-cov`
# on `future-config` reports the same 135 lines found / 114 hit (84.4%) under
# both levels, because llvm-cov maps hits through exactly these line tables.
#
# `debug = 0` is not used: it saves more disk but was measurably *slower* cold
# than `1`, and it drops backtraces to `??`.
[profile.dev]
debug = 1

[profile.test]
debug = 1

# The bundled SQLite is C, so the dev/test profiles compile it at `-O0`. Query
# *compilation* is this schema's dominant cost — `SELECT … FROM entry_records`
# measured 26 ms to prepare against 0.2 ms to execute (see
# docs/testing/coverage-waivers-2026-11/agent.md) — and that cost is the C
# compiler's optimiser being absent, not the query being hard. Optimising just
# the vendored C keeps every Rust crate on the debug profile (fast incremental
# builds, full debug assertions) while the library the tests spend their time
# inside runs at the speed it was written for.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.test.package.libsqlite3-sys]
opt-level = 3
