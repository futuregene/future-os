[package]
name = "future-remote-client"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-support = []

[dependencies]
future-remote-protocol = { path = "../remote-protocol" }
future-remote-crypto = { path = "../remote-crypto" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
async-nats = "0.49"
nkeys = "0.4"
thiserror = "2"
url = "2"
futures = { workspace = true }
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
