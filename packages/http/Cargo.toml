[package]
name = "future-http"
version = "0.1.0"
edition = "2021"
description = "Shared HTTP client construction and TLS provider initialization"

[features]
blocking = ["reqwest/blocking"]

[dependencies]
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
