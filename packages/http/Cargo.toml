[package]
name = "future-http"
version = "0.1.0"
edition = "2021"
publish = false
description = "HTTP client entry points that install the process TLS provider before construction"

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
