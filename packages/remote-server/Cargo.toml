[package]
name = "future-remote-server"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-support = []

[dependencies]
future-remote-protocol = { path = "../remote-protocol" }
future-remote-crypto = { path = "../remote-crypto" }
future-relay-endpoint = { path = "../relay-endpoint" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
async-nats = "0.50"
futures = { workspace = true }
flate2 = "1"
nkeys = "0.4"
rand = "0.8"
thiserror = "2"
url = "2"

[dev-dependencies]
chrono = { workspace = true }
tempfile = { workspace = true }
