[package]
name = "future-host"
version = "0.0.0"
edition = "2021"
description = "GUI-free application backend shared by FutureOS entry points"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
# Helpers used by real application integration tests; no GUI/test framework.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
future-app-settings = { path = "../packages/app-settings" }
future-app-workspaces = { path = "../packages/app-workspaces" }
future-remote-client = { path = "../packages/remote-client" }
future-remote-server = { path = "../packages/remote-server" }

tokio.workspace = true
futures = "0.3"

future-agent = { path = "../agent" }
future-rpc = { path = "../packages/rpc" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

chrono = "0.4"
sha2 = "0.10"
ignore = "0.4"
fuzzy-matcher = "0.3"
rand = "0.8"

fs2 = "0.4"
nkeys = "0.4"
tonic.workspace = true

[dev-dependencies]
libc = "0.2"
tempfile = "3"
