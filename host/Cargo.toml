[package]
name = "future-host"
version = "0.0.0"
edition = "2021"
description = "GUI-free application backend shared by FutureOS entry points"
license = "MIT"

[lib]
path = "src/lib.rs"

[features]
default = []
# Helpers used by real application integration tests; no GUI/test framework.
test-support = ["future-remote-server/test-support", "future-remote-client/test-support"]

[dependencies]
future-http.workspace = true
future-remote-crypto = { path = "../packages/remote-crypto" }
future-remote-protocol = { path = "../packages/remote-protocol" }
async-nats = "0.50"
base64 = "0.23"
flate2 = "1"
rustls-native-certs = "0.8"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
future-app-settings = { path = "../packages/app-settings" }
future-app-workspaces = { path = "../packages/app-workspaces" }
future-remote-client = { path = "../packages/remote-client" }
future-remote-server = { path = "../packages/remote-server" }

tokio.workspace = true
futures = "0.3"

future-agent = { path = "../agent" }
future-tasks = { path = "../orchestration/tasks" }
future-rpc = { path = "../packages/rpc" }
reqwest = { workspace = true, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

chrono = "0.4"
chrono-tz.workspace = true
sha2 = "0.10"
ignore = "0.4"
fuzzy-matcher = "0.3"
rand = "0.8"

fs2 = "0.4"
tempfile = "3"
nkeys = "0.4"
tonic.workspace = true

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
future-remote-server = { path = "../packages/remote-server", features = ["test-support"] }
future-remote-client = { path = "../packages/remote-client", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
# A real HTTPS endpoint for the relay-CA test: the same rustls provider the
# library installs (`ring`), without pulling a second crypto backend in.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
libc = "0.2"
