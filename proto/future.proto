// future.proto — Protocol Buffers schema for FutureAgent
//
// This is the canonical API definition for the FutureAgent engine.
// Generated Rust code (agent/src/grpc/generated/proto.rs) is used by
// the agent, channel bridge, TUI, and CLI.
//
// Field numbers are stable and MUST NOT be reused.

syntax = "proto3";

package proto;

option go_package = "github.com/futuregene/future-os/proto/go;proto";
option java_package = "ai.proto";
option java_multiple_files = true;

// =============================================================================
// Future Platform URL Resolution — shared contract
// =============================================================================
//
// The agent and the GUI both resolve the Future platform URL from the shared
// config (`~/.future/agent/auth.json`, `future` entry). The production and
// test environments differ ONLY in the host. This block is the single source
// of truth both implementations must follow:
//
//   Canonical hosts:
//     production: https://future-os.cn
//     test:       https://test.future-os.cn
//
//   Platform-root resolution (no `/api` suffix), in precedence order:
//     1. future.base_url, with trailing "/" and "/api" stripped
//        (the storage format every writer uses: `{platform}/api`)
//     2. future.platform_base_url, with trailing "/" stripped (legacy field)
//     3. the production host default
//
//   Derived forms (per consumer):
//     model API base:    {platform}/api      (agent: `{base}/v1/models`, ...)
//     model API display: {platform}/api/v1   (GUI Providers page)
//     auth/account endpoints hang off the platform root itself
//
// Implementations: agent/src/models/future.rs and
// gui/src-tauri/src/future_platform.rs — keep both aligned with this block.

// =============================================================================
// RPC Commands — sent by clients (TUI / channel bridge / CLI) to the agent
// =============================================================================

message RpcCommand {
  // Unique request correlation ID (UUID v4).  Echoed back in RpcResponse.id
  // so the client can match requests to responses.
  string id = 1;

  // Command name, e.g. "prompt", "get_state", "new_session", "abort".
  // Determines which handler processes this request.
  string type = 2;

  // ── Prompting ──────────────────────────────────────────────────────────

  // User prompt text. Required for "prompt".
  string message = 10;

  // Images attached to the prompt (base64, URL, or file path).
  repeated ImageContent images = 11;

  reserved 12;

  // ── fork / new_session ─────────────────────────────────────────────────

  // Parent session ID when forking.  If empty, fork uses the current
  // session.  Also used by new_session to record lineage.
  string parent_session = 20;

  // ── set_model ──────────────────────────────────────────────────────────

  // Canonical model ID.  If it contains a "/", the part before the slash
  // is treated as the provider.  Example: "deepseek/deepseek-chat".
  string model_id = 31;

  // ── set_thinking_level ─────────────────────────────────────────────────

  // Thinking level: "off", "minimal", "low", "medium", "high", "xhigh".
  string level = 40;

  // Generic decision/rule mode (approval_result, add_session_rule).
  string mode = 50;

  // ── compact ────────────────────────────────────────────────────────────

  // Optional custom instructions for the compaction summariser.
  string custom_instructions = 60;

  // ── set_auto_compaction / set_auto_retry ───────────────────────────────

  // Toggle flag (true = on, false = off).
  bool enabled = 70;

  // ── shell (execute shell command via the agent) ─────────────────────────

  // Shell command string.  Used when cmd_type = "shell".
  string command = 80;

  // ── Session bookkeeping ────────────────────────────────────────────────

  // Target session ID.  Almost every command requires this so the
  // agent knows which session to operate on.  new_session uses it
  // as the requested ID (generated if empty).
  string session_id = 91;

  // Entry ID within a session (e.g. a specific tool-call for approval).
  string entry_id = 92;

  // Session name (set by /name command).  Used with set_session_name.
  string name = 93;

  // ── new_session cwd ────────────────────────────────────────────────────

  // Working directory for the new session.  The agent resolves "~" and
  // relative paths.  Defaults to ~/.future/agent/workspace.
  string cwd = 95;

  // ── set_system_prompt ──────────────────────────────────────────────────

  // Custom system prompt that replaces or appends to the built-in prompt.
  string system_prompt = 100;

  // ── set_tools / disable_tools ──────────────────────────────────────────

  // List of tool names to enable (e.g. ["read", "write", "edit", "shell"]).
  repeated string tools = 110;

  // ── set_ephemeral ──────────────────────────────────────────────────────

  // If true, the session is not persisted to disk.
  bool ephemeral = 120;

  // ── set_enabled_models ─────────────────────────────────────────────────

  // List of model IDs that the user is allowed to select.  Empty means
  // all models are available.
  repeated string enabled_models = 130;

  // ── get_events_since (P1) ──────────────────────────────────────────────
  // Replay current-run events with idx > since_idx; run_id scopes the request
  // (a mismatch means the run rolled over and the caller must realign).
  int64 since_idx = 140;
  string run_id = 141;

  // Optional run identity proposed by a client that has already created its
  // local run record. The Agent validates/adopts it atomically and returns the
  // canonical id in the prompt acknowledgement.
  string requested_run_id = 142;

  // Idempotency key for retrying StartRun independently of run identity.
  string client_request_id = 143;

  // Atomic behavior when the session already has an active run:
  // "reject_if_busy" (default), "enqueue_if_busy", or "supersede_session".
  // Empty is interpreted as "reject_if_busy" for backward compatibility.
  string busy_policy = 144;

  // ── set_sandbox_policy ─────────────────────────────────────────────────
  // Session sandbox + approval policy (typed sub-message, not JSON-in-string).
  // Read when type == "set_sandbox_policy".
  SandboxPolicy sandbox_policy = 150;

  // ── Attachments (GUI) ──────────────────────────────────────────────────
  // Structured attachments referenced by absolute local path. The agent
  // injects each file's path into the model-visible message (so the model can
  // read it with its own tools) and records the list in the user entry's meta.
  // Images additionally carry base64 and are sent as image_url when the active
  // model accepts image input; otherwise they degrade to a path reference.
  repeated Attachment attachments = 151;

  // ── list_models ────────────────────────────────────────────────────────

  // When true, the list_models response additionally carries
  // `builtinProviders` — a summary of the agent's built-in provider catalog
  // (id, model count, base URL per provider) — so clients can render the
  // full catalog at runtime instead of compiling it in.
  bool include_builtin_providers = 160;

  // ── new_session ───────────────────────────────────────────────────────

  // Who created the session ("gui", "tui", "cli", a channel id...). The
  // agent defaults to "tui" when absent. Typed replacement for the legacy
  // practice of smuggling {"createdBy":...} JSON through
  // custom_instructions (which belongs to the compact command).
  string created_by = 161;

  // Free-form JSON source metadata recorded with the session (e.g. the
  // GUI's thread/workspace context). Carried as a JSON string: the shape is
  // per-client data, not part of the typed contract.
  string source_meta = 162;

  // ── set_auth ───────────────────────────────────────────────────────────
  // One auth.json entry mutation (typed sub-message, not JSON-in-string).
  // Read when type == "set_auth".
  AuthUpdate auth_update = 170;

  // ── upsert_provider / delete_provider ──────────────────────────────────
  // A models.json `providers` entry (plus optional auth.json key). Read when
  // type == "upsert_provider" or "delete_provider" (the latter uses only `id`).
  ProviderUpsert provider_config = 171;
}

// ── Attachment ───────────────────────────────────────────────────────────────
// A local file the user attached to a prompt. Files are NOT copied — the path
// is the original on-disk location, read on demand by the agent's tools.

message Attachment {
  // Absolute local filesystem path (original, not a workspace copy). For images
  // the agent reads + (down)encodes this to base64 itself — base64 never travels
  // over the wire.
  string path = 1;
  // "image" | "file".
  string kind = 2;
  // Display name (basename), for UI + the injected path block.
  string name = 3;

  reserved 4;  // was `base64` — images are now read from `path` on the agent

  // Optional absolute path to a cached thumbnail (images only). Not model-facing
  // — carried through to the user entry's meta so the GUI can render the chip
  // after a reload (messages are reconstructed from the agent JSONL).
  string thumbnail = 5;
}

// ── SandboxPolicy ────────────────────────────────────────────────────────────
// OS-sandbox boundary + approval policy for a session. The agent enforces the
// sandbox on spawned shell commands (Seatbelt on macOS) and uses the approval
// policy to decide when to raise approval requests. See gui/SANDBOX_PLAN.md.

message SandboxPolicy {
  // Rules live in on-disk files the agent reads directly (gui/APPROVAL_PLAN.md);
  // only the approval tier travels over the wire.
  reserved 1 to 5;  // v1: sandbox_mode / writable_roots / network_access / approval_policy / rules
  reserved 6;        // v2a: bool enabled (superseded by tier)
  // "off" (unrestricted) | "manual" (approval required) | "sandbox" (macOS Seatbelt, macOS only).
  string tier = 7;
}

// ── AuthUpdate ───────────────────────────────────────────────────────────────
// One mutation of an auth.json provider entry, applied by the agent (the sole
// writer of its config files). After applying, the agent rebuilds its model
// registry and refreshes every live session's credentials, so clients no
// longer need a follow-up reload_auth round-trip.

message AuthUpdate {
  // Provider entry name (e.g. "future", "openai").
  string provider = 1;

  // Non-empty: set the entry's "key" field.
  string key = 2;
  // Remove the entry's "key" field (e.g. logout keeps base_url).
  bool clear_key = 3;

  // Non-empty: set the entry's "base_url" field (auth.json field name).
  string base_url = 4;
  // Remove the entry's "base_url" field.
  bool clear_base_url = 5;

  // Remove the whole provider entry.
  bool remove_entry = 6;

  // Remove the legacy "platform_base_url" field (environment switches pin
  // base_url and drop it so the resolved platform is unambiguous).
  bool remove_platform_base_url = 7;
}

// ── ProviderUpsert ───────────────────────────────────────────────────────────
// Create/update a models.json `providers` entry, optionally storing the
// provider's API key in auth.json in the same step. delete_provider also uses
// this message (only `id` is read). Same agent-side refresh as AuthUpdate.

message ProviderUpsert {
  // Provider id — the key in models.json `providers`.
  string id = 1;

  // Non-empty: set "name".
  string name = 2;
  // Non-empty: set "api" (e.g. "openai-completions").
  string api = 3;
  // Non-empty: set the "baseUrl" override.
  string base_url = 4;
  // Remove the "baseUrl" override; the entry is dropped if nothing remains.
  bool clear_base_url = 5;

  // Non-empty: replace the "models" list.
  repeated ProviderModel models = 6;

  // Fail when the provider already exists (create mode; edits must not
  // silently overwrite an existing entry).
  bool create_only = 7;

  // Non-empty: also store as this provider's auth.json "key".
  string api_key = 8;
}

// A model entry under a custom provider, persisted to models.json.
message ProviderModel {
  string id = 1;
  string name = 2;
  // Input modalities, e.g. ["text"] or ["text", "image"].
  repeated string modalities = 3;
}

// ── ImageContent ───────────────────────────────────────────────────────────

message ImageContent {
  // Image source type: "image_url", "image_base64", or "image_file".
  string type = 1;

  // Mutually exclusive content reference.
  oneof content {
    // Remote image URL (HTTP/HTTPS).
    string url = 10;
    // Base64-encoded image data.
    string base64 = 11;
  }

  // Local filesystem path after the image is saved to disk.
  string file_path = 12;
}

// =============================================================================
// RPC Responses — returned by the agent for every ExecuteCommand call
// =============================================================================

message RpcResponse {
  // Echo of the request ID for correlation.
  string id = 1;

  // Fixed literal "response".
  string type = 2;

  // The command this response belongs to (echo of RpcCommand.type).
  string command = 3;

  // true on success, false on error.
  bool success = 4;

  // JSON-serialised response payload.  Structure depends on the command.
  // TRANSITIONAL (typed-RPC migration): for commands that carry a typed
  // `payload`, this string is dual-written with identical semantics so
  // pre-migration clients keep working; new clients read `payload` and fall
  // back to `data` when it is absent. Commands without a ResponsePayload
  // member (trivial acks, get_messages, ...) are served through this field
  // only. The big read commands are documented by the "Response payload
  // contracts" section below: list_sessions / get_state /
  // get_session_entries / get_events_since.
  string data = 5;

  // Error message when success is false.
  string error = 6;

  // Stable machine-readable error code. Additive: legacy handlers may leave it
  // empty and legacy clients may ignore it.
  string error_code = 7;

  // Optional JSON-serialised structured error details.
  string error_data = 8;

  // Typed response payload (typed-RPC migration). Absent on old agents and
  // for commands that have no typed member yet — clients MUST fall back to
  // the JSON `data` string when unset. Field numbers 9-19 are reserved for
  // future envelope fields; payload kinds are allocated in ResponsePayload.
  ResponsePayload payload = 20;
}

// ── Typed response payloads ─────────────────────────────────────────────────
// Wire contract for RpcResponse.payload. Each member is the typed form of one
// command's response; member allocation is append-only (never reuse numbers).
// Members whose JSON shape was previously only documented ("Response payload
// contracts" section) now travel the wire for real. Commands not listed here
// stay on the JSON `data` string during the migration window.

message ResponsePayload {
  oneof kind {
    SessionState get_state = 1;
    ListSessionsResponse list_sessions = 2;
    SessionEntriesResponse get_session_entries = 3;
    EventsSince get_events_since = 4;
    PromptAck prompt = 5;
    ListModelsResponse list_models = 6;
    AgentInfo get_agent_info = 7;
    CommandsResponse get_commands = 8;
    CompactResult compact = 9;
    ShellResult shell = 10;
    CycleModelResult cycle_model = 11;
    SyncFutureModelsResult sync_future_models = 12;
    RefreshSkillsResult refresh_skills = 13;
    SessionEventsSinceResponse get_session_events_since = 14;
    SessionStatsResponse get_session_stats = 15;
    RuntimeMetricsResponse get_runtime_metrics = 16;
  }
}

// list_sessions response wrapper.
message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
}

// get_session_entries response wrapper.
message SessionEntriesResponse {
  repeated SessionEntry entries = 1;
}

// Acknowledgement of an accepted prompt command. Field names mirror the
// on-disk/wire JSON spelling (snake_case).
message PromptAck {
  string run_id = 1;
  uint64 run_epoch = 2;
  // "existing" | "running" | "queued".
  string accepted_state = 3;
  // Absent until the session scheduler allocates them (queued runs).
  optional uint64 run_sequence = 4;
  optional uint64 queue_position = 5;
}

// list_models response.
message ListModelsResponse {
  repeated ModelEntry models = 1;
  string default_model = 2;
  bool is_scoped = 3;
  // Built-in provider catalog summary, keyed by provider id; present only
  // when the command set include_builtin_providers.
  map<string, BuiltinProvider> builtin_providers = 4;
}

message ModelEntry {
  string id = 1;
  string label = 2;
  string provider = 3;
  bool supports_images = 4;
  // Default thinking level for the model ("high" for reasoning models,
  // "off" otherwise).
  string thinking_level = 5;
  int64 context_window = 6;
  bool is_default = 7;
  string description = 8;
  string description_en = 9;
  bool recommended = 10;
}

message BuiltinProvider {
  string name = 1;
  uint64 model_count = 2;
  string base_url = 3;
}

// get_agent_info response.
message AgentInfo {
  string version = 1;
  string agent_instance_id = 2;
  uint64 skills_count = 3;
}

// get_commands response.
message CommandsResponse {
  repeated Command commands = 1;
}

message Command {
  string name = 1;
  string description = 2;
  string name_zh = 3;
  string description_zh = 4;
  // Origin of the command, e.g. "skill".
  string source = 5;
}

// compact response.
message CompactResult {
  int64 tokens_before = 1;
  int64 tokens_after = 2;
  string summary = 3;
  int64 messages_removed = 4;
}

// shell response.
message ShellResult {
  string output = 1;
  int32 exit_code = 2;
}

// cycle_model response.
message CycleModelResult {
  string model = 1;
  string thinking_level = 2;
  // Absent on the empty-catalog edge case (matches the JSON shape).
  optional bool is_scoped = 3;
}

// sync_future_models response.
message SyncFutureModelsResult {
  bool synced = 1;
  uint64 model_count = 2;
}

// refresh_skills response. Field names mirror the wire JSON spelling
  // (snake_case).
message RefreshSkillsResult {
  uint64 skills_count = 1;
  repeated string skills = 2;
  bool refreshed = 3;
}

// get_session_events_since response.
message SessionEventsSinceResponse {
  repeated SessionEventRecord events = 1;
}

// One session-scoped event as replayed by get_session_events_since. The
// `data` string carries the event's JSON payload (see StreamEvent.data).
message SessionEventRecord {
  string type = 1;
  string data = 2;
  string session_id = 3;
  int64 session_idx = 4;
  string event_id = 5;
  string timestamp = 6;
}

// get_session_stats response.
message SessionStatsResponse {
  string session_file = 1;
  string session_id = 2;
  uint64 user_messages = 3;
  uint64 assistant_messages = 4;
  uint64 tool_calls = 5;
  uint64 tool_results = 6;
  uint64 total_messages = 7;
  StatsTokens tokens = 8;
  double cost = 9;
}

message StatsTokens {
  int64 input = 1;
  int64 output = 2;
  int64 cache_read = 3;
  int64 total = 4;
}

// get_runtime_metrics response.
message RuntimeMetricsResponse {
  string session_id = 1;
  uint64 active_run_gauge = 2;
  uint64 stale_epoch_drops = 3;
  uint64 persistence_degraded = 4;
  uint64 broadcast_lag = 5;
  uint64 ring_truncations = 6;
  // Absent when no run snapshot exists.
  optional string active_run_id = 7;
  uint64 queued_runs = 8;
  uint64 queued_bytes = 9;
  bool event_journal_healthy = 10;
  // Absent when the journal is healthy.
  optional string event_journal_error = 11;
}

// ── Typed event payloads ────────────────────────────────────────────────────
// Wire contract for the `payload` field shared by StreamEvent,
// ProjectedRunEvent and ReplayEvent. One member per semantically parsed event
// type; pass-through events (settings changes, ping, ...) stay on the JSON
// `data` string. Member allocation is append-only.

message EventPayload {
  oneof kind {
    TextChunk text_chunk = 1;
    ThinkingStart thinking_start = 2;
    ThinkingDelta thinking_delta = 3;
    ThinkingEnd thinking_end = 4;
    AgentStart agent_start = 5;
    AgentEnd agent_end = 6;
    ToolStart tool_start = 7;
    ToolDelta tool_delta = 8;
    ToolEnd tool_end = 9;
    ApprovalRequestInfo approval_request = 10;
    ApprovalDecisionEvent approval_decision = 11;
    UsageEvent usage = 12;
    ErrorEvent error = 13;
    UserMessageEvent user_message = 14;
  }
}

message TextChunk {
  string text = 1;
}

message ThinkingStart {
  // No payload fields today; the message exists so the event type is typed.
}

message ThinkingDelta {
  string text = 1;
}

message ThinkingEnd {
  // No payload fields today.
}

message AgentStart {
  // Wall-clock run start (ms since epoch) for anchoring elapsed timers.
  uint64 started_at_ms = 1;
}

message AgentEnd {
  // Terminal state ("completed", "cancelled", "error", ...); absent on the
  // early task-spawn failure path.
  optional string state = 1;
  // Present only on failure.
  optional string error = 2;
  // Present when the run measured a duration.
  optional uint64 duration_ms = 3;
  // The run's output-token total (JSON shape: usage.output_tokens).
  optional uint64 output_tokens = 4;
  // "incomplete" when the stream was truncated.
  optional string reason = 5;
}

message ToolStart {
  string tool_id = 1;
  string tool_name = 2;
  // Tool-call arguments, JSON-serialised (object or JSON-encoded string,
  // mirroring the wire).
  string tool_args = 3;
}

message ToolDelta {
  string tool_id = 1;
  // Streaming tool-argument fragment.
  string text = 2;
  // Tool-call index within the assistant message, when > 0.
  optional int32 tc_index = 3;
}

message ToolEnd {
  string tool_id = 1;
  string tool_name = 2;
  // Tool output text.
  string text = 3;
  optional string error = 4;
  // Structured semantics (consumers must not re-parse `text` for these):
  // shell results carry exit_code (+ is_soft_fail for bare grep/diff/cmp/
  // test/findstr exit 1); write/edit carry target_path.
  optional int32 exit_code = 5;
  optional bool is_soft_fail = 6;
  optional string target_path = 7;
}

// An approval_request card travels as ApprovalRequestInfo (see above): the
// same message backs get_state pendingApprovals, so the full card shape is
// modelled once.

message ApprovalDecisionEvent {
  string approval_request_id = 1;
  string tool_id = 2;
  // "approved" | "rejected" | "cancelled".
  string status = 3;
  string note = 4;
}

message UsageEvent {
  UsageInfo usage = 1;
}

message UsageInfo {
  int64 prompt_tokens = 1;
  int64 completion_tokens = 2;
  int64 total_tokens = 3;
  optional int64 cache_read_tokens = 4;
  optional int64 cache_write_tokens = 5;
  // Provider-reported cost, when present.
  optional double credit_cost = 6;
}

message ErrorEvent {
  string error = 1;
}

message UserMessageEvent {
  string text = 1;
}

// =============================================================================
// Session State — returned by get_state (the fields displayed in /status)
// =============================================================================

message SessionState {
  // Currently active model ID (e.g. "deepseek-v4-pro").
  string model = 1;

  // Thinking / effort level: "off", "minimal", "low", "medium", "high", "xhigh".
  string thinking_level = 2;

  // Whether the agent loop is currently processing a prompt.
  bool is_streaming = 3;

  // Whether a compaction run is in progress (always false in current code).
  bool is_compacting = 4;

  reserved 5, 6;

  // Reserved for session file path.  Always null in current code.
  string session_file = 7;

  // Current session ID (unique, generated on creation).
  string session_id = 8;

  // User-assigned session name, or empty if unnamed.
  string session_name = 9;

  // Whether this session was explicitly created via /new (vs. auto-created).
  bool explicit_session = 10;

  // Whether automatic context compaction is enabled.
  bool auto_compaction_enabled = 11;

  // Number of user prompts. Excludes
  // internal tool/assistant messages.  Displayed as "Queries" in /status.
  int32 query_count = 12;

  // Number of accepted runs queued but not yet started.
  int32 pending_message_count = 13;

  // Agent version string (from Cargo.toml).
  string version = 14;

  // Working directory for the session.
  string cwd = 15;

  // Discovered skill names available in this session.
  repeated string skills = 16;

  // Context file paths loaded via CLAUDE.md / AGENTS.md / GEMINI.md.
  repeated string context_files = 17;

  // Reserved for UI extensions.  Always null in current code.
  repeated string extensions = 18;

  // Current estimated context token count (from last API call's prompt_tokens,
  // with fallback to heuristic estimation).
  int64 context_tokens = 19;

  // Model's maximum context window in tokens.
  int64 context_window = 20;

  // context_tokens as a percentage of context_window (0.0–100.0).
  double context_percent = 21;

  // Cumulative input tokens consumed in this session.
  int64 tokens_in = 22;

  // Cumulative output tokens produced in this session.
  int64 tokens_out = 23;

  // Cumulative cost in CNY (¥).
  double total_cost = 24;

  // Whether the current model supports image input (multimodal).
  bool image_support = 25;

  // Cumulative cache-read tokens (prompt caching hits).
  int64 tokens_cache_r = 26;

  // Cumulative cache-write tokens (prompt caching writes).
  int64 tokens_cache_w = 27;

  // Tool execution permission level: "all" (unrestricted), "workspace"
  // (cwd only), or "none" (read-only tools).
  string permission_level = 28;

  // ── Full get_state payload ─────────────────────────────────────────────
  // Fields above are the original /status view. The fields below complete the
  // get_state response shape (camelCase keys on the wire). Run/approval
  // sub-objects are typed by the nested messages. Since the typed-RPC
  // migration the whole SessionState travels the wire as
  // ResponsePayload.get_state; the JSON `data` string is dual-written during
  // the migration window.

  // The agent process instance id (changes on every agent restart).
  string agent_instance_id = 29;

  // Parent session id when this session was forked; empty otherwise.
  string parent_session_id = 30;

  // Who created the session ("gui", "tui", "cli", a channel id...).
  string created_by = 31;

  // Free-form source metadata recorded at creation. Carried as an embedded
  // JSON value (the session stores it parsed; typically a JSON string or
  // object, null when absent).
  string source_meta = 32;

  // The currently executing run, absent when idle.
  RunStateSnapshot active_run = 33;

  // Accepted runs queued behind the active one, in queue order.
  repeated QueuedRunState queued_runs = 34;

  // queued_runs.length (carried separately for clients that only poll it).
  int32 queued_count = 35;

  // Restart recovery: a run that began (journal run_started) but never
  // committed (no run_terminal) before the agent restarted.
  RunStateSnapshot interrupted_run = 36;

  // Terminal journal content of the run named in the get_state request's
  // run_id, when present (RunTerminalInfo shape).
  RunTerminalInfo requested_run = 37;

  // Recent terminal acknowledgements for lost-queued-run recovery.
  repeated TerminalAck recent_terminal_acks = 38;

  // Approval requests the session is parked on (full card payloads,
  // ApprovalRequestInfo shape) so a reconnecting client can rebuild its
  // approval UI.
  repeated ApprovalRequestInfo pending_approvals = 39;
}

// ── get_state sub-objects ───────────────────────────────────────────────────
// Wire note: these travel both as typed sub-messages of SessionState
// (ResponsePayload.get_state) and, during the migration window, inside the
// dual-written camelCase JSON `data`. The agent ALSO emits the legacy
// spellings (`session_name`, snake_case TerminalAck keys) alongside the
// canonical ones in the JSON; new clients read canonical, pre-migration
// clients keep reading legacy.

// A run's live state as surfaced by get_state (activeRun / interruptedRun).
message RunStateSnapshot {
  string run_id = 1;
  // Absent when the epoch is unknown (interrupted-run recovery).
  optional int64 epoch = 2;
  // Absent when the run sequence is unknown (interrupted-run recovery);
  // JSON null on the wire maps to unset.
  optional int64 run_sequence = 3;
  // Run phase ("running"...) or "interrupted_by_restart" for recovery.
  string state = 4;
  // Last broadcast event idx (active runs only).
  optional int64 last_event_idx = 5;
}

// An accepted run waiting in the session's queue.
message QueuedRunState {
  string run_id = 1;
  int64 run_sequence = 2;
  string client_request_id = 3;
  // Always "queued".
  string state = 4;
  int32 queue_position = 5;
  // RFC3339 acceptance time.
  string accepted_at = 6;
  // The user's prompt text, for queue display.
  string display_text = 7;
}

// Terminal journal content of one run (requestedRun). Keys mirror the
// on-disk run_terminal marker (snake_case).
message RunTerminalInfo {
  string run_id = 1;
  // "completed" | "failed" | "cancelled" | ...
  string state = 2;
  int64 run_tokens = 3;
  int64 run_duration_ms = 4;
  // Present only on failure.
  optional string error = 5;
}

// A recent terminal acknowledgement for a queued run whose terminal state the
// client may have missed (e.g. across an agent restart).
message TerminalAck {
  string run_id = 1;
  int64 run_sequence = 2;
  string client_request_id = 3;
  // "terminal" | "cancelled" | "failed".
  string state = 4;
  // e.g. "superseded".
  string reason = 5;
}

// An approval_request card the session is parked on. Tool-specific extras
// (message, suggestions, ...) pass through alongside these fields.
message ApprovalRequestInfo {
  string approval_request_id = 1;
  string session_id = 2;
  string tool_name = 3;
  string tool_id = 4;
  // "tool" | ...
  string kind = 5;
  string title = 6;
  // The structured action payload, JSON-serialised.
  string action = 7;
  // Card fields added by the typed-RPC migration (the approval_request event
  // and get_state pendingApprovals carry the full card).
  string risk_level = 8;
  string summary = 9;
  // The requested action, JSON-serialised (object on the wire).
  string requested_action = 10;
  // Sandbox boundary payload, JSON-serialised; empty when null on the wire.
  string sandbox_boundary = 11;
  // Suggested persisted rule, JSON-serialised; unset when the card carries
  // JSON null (kinds that should not persist a rule).
  optional string save_suggestion = 12;
  // Who must review ("user").
  string reviewer = 13;
  // JSON catch-all for tool-specific fields not modelled above.
  string extras = 14;
}

// =============================================================================
// Response payload contracts — the four big read commands
// =============================================================================
//
// These messages serve double duty. (1) They are the canonical shape of the
// JSON the agent serializes into RpcResponse.data for the big read commands,
// produced by its Rust payload structs (future-rpc `payloads`). (2) Since the
// typed-RPC migration they ALSO travel the wire for real, as members of
// RpcResponse.payload (see ResponsePayload): get_state -> SessionState,
// list_sessions -> ListSessionsResponse{sessions: SessionSummary[]},
// get_session_entries -> SessionEntriesResponse{entries: SessionEntry[]},
// get_events_since -> EventsSince.
//
// During the migration window the agent dual-writes both the typed payload and
// the JSON `data`; new clients read the typed payload and fall back to `data`
// when it is absent (old agent). Fields marked `optional` preserve the
// null-vs-absent semantics of the JSON shape.
//
// Wire casing: list_sessions / get_state / get_events_since are camelCase
// JSON; get_session_entries mirrors the on-disk entry schema (snake_case).
// For one migration window the agent additionally emits legacy aliases for
// the keys that changed spelling (list_sessions snake_case keys; get_state
// `session_name` and snake_case TerminalAck keys) so pre-migration clients
// keep working — new clients read the canonical keys only.

// One row of the list_sessions response.
message SessionSummary {
  string id = 1;
  // User-assigned session name; unset when unnamed (JSON null on the wire).
  optional string session_name = 2;
  string model = 3;
  string cwd = 4;
  // "YYYY-MM-DD HH:MM:SS" (local time).
  string updated_at = 5;
  string parent_session_id = 6;
  // First user message, for list display; unset when absent (JSON null).
  optional string first_message = 7;
  int32 query_count = 8;
  // Whether the agent is streaming a response for this session right now.
  bool is_streaming = 9;
}

// One displayable entry of a session (get_session_entries). Field names match
// the on-disk JSONL schema. Like all payload-contract messages this is
// documentation of JSON packed into a string, not a wire type — several fields
// below are declared `string` but carry *serialized JSON* (an object/array) as
// their value; consumers must JSON-parse them. This is called out per field
// rather than pretending the shape is a scalar string.
message SessionEntry {
  string id = 1;
  // "user" | "assistant" | "tool" (the entry's message role).
  string role = 2;
  // Display text for message entries; the RAW session_info JSON object
  // serialized to a string for the session_info entry — a `string` here that is
  // NOT plain text in that case (see content_is_object).
  string content = 3;
  string name = 4;
  // Tool call arguments, tool entries. Serialized JSON object (a JSON string).
  string tool_args = 5;
  // RFC3339.
  string timestamp = 6;
  // Reasoning text, assistant entries (absent when empty).
  optional string thinking = 7;
  // Structured per-entry metadata (e.g. user attachments). Serialized JSON
  // object in a string, not a scalar; absent when the entry has none.
  optional string meta = 8;
  // Pending tool calls, assistant entries. Serialized JSON array of ToolCall;
  // absent when the entry has none.
  optional string tool_calls = 9;
  // Output tokens of the run this reply concluded (footer display).
  optional int64 output_tokens = 10;
  // Wall-clock duration of that run in ms (footer display).
  optional int64 duration_ms = 11;
  // Discriminator for `content`: true when the original JSON value was an
  // object (the session_info entry) and the string carries serialized JSON;
  // false when it is plain display text. Lets decoders re-inflate `content`
  // into the exact original JSON value.
  bool content_is_object = 12;
}

// One event as replayed by get_events_since. Field names mirror the
// StreamEvent envelope.
message ReplayEvent {
  string type = 1;
  // JSON-serialised event payload (see StreamEvent.data).
  string data = 2;
  string run_id = 3;
  int64 idx = 4;
  string session_id = 5;
  int64 epoch = 6;
  string event_id = 7;
  string timestamp = 8;
  int64 session_idx = 9;
  int64 run_sequence = 10;

  // Typed event payload; see StreamEvent.payload. Kept in sync with `data`
  // so replayed events decode through the same path as live ones.
  EventPayload payload = 20;
}

// get_events_since response. When the requested cursor predates the replay
// ring, `projection` replaces the event tail with a compressed snapshot.
message EventsSince {
  string run_id = 1;
  repeated ReplayEvent events = 2;
  // True when `projection` carries a snapshot instead of a complete tail.
  bool truncated = 3;
  ProjectionSnapshot projection = 4;
}

// A compressed projection of a run's events (coalesced deltas).
message ProjectionSnapshot {
  string run_id = 1;
  int64 cursor = 2;
  repeated ReplayEvent events = 3;
}

// =============================================================================
// gRPC Service Definition
// =============================================================================

service FutureAgent {
  // Unary RPC: send a command, get a response.
  // Used by the TUI and channel bridge for all non-streaming operations
  // (prompt, get_state, new_session, abort, set_model, etc.).
  rpc ExecuteCommand(RpcCommand) returns (RpcResponse);

  // Server-side streaming RPC: subscribe to agent events.
  // The TUI uses this for real-time text/tool/thinking updates.
  rpc StreamEvents(StreamRequest) returns (stream StreamEvent);
}

// ── StreamRequest ───────────────────────────────────────────────────────────

message StreamRequest {
  // Optional list of event types to receive.  Empty = all events.
  // Valid types: "ping", "agent_start", "agent_end", "text_chunk",
  // "thinking_start", "thinking_delta", "thinking_end", "tool_start",
  // "tool_delta", "tool_end", "approval_request", "error", "stop".
  repeated string event_types = 1;

  // Scope events to a specific session.  Required so the agent
  // knows which session's broadcaster to subscribe to.
  string session_id = 2;

  // Atomic resume parameters. When atomic_attach is true, the server registers
  // the receiver and snapshots buffered events under the journal's same lock.
  string run_id = 3;
  int64 after_idx = 4;
  bool atomic_attach = 5;
}

// ── StreamEvent ─────────────────────────────────────────────────────────────

message StreamEvent {
  // Event type string (see StreamRequest.event_types).
  //
  // Canonical vocabulary (all clients key off these):
  //   agent_start / agent_end      run lifecycle (agent_start carries the run's
  //                                started_at_ms; agent_end carries error/usage/
  //                                duration_ms — the authoritative run totals)
  //   user_message                 the user's prompt message
  //   text_chunk                   assistant text token (the projected token stream)
  //   thinking_start / thinking_delta / thinking_end   reasoning stream
  //   tool_start                   tool execution began  {tool_id, tool_name, tool_args}
  //   tool_delta                   streaming tool-arg fragment {tool_id, text}
  //   tool_end                     tool execution finished {tool_id, text, error?,
  //                                exit_code?, is_soft_fail?, target_path?}
  //   approval_request / approval_decision
  //   usage                        token accounting
  //   error                        run error
  //   tool_sandboxed / persistence_error / compaction_end   sideband signals
  //
  // Provider-specific aliases are normalized inside the Agent and never cross
  // this RPC boundary.
  string type = 1;

  // JSON-serialised event payload.  Structure depends on the event type.
  // Examples:
  //   text_chunk:    {"text": "Hello"}
  //   thinking_delta: {"text": "I need to..."}
  //   tool_start:    {"tool_id": "...", "tool_name": "read"}
  //   tool_end:      {"tool_id": "...", "text": "output..."}
  //                  plus structured semantics when applicable: shell results
  //                  carry exit_code (and is_soft_fail for a bare
  //                  grep/diff/cmp/test/findstr exit 1); write/edit carry
  //                  target_path. Consumers must not re-parse `text` for these.
  //   tool_delta:    {"tool_id": "...", "text": "partial args..."}
  //   approval_request: {"approval_request_id": "...", "tool_name": "shell", ...}
  //   agent_start:   {"started_at_ms": 1750000000000}
  //   agent_end:     {"error": "...", "usage": {"output_tokens": N}, "duration_ms": N}
  //                  (error present only on failure)
  string data = 2;

  // P1: client-side ordering/dedup. run_id is unique per user run (assigned once
  // at the is_streaming false→true edge); idx is monotonic within a run.
  string run_id = 3;
  int64 idx = 4;

  // When true, this frame replaces the consumer's local projection through
  // snapshot_cursor. It is returned by atomic AttachRun when the requested
  // cursor predates the bounded replay ring.
  bool projection_snapshot = 5;
  repeated ProjectedRunEvent snapshot_events = 6;
  int64 snapshot_cursor = 7;

  // Canonical run identity (P1 envelope). session_id scopes the event to its
  // conversation; epoch is the run's monotonic generation within the session
  // (a run accepted after an abort/restart gets a higher epoch). Together with
  // run_id + idx these let any consumer route, dedup and detect gaps without
  // external context.
  string session_id = 8;
  int64 epoch = 9;
  string event_id = 10;
  string timestamp = 11;
  // Monotonic ordering identity for session-scoped events (settings, name,
  // cwd, config). It is independent of any run's idx.
  int64 session_idx = 12;
  // Monotonic ordering identity across runs in this session.
  int64 run_sequence = 13;

  // Typed event payload (typed-RPC migration). Absent on old agents and for
  // pass-through event types — consumers MUST fall back to the JSON `data`
  // string when unset. Dual-written with `data` during the migration window.
  // Field numbers 14-19 are reserved for future envelope fields.
  EventPayload payload = 20;
}

// A compressed semantic event contained in a projection snapshot. Its idx is
// the latest source cursor folded into this event, preserving chronological
// ordering while allowing adjacent token deltas to be coalesced.
message ProjectedRunEvent {
  string type = 1;
  string data = 2;
  int64 idx = 3;

  // Typed event payload; see StreamEvent.payload. Kept in sync with `data`
  // so projection snapshots and live frames decode through one path.
  EventPayload payload = 20;
}
