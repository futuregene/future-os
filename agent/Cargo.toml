[package]
name = "future-agent"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "future-agent"
path = "src/main.rs"

[lib]
name = "future_agent"
path = "src/lib.rs"

[features]
# Heap (memory) profiling via dhat.  Build with `--features dhat-heap` and
# run with `--profile-heap <PATH>` to get a dhat-heap JSON report.
dhat-heap = ["dep:dhat"]

[dependencies]
future-rpc = { path = "../packages/rpc" }
future-http = { path = "../packages/http" }
tokio.workspace = true
parking_lot.workspace = true
crossbeam-channel = "0.5"
serde.workspace = true
# preserve_order: session-list JSON key order must be deterministic across
# build modes. Without it, the order silently depends on cargo feature
# unification with the CLI's serde_json (BTreeMap-sorted when the agent builds
# alone, insertion order when built in the workspace graph) — which flips the
# golden harness's `session list --json` output. Enabled explicitly so the
# wire order is always the struct-declaration (insertion) order.
serde_json = { workspace = true, features = ["preserve_order"] }
serde_with = "3"
reqwest = { workspace = true, features = ["query", "form", "stream", "json", "rustls-no-provider", "blocking"] }
futures.workspace = true
futures-util.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
anyhow.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
walkdir = "2"
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
regex = "1"
unicode-width = "0.2.2"
# The session export renders the model's markdown rather than dumping it as
# text; kept in step with the TUI's own renderer.
pulldown-cmark = "0.13"
rand = "0.8"
sha2 = "0.10"
fs2 = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
semver = "1"
base32 = "0.5"
base64.workspace = true
tempfile.workspace = true
# Decode/resize/re-encode user-attached images before sending them to a vision
# model (downscale oversized images so they don't blow up the LLM request).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
fd-lock = "4"
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks"] }
signal-hook = "0.4"

async-trait.workspace = true
# gRPC
tonic.workspace = true
prost.workspace = true
prost-types = "0.13"
tower-http = { version = "0.7", features = ["cors"] }

# Optional: heap profiling support (feature `dhat-heap`).  The global
# allocator shim lives in main.rs and is compiled only with the feature.
dhat = { version = "0.3", optional = true }

# Kill the whole bash process group on abort/timeout (not just the direct child)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Profiling flamegraph output uses inferno behind the scenes.
[target.'cfg(not(windows))'.dependencies]
pprof = { version = "0.15", features = ["flamegraph"] }

# Windows: Job Object for process-tree kill; restricted token + ACLs for the
# Windows shell write protection (docs/internals/desktop/SANDBOX/WINDOWS.md).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# paused-clock tests: the idle-history release is a real 30 s sleep otherwise.
tokio = { workspace = true, features = ["test-util"] }
tokio-test = "0.4"
tempfile.workspace = true
